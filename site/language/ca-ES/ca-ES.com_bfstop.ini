COM_BFSTOP_UNBLOCKTOKEN_HEADING="Desbloquejar per Token"
COM_BFSTOP_UNBLOCKTOKEN_FAILED="No es pot desbloquejar. El token no era vàlid, ja ha caducat o ha ocorregut un error. Posa't en contacte amb l'administrador del sistema."
COM_BFSTOP_UNBLOCKTOKEN_SUCCESS="S'ha desbloquejat amb èxit la teva adreça IP. Si creus que ja saps les dades del teu compte, pots intentar de nou iniciar la sessió a la <a href='%s'>Pàgina d'ingrés</a> però seràs bloquejat de nou si introdueixes el teu nom d'usuari o contrasenya incorrectament de nou diverses vegades. També pots utilitzar la funcionalitat de <a href='%s'>Restablir contrasenya</a> per rebre instruccions per correu electrònic per restablir-la."
COM_BFSTOP_UNBLOCKTOKEN_INVALID="Desbloqueig no vàlid!"
COM_BFSTOP_UNBLOCKTOKEN_CONFIRM="Confirmeu que voleu desbloquejar la vostra adreça IP. Aquest enllaç només funciona des de l'adreça IP que es va bloquejar."
COM_BFSTOP_UNBLOCKTOKEN_BUTTON="Desbloqueja la meva adreça IP"
COM_BFSTOP_UNBLOCKTOKEN_WRONG_IP="Aquest enllaç només pot desbloquejar l'adreça IP per a la qual es va emetre. Torneu-lo a obrir des del dispositiu i la xarxa des dels quals se us va bloquejar."
