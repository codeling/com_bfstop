COM_BFSTOP_UNBLOCKTOKEN_BUTTON="Meine IP-Adresse entsperren"
COM_BFSTOP_UNBLOCKTOKEN_WRONG_IP="Dieser Link kann nur die IP-Adresse entsperren, für die er ausgestellt wurde. Bitte öffne ihn erneut auf dem Gerät und im Netzwerk, von dem aus du gesperrt wurdest."
