COM_BFSTOP_UNBLOCKTOKEN_HEADING="Entsperren via Token"
COM_BFSTOP_UNBLOCKTOKEN_FAILED="Entsperren fehlgeschlagen. Entweder war das angegebene Token ungültig, es ist bereits abgelaufen, oder es ist ein Fehler aufgetreten. Bitte kontaktiere den System-Administrator."
