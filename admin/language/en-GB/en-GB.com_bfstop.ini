COM_BFSTOP_WARNING_COMPONENT_PLUGIN_DIFFERENT_VERSION="BFStop plugin and component seem to be installed in different versions. Please install the latest bfstop package from <a href='https://bfstop.bfroehler.info'>the bfstop page</a> or the <a href='https://extensions.joomla.org/'>Joomla Extensions Directory</a>!"
COM_BFSTOP_WARNING_PLUGIN_DISABLED="BFStop plugin is not enabled! Please go to the <a href=\"%s\">plugin overview</a>, click on the entry 'System - Brute Force Stop' (you can search for this or parts of it in order to find the plugin faster in the long list), and set it to enabled; check whether settings are set up according to your needs, then save it!"
COM_BFSTOP_WARNING_PROXY_NOT_CONFIGURED="A proxy/load balancer header (e.g. X-Forwarded-For) was detected on this request, but 'Behind a proxy / load balancer' is not enabled in the plugin settings. Without this configured, BFStop only trusts the direct connection address, so IP-based blocking may not work correctly behind your proxy. If your site does sit behind a reverse proxy or load balancer, go to the plugin settings and enable and configure the 'Proxy / Load Balancer' options - otherwise a visitor could forge this header to get an arbitrary IP address blocked."
