COM_BFSTOP_SETTINGS_ACCOUNT_FIELDSET_LABEL="Account-level Throttle"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_ENABLED_LABEL="Enable Account-level Throttle"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_ENABLED_DESC="Whether to also count failed logins per username, added up across every source IP address that attempted them - not just per IP address. This catches a distributed attack that spreads attempts against one account across many different IPs, which the regular per-IP block threshold alone cannot detect. The account itself is never locked out; only failed attempts get progressively delayed."
COM_BFSTOP_SETTINGS_ACCOUNT_BLOCK_NUMBER_LABEL="Failed Attempts Before Throttling"
COM_BFSTOP_SETTINGS_ACCOUNT_BLOCK_NUMBER_DESC="How many failed logins for the same username, combined across all source IP addresses, within the counting window below, before further attempts for that username get an additional delay."
COM_BFSTOP_SETTINGS_ACCOUNT_CHECK_INTERVAL_LABEL="Counting Window (Minutes)"
COM_BFSTOP_SETTINGS_ACCOUNT_CHECK_INTERVAL_DESC="The time window (in minutes) within which failed attempts for the same username are counted, regardless of source IP address."
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_DELAY_LABEL="Additional Delay (Seconds)"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_DELAY_DESC="How many seconds of additional delay to add to every further failed login for a throttled username, on top of any other delay already configured."
COM_BFSTOP_SETTINGS_RISK_FIELDSET_LABEL="Adaptive Risk Scoring"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_ENABLED_LABEL="Enable Known-IP Trust Signal"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_ENABLED_DESC="If enabled, a failed login is treated as less risky (more attempts allowed) when the same IP address has previously logged in successfully as that exact username. Scoped to the (IP, username) pair, not the IP alone, so logging in as one user cannot lower the risk score for attempts against a different username from the same IP."
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_POINTS_LABEL="Known-IP Trust Points"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_POINTS_DESC="How many risk points to subtract (i.e. how much more trusted to treat the attempt) when the known-IP signal matches."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_ENABLED_LABEL="Enable Common-Username Signal"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_ENABLED_DESC="If enabled, a failed login is treated as more risky (fewer attempts allowed) when the attempted username matches one of the common/high-value usernames listed below."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_LIST_LABEL="Common Usernames"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_LIST_DESC="One username per line (case-insensitive). Attempts against any of these usernames are treated as more risky."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_POINTS_LABEL="Common-Username Points"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_POINTS_DESC="How many risk points to add when the attempted username matches the common-username list."
COM_BFSTOP_SETTINGS_RISK_USERAGENT_ENABLED_LABEL="Enable Missing-User-Agent Signal"
COM_BFSTOP_SETTINGS_RISK_USERAGENT_ENABLED_DESC="If enabled, a failed login with no (or an empty) browser User-Agent header is treated as more risky - real browsers always send one, but many unsophisticated automated login scripts don't bother setting it."
COM_BFSTOP_SETTINGS_RISK_USERAGENT_POINTS_LABEL="Missing-User-Agent Points"
COM_BFSTOP_SETTINGS_RISK_USERAGENT_POINTS_DESC="How many risk points to add when the request has no User-Agent header."
COM_BFSTOP_SETTINGS_RISK_DELAY_PER_POINT_LABEL="Delay Seconds Per Risk Point"
COM_BFSTOP_SETTINGS_RISK_DELAY_PER_POINT_DESC="How many seconds of additional delay to add per positive (risky) point of the combined risk score, on top of the delay configured above. A negative (trusted) score never reduces the delay below what's configured above."
COM_BFSTOP_SETTINGS_RISK_BLOCK_REDUCTION_PER_POINT_LABEL="Block Threshold Change Per Risk Point"
COM_BFSTOP_SETTINGS_RISK_BLOCK_REDUCTION_PER_POINT_DESC="How much to reduce (for a positive/risky score) or increase (for a negative/trusted score) the number of allowed failed attempts before blocking, per point of the combined risk score."
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_LABEL="Minimum Allowed Attempts"
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_DESC="A hard floor on the risk-adjusted number of allowed failed attempts, so an extreme risk score can never reduce it to zero (or below) and effectively block on the very first attempt."
