COM_BFSTOP_INSTALL_HINT="Brute Force Stop protegeix el lloc amb la configuració per defecte tan bon punt s'instal·la el seu connector (el paquet l'instal·la i l'activa). Revisa la configuració a la <a href=\"%s\">vista de configuració del component</a>."
COM_BFSTOP_SETTINGS_ACCOUNT_FIELDSET_LABEL="Limitació a nivell de compte"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_ENABLED_LABEL="Activa la limitació a nivell de compte"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_ENABLED_DESC="Si, a més, s'han de comptar els inicis de sessió fallits per nom d'usuari, sumant totes les adreces IP d'origen que els han intentat, i no només per adreça IP. Així es detecta un atac distribuït que reparteix els intents contra un mateix compte entre moltes IP diferents, cosa que el llindar de bloqueig habitual per IP no pot detectar per si sol. El compte mateix mai no es bloqueja; només s'endarrereixen progressivament els intents fallits."
COM_BFSTOP_SETTINGS_ACCOUNT_BLOCK_NUMBER_LABEL="Intents fallits abans de limitar"
COM_BFSTOP_SETTINGS_ACCOUNT_BLOCK_NUMBER_DESC="Quants inicis de sessió fallits amb el mateix nom d'usuari, sumant totes les adreces IP d'origen, dins de la finestra de recompte indicada més avall, calen perquè els intents següents amb aquest nom d'usuari rebin un retard addicional."
COM_BFSTOP_SETTINGS_ACCOUNT_CHECK_INTERVAL_LABEL="Finestra de recompte (minuts)"
COM_BFSTOP_SETTINGS_ACCOUNT_CHECK_INTERVAL_DESC="La finestra de temps (en minuts) dins de la qual es compten els intents fallits amb el mateix nom d'usuari, independentment de l'adreça IP d'origen."
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_DELAY_LABEL="Retard addicional (segons)"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_DELAY_DESC="Quants segons de retard addicional s'afegeixen a cada nou inici de sessió fallit d'un nom d'usuari limitat, a més de qualsevol altre retard ja configurat."
COM_BFSTOP_SETTINGS_GEOIP_FIELDSET_LABEL="Base de dades GeoIP"
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_LABEL="Ruta de la base de dades GeoIP"
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_DESC="Ruta completa al sistema de fitxers del servidor d'una base de dades .mmdb de MaxMind GeoLite2 (o GeoIP2), per exemple GeoLite2-City.mmdb. Baixeu-vos la vostra pròpia còpia de MaxMind (cal un compte gratuït): BFStop no inclou ni redistribueix aquestes dades. Cal una base de dades del nivell City perquè la vista «Informació de l'adreça IP» mostri regió, ciutat i coordenades; per al senyal de puntuació de risc adaptativa indicada més avall n'hi ha prou amb una base de dades del nivell Country. Deixeu-la buida per desactivar totes dues funcions. La consulta és totalment local; cap adreça IP no s'envia mai a tercers."
COM_BFSTOP_SETTINGS_RISK_FIELDSET_LABEL="Puntuació de risc adaptativa"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_ENABLED_LABEL="Activa el senyal de confiança d'IP coneguda"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_ENABLED_DESC="Si està activat, un inici de sessió fallit es considera menys arriscat (es permeten més intents) quan aquesta mateixa adreça IP ja ha iniciat sessió correctament amb exactament aquest nom d'usuari. S'aplica al parell (IP, nom d'usuari) i no només a la IP, de manera que iniciar sessió amb un usuari no pot reduir la puntuació de risc dels intents contra un altre nom d'usuari des de la mateixa IP."
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_POINTS_LABEL="Punts de confiança d'IP coneguda"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_POINTS_DESC="Quants punts de risc es resten (és a dir, quanta més confiança es concedeix a l'intent) quan es compleix el senyal d'IP coneguda."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_ENABLED_LABEL="Activa el senyal de nom d'usuari comú"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_ENABLED_DESC="Si està activat, un inici de sessió fallit es considera més arriscat (es permeten menys intents) quan el nom d'usuari utilitzat coincideix amb un dels noms comuns o de gran valor indicats més avall."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_LIST_LABEL="Noms d'usuari comuns"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_LIST_DESC="Un nom d'usuari per línia (sense distingir majúscules de minúscules). Els intents contra qualsevol d'aquests noms es consideren més arriscats."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_POINTS_LABEL="Punts per nom d'usuari comú"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_POINTS_DESC="Quants punts de risc se sumen quan el nom d'usuari utilitzat coincideix amb la llista de noms comuns."
COM_BFSTOP_SETTINGS_RISK_USERAGENT_ENABLED_LABEL="Activa el senyal de User-Agent absent"
COM_BFSTOP_SETTINGS_RISK_USERAGENT_ENABLED_DESC="Si està activat, un inici de sessió fallit sense capçalera User-Agent del navegador (o amb ella buida) es considera més arriscat: els navegadors reals sempre l'envien, però molts scripts d'accés automàtic poc sofisticats no es molesten a establir-la."
COM_BFSTOP_SETTINGS_RISK_USERAGENT_POINTS_LABEL="Punts per User-Agent absent"
COM_BFSTOP_SETTINGS_RISK_USERAGENT_POINTS_DESC="Quants punts de risc se sumen quan la sol·licitud no té capçalera User-Agent."
COM_BFSTOP_SETTINGS_RISK_GEO_ENABLED_LABEL="Activa el senyal GeoIP"
COM_BFSTOP_SETTINGS_RISK_GEO_ENABLED_DESC="Si està activat, un inici de sessió fallit es considera més arriscat quan el país de la IP atacant (consultat a la base de dades GeoIP configurada més amunt) no és un dels països d'origen configurats. Requereix que s'hagi configurat la ruta de la base de dades GeoIP; en cas contrari no fa res."
COM_BFSTOP_SETTINGS_RISK_GEO_HOME_COUNTRIES_LABEL="Països d'origen"
COM_BFSTOP_SETTINGS_RISK_GEO_HOME_COUNTRIES_DESC="Llista separada per comes de codis de país ISO 3166-1 alfa-2 (per exemple «AT,DE,CH») que es consideren la regió esperada o habitual del vostre lloc. Un intent des de qualsevol altre país suma punts de risc."
COM_BFSTOP_SETTINGS_RISK_GEO_POINTS_LABEL="Punts geogràfics"
COM_BFSTOP_SETTINGS_RISK_GEO_POINTS_DESC="Quants punts de risc se sumen quan el país de la IP atacant no és a la llista de països d'origen."
COM_BFSTOP_SETTINGS_RISK_RDNS_ENABLED_LABEL="Activa el senyal de DNS invers"
COM_BFSTOP_SETTINGS_RISK_RDNS_ENABLED_DESC="Si està activat, un inici de sessió fallit des d'una adreça IP sense registre DNS invers (PTR) es considera més arriscat. Advertència: això fa una consulta DNS real, que pot ser lenta o esgotar el temps d'espera ocasionalment; els resultats es guarden a la memòria cau una setmana per IP per limitar-ne la freqüència, però deixeu-ho desactivat tret que entengueu l'equilibri amb la latència."
COM_BFSTOP_SETTINGS_RISK_RDNS_POINTS_LABEL="Punts de DNS invers"
COM_BFSTOP_SETTINGS_RISK_RDNS_POINTS_DESC="Quants punts de risc se sumen quan la IP atacant no té registre DNS invers (PTR)."
COM_BFSTOP_SETTINGS_PROGRESSIVE_BLOCK_DURATION_LABEL="Durada progressiva del bloqueig"
COM_BFSTOP_SETTINGS_PROGRESSIVE_BLOCK_DURATION_DESC="Si està activat, cada vegada que la mateixa adreça IP torna a ser bloquejada, la durada del bloqueig es duplica respecte al bloqueig anterior (fins a un màxim de 64 vegades), en lloc d'utilitzar sempre la mateixa durada fixa. Continua limitada pel pas a bloqueig permanent configurat més avall."
COM_BFSTOP_SETTINGS_BLOCK_MODE_LABEL="Mode de bloqueig"
COM_BFSTOP_SETTINGS_BLOCK_MODE_DESC="Què passa quan es bloqueja una adreça IP. «Només informes» mai no restringeix res: els intents fallits continuen registrant-se, però no es bloqueja cap IP, així que feu-lo servir per observar l'activitat abans d'aplicar res. «Només inici de sessió» deixa que la IP continuï navegant amb normalitat pel lloc (incloent-hi veure el formulari d'accés) i només rebutja l'intent d'inici de sessió mateix; s'assembla més al comportament habitual d'un limitador d'intents d'accés i molesta menys un usuari legítim que només s'ha equivocat en escriure la contrasenya. «Tot el lloc» denega totes les sol·licituds de l'adreça IP bloquejada i mostra el missatge configurat més avall. «Tot el lloc + .htaccess» fa el mateix i, a més, afegeix la IP a .htaccess perquè el mateix servidor web la denegui abans que Joomla (i aquest connector) arribi a veure la sol·licitud; això també vol dir que una IP bloquejada d'aquesta manera no es pot limitar només a l'inici de sessió, per la qual cosa no s'ofereix juntament amb «Només inici de sessió». S'aplica a tots els bloquejos, tant els creats automàticament com els afegits manualment a la llista de bloquejos."
COM_BFSTOP_SETTINGS_BLOCK_MODE_OFF="Només informes"
COM_BFSTOP_SETTINGS_BLOCK_MODE_LOGINONLY="Només inici de sessió"
COM_BFSTOP_SETTINGS_BLOCK_MODE_FULL="Tot el lloc"
COM_BFSTOP_SETTINGS_BLOCK_MODE_HTACCESS="Tot el lloc + .htaccess"
COM_BFSTOP_SETTINGS_RISK_DELAY_PER_POINT_LABEL="Segons de retard per punt de risc"
COM_BFSTOP_SETTINGS_RISK_DELAY_PER_POINT_DESC="Quants segons de retard addicional s'afegeixen per cada punt positiu (de risc) de la puntuació de risc combinada, a més del retard configurat més amunt. Una puntuació negativa (de confiança) mai no redueix el retard per sota del configurat més amunt."
COM_BFSTOP_SETTINGS_RISK_BLOCK_REDUCTION_PER_POINT_LABEL="Canvi del llindar de bloqueig per punt de risc"
COM_BFSTOP_SETTINGS_RISK_BLOCK_REDUCTION_PER_POINT_DESC="Quant es redueix (amb una puntuació positiva o de risc) o s'augmenta (amb una puntuació negativa o de confiança) el nombre d'intents fallits permesos abans del bloqueig, per cada punt de la puntuació de risc combinada."
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_LABEL="Mínim d'intents permesos"
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_DESC="Un límit inferior estricte per al nombre d'intents fallits permesos ajustat per risc, de manera que una puntuació de risc extrema mai no el pugui reduir a zero (o menys) i bloquejar a la pràctica ja al primer intent."
COM_BFSTOP_FAILEDLOGIN_AUTOPURGE_ENABLED="Les entrades d'inicis de sessió fallits amb més de %d setmanes s'eliminen automàticament. Podeu canviar-ho amb el paràmetre «Depura intents antics» de la pestanya «Avançat» de la <a href=\"%s\">Configuració</a>."
COM_BFSTOP_FAILEDLOGIN_AUTOPURGE_DISABLED="Actualment les entrades antigues d'inicis de sessió fallits no s'eliminen automàticament. Per activar-ho, configureu «Depura intents antics» a la pestanya «Avançat» de la <a href=\"%s\">Configuració</a>, o feu servir el botó «Elimina entrades antigues» per netejar-les manualment."
COM_BFSTOP_BLOCKLIST_AUTOPURGE_ENABLED="Els bloquejos caducats (i els seus registres de desbloqueig) que van acabar fa més de %d setmanes s'eliminen automàticament. Podeu canviar-ho amb el paràmetre «Depura intents antics» de la pestanya «Avançat» de la <a href=\"%s\">Configuració</a>. Els bloquejos permanents mai no s'eliminen automàticament."
COM_BFSTOP_BLOCKLIST_AUTOPURGE_DISABLED="Actualment els bloquejos caducats no s'eliminen automàticament. Per activar-ho, configureu «Depura intents antics» a la pestanya «Avançat» de la <a href=\"%s\">Configuració</a>. Els bloquejos permanents mai no s'eliminen automàticament."
COM_BFSTOP_FAILEDLOGIN_PURGE_BUTTON="Elimina entrades antigues"
COM_BFSTOP_FAILEDLOGIN_PURGE_TITLE="Elimina entrades antigues d'inicis de sessió fallits"
COM_BFSTOP_FAILEDLOGIN_PURGE_DESC="Totes les entrades d'inicis de sessió fallits amb més del nombre de dies indicat s'eliminaran de manera permanent. Aquesta acció no es pot desfer. Els bloquejos no es veuen afectats."
COM_BFSTOP_FAILEDLOGIN_PURGE_AGE_LABEL="Conserva les entrades dels últims ... dies"
COM_BFSTOP_FAILEDLOGIN_PURGE_CONFIRM="Elimina"
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED="S'han eliminat %1$d entrades d'inicis de sessió fallits amb més de %2$d dies."
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED_0="No hi havia entrades d'inicis de sessió fallits amb més de %2$d dies."
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED_1="S'ha eliminat una entrada d'inicis de sessió fallits amb més de %2$d dies."
COM_BFSTOP_FAILEDLOGIN_PURGE_INVALID_AGE="Introduïu un nombre de dies d'almenys 1."
COM_BFSTOP_FAILEDLOGIN_PURGE_FAILED="Ha fallat l'eliminació de les entrades antigues d'inicis de sessió fallits: %s"
COM_BFSTOP_SUBMENU_USERNAMESTATS="Estadístiques de noms d'usuari"
COM_BFSTOP_HEADING_USERNAMESTATS="Brute Force Stop: Estadístiques de noms d'usuari"
COM_BFSTOP_HEADING_RANK="#"
COM_BFSTOP_HEADING_FAILED_ATTEMPTS="Inicis de sessió fallits"
COM_BFSTOP_HEADING_FIRST_ATTEMPT="Primer intent"
COM_BFSTOP_USERNAMESTATS_INFO="Els noms d'usuari utilitzats en intents d'inici de sessió fallits i quantes vegades s'ha fet servir cadascun. Aquestes estadístiques es conserven independentment de les entrades d'inicis de sessió fallits, de manera que no els afecta que s'eliminin entrades antigues; només comencen amb la instal·lació de BFStop 2.0.0 (o l'actualització a aquesta versió), a partir de les entrades d'inicis de sessió fallits que existien en aquell moment. Feu clic en un nom d'usuari per veure'n les entrades d'inicis de sessió fallits que encara es conserven."
COM_BFSTOP_USERNAMESTATS_AUTOTRIM="Es conserven com a màxim %d noms d'usuari: per sobre d'aquest nombre, els noms amb menys intents s'eliminen automàticament (un cop al dia). Aquest límit no es pot canviar."
COM_BFSTOP_USERNAMESTATS_EXISTING_ACCOUNT="Compte existent"
COM_BFSTOP_USERNAMESTATS_EXISTING_ACCOUNT_DESC="En aquest lloc existeix un compte d'usuari amb aquest nom d'usuari."
COM_BFSTOP_USERNAMESTATS_PURGE_BUTTON="Elimina noms d'usuari obsolets"
COM_BFSTOP_USERNAMESTATS_PURGE_TITLE="Elimina estadístiques de noms d'usuari obsolets"
COM_BFSTOP_USERNAMESTATS_PURGE_DESC="Les estadístiques de tots els noms d'usuari que no s'han fet servir en un inici de sessió fallit durant més del nombre de dies indicat s'eliminaran de manera permanent. Aquesta acció no es pot desfer. Les entrades d'inicis de sessió fallits i els bloquejos no es veuen afectats."
COM_BFSTOP_USERNAMESTATS_PURGE_AGE_LABEL="Elimina els noms d'usuari no vistos des de fa més de ... dies"
COM_BFSTOP_USERNAMESTATS_PURGE_CONFIRM="Elimina"
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED="S'han eliminat les estadístiques de %1$d noms d'usuari no vistos des de fa més de %2$d dies."
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED_0="No hi havia noms d'usuari no vistos des de fa més de %2$d dies."
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED_1="S'han eliminat les estadístiques d'un nom d'usuari no vist des de fa més de %2$d dies."
COM_BFSTOP_USERNAMESTATS_PURGE_INVALID_AGE="Introduïu un nombre de dies d'almenys 1."
COM_BFSTOP_USERNAMESTATS_PURGE_FAILED="Ha fallat l'eliminació de les estadístiques de noms d'usuari obsolets: %s"
COM_BFSTOP_FAILEDLOGIN_FILTERED_BY_USERNAME="Només es mostren els inicis de sessió fallits del nom d'usuari «%s»."
COM_BFSTOP_FAILEDLOGIN_FILTER_CLEAR="Mostra tots"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_LABEL="Noms d'usuari que no corresponen a cap compte"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_DESC="Sovint els usuaris escriuen la contrasenya al camp del nom d'usuari. Amb «Hash», el nom d'usuari d'un inici de sessió fallit només es guarda (i es mostra, registra i envia per correu) tal com s'ha escrit si pertany a un compte existent o és a la llista de noms d'usuari comuns; qualsevol altre se substitueix per un valor il·legible que, tanmateix, és el mateix per a la mateixa entrada, de manera que els intents amb ell es compten junts. «Desa tal com s'ha escrit» manté llegible cada nom d'usuari introduït, però aleshores també desa les contrasenyes escrites al camp del nom d'usuari."
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_HASH="Hash (recomanat)"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_PLAIN="Desa tal com s'ha escrit"
COM_BFSTOP_SETTINGS_EMAIL_INVALID="No és una adreça de correu electrònic vàlida: %s"
COM_BFSTOP_SETTINGS_HTACCESS_PATH_INVALID="La ruta de .htaccess ha de ser un directori existent del sistema de fitxers del servidor."
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_INVALID="La ruta de la base de dades GeoIP ha de ser el nom d'un fitxer de base de dades de MaxMind (que acabi en .mmdb) del sistema de fitxers del servidor."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_LABEL="Granularitat del seguiment d'IPv6"
COM_BFSTOP_SETTINGS_IPV6_PREFIX_DESC="Un client amb adreça IPv6 sol controlar tota una xarxa i pot canviar a una altra adreça d'aquesta a voluntat. Per això, els inicis de sessió fallits i els bloquejos de clients IPv6 se segueixen per xarxa d'aquesta mida i no per adreça. /64 és la mida d'una connexió domèstica o mòbil típica. Trieu una única adreça només si sabeu que els clients del vostre lloc comparteixen el seu /64 amb altres als quals no voleu bloquejar conjuntament."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_64="/64 (recomanat)"
COM_BFSTOP_SETTINGS_IPV6_PREFIX_128="Adreça única (/128)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_LABEL="Límit de mida del fitxer de registre (MB)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_DESC="Quan el fitxer de registre supera aquesta mida, es trasllada a un segon fitxer (plg_system_bfstop.1.log.php al directori de registres), que substitueix l'anterior. Així, els fitxers de registre junts mai no ocupen gaire més del doble d'aquesta mida."
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_LABEL="Conserva les entrades del registre (dies)"
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_DESC="Les entrades del registre amb més d'aquest nombre de dies s'eliminen automàticament (un cop al dia, encara que entretant es desactivi el registre). Useu 0 per conservar les entrades fins que s'arribi al límit de mida."
COM_BFSTOP_LOG_AUTOPRUNE_ENABLED="Les entrades del registre amb més de %1$d dies s'eliminen automàticament i el fitxer de registre es rota quan supera els %2$d MB. Podeu canviar-ho a la pestanya «Avançat» de la <a href=\"%3$s\">Configuració</a>."
COM_BFSTOP_LOG_AUTOPRUNE_DISABLED="Actualment les entrades antigues del registre no s'eliminen per antiguitat, només quan el fitxer de registre es rota en superar els %1$d MB. Per canviar-ho, configureu «Conserva les entrades del registre» a la <a href=\"%2$s\">Configuració</a>, o feu servir els botons «Depura el registre» i «Buida el registre»."
COM_BFSTOP_LOG_PRUNE_BUTTON="Depura el registre"
COM_BFSTOP_LOG_PRUNE_DISABLED="Depurar requereix un període de conservació: configureu «Conserva les entrades del registre» a la <a href=\"%s\">Configuració</a>, o buideu el registre."
COM_BFSTOP_LOG_PRUNE_N_DELETED="S'han eliminat %1$d entrades del registre amb més de %2$d dies."
COM_BFSTOP_LOG_PRUNE_N_DELETED_0="No hi havia entrades del registre amb més de %2$d dies."
COM_BFSTOP_LOG_PRUNE_N_DELETED_1="S'ha eliminat una entrada del registre amb més de %2$d dies."
COM_BFSTOP_LOG_CLEAR_BUTTON="Buida el registre"
COM_BFSTOP_LOG_CLEAR_TITLE="Buida el registre"
COM_BFSTOP_LOG_CLEAR_DESC="Totes les entrades del registre s'eliminaran de manera permanent, incloses les del fitxer de registre anterior. Aquesta acció no es pot desfer. Els bloquejos i les entrades d'inicis de sessió fallits no es veuen afectats."
COM_BFSTOP_LOG_CLEAR_CONFIRM="Buida"
COM_BFSTOP_LOG_CLEARED="S'ha buidat el registre."
