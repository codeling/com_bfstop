COM_BFSTOP_WARNING_ADMIN_USER_EXISTS="El superadministrador utilitza 'admin', el nom d'usuari per defecte. Aquest és un risc de seguretat;. Atacants saben que existeix aquest nom d'usuari en moltes instal·lacions Joomla!, per la qual cosa s'utilitza amb molta freqüència en molts atacs. Per augmentar la seguretat, es recomana canviar el nom d'usuari per al Superusuari. Mireu també: <a href='http://docs.joomla.org/Security_and_Performance_FAQs#Why_should_I_immediately_change_the_name_of_the_default_admin_user_after_a_new_install.3F' target='_blank'>Preguntes freqüents sobre seguretat i rendiment Joomla!: Per què hauria de canviar immediatament el nom de l'usuari administrador per defecte després d'una nova instal·lació.</ a>"
COM_BFSTOP_WARNING_HTACCESS_NOT_WORKING="O bé no feu servir un servidor Apache, o bé el fitxer .htaccess no existeix o no es pot llegir o escriure. El bloqueig mitjançant .htaccess no funcionarà."
COM_BFSTOP_WARNING_PLUGIN_NOT_INSTALLED="El connector bfstop no està instal·lat! Instal·leu l'últim paquet de bfstop des de <a href='https://bfstop.bfroehler.info'>la pàgina de bfstop</a> o des del <a href='https://extensions.joomla.org/'>Directori d'extensions de Joomla</a>."
COM_BFSTOP_WARNING_CANNOT_RETRIEVE_COMPONENT_CACHE="No es pot obtenir la memòria cau del manifest del component BFStop. Sembla que hi ha algun problema amb la vostra instal·lació de Joomla!. Instal·leu l'últim paquet de bfstop des de <a href='https://bfstop.bfroehler.info'>la pàgina de bfstop</a> o des del <a href='https://extensions.joomla.org/'>Directori d'extensions de Joomla</a>."
COM_BFSTOP_WARNING_COMPONENT_PLUGIN_DIFFERENT_VERSION="Sembla que el connector i el component de BFStop estan instal·lats en versions diferents. Instal·leu l'últim paquet de bfstop des de <a href='https://bfstop.bfroehler.info'>la pàgina de bfstop</a> o des del <a href='https://extensions.joomla.org/'>Directori d'extensions de Joomla</a>."
COM_BFSTOP_WARNING_PLUGIN_DISABLED="El connector BFStop no està activat! Aneu a la <a href=\"%s\">visió general de connectors</a>, cerqueu «Brute Force Stop» i activeu el connector «System - Brute Force Stop»: ha d'estar en funcionament perquè el bloqueig tingui efecte. Tots els paràmetres de BFStop es configuren aquí, en aquest component, i no al connector mateix."
COM_BFSTOP_WARNING_PROXY_NOT_CONFIGURED="S'ha detectat en aquesta sol·licitud una capçalera de proxy / balancejador de càrrega (per exemple, X-Forwarded-For), però «Darrere d'un proxy / balancejador de càrrega» no està activat a la <a href=\"%s\">configuració del component</a>. Sense aquesta configuració, BFStop només es refia de l'adreça de la connexió directa, de manera que el bloqueig basat en IP pot no funcionar correctament darrere del vostre proxy. Si el vostre lloc sí que és darrere d'un proxy invers o d'un balancejador de càrrega, aneu a la vista de Configuració del component i activeu i configureu les opcions de «Proxy / Balancejador de càrrega»; en cas contrari, un visitant podria falsificar aquesta capçalera per fer bloquejar una adreça IP arbitrària."
