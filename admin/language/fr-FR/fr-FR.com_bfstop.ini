COM_BFSTOP_DESC_BLOCK_IPADDRESS="L'adresse IP (ou le sous-réseau) à bloquer. Les sous-réseaux sont spécifiés dans la notation de suffixe de CIDR, c'est à dire au moyen d'un bloc défini par le préfixe (par exemple 192.168.0.0) suivi de / puis du nombre de bits représentant la taille du bloc (par exemple '192.168.0.0/24'). Soyez prudents dans la délimitation des blocs afin de ne pas bloquer votre propre adresse IP!"
COM_BFSTOP_DESC_BLOCK_CRDATE="La date / l'heure de mise en oeuvre du blocage"
COM_BFSTOP_DESC_ALLOWLIST_IPADDRESS="L'adresse IP (ou le sous-réseau) pour lequel l'accès à ce site est toujours autorisé (les contrôles réalisés par le plugin sont désactivés). Les sous-réseaux sont spécifiés dans la notation de suffixe de CIDR, c'est à dire au moyen d'un bloc défini par le préfixe (par exemple 192.168.0.0) suivi de / puis du nombre de bits représentant la taille du bloc (par exemple '192.168.0.0/24')"
COM_BFSTOP_DESC_ALLOWLIST_NOTES="Saisissez la note de votre choix pour l'entrée de la liste blanche, par exemple la date de sa création ou l'utilisateur pour lequel elle a été créée."
COM_BFSTOP_INSTALL_HINT="Brute Force Stop protège votre site avec ses réglages par défaut dès que son plugin est installé (le paquet l'installe et l'active). Veuillez vérifier les réglages dans la <a href=\"%s\">vue Réglages du composant</a>."
COM_BFSTOP_SETTINGS_ACCOUNT_FIELDSET_LABEL="Limitation au niveau du compte"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_ENABLED_LABEL="Activer la limitation au niveau du compte"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_ENABLED_DESC="Indique s'il faut aussi compter les échecs de connexion par nom d'utilisateur, toutes adresses IP sources confondues, et pas seulement par adresse IP. Cela permet de détecter une attaque distribuée qui répartit ses tentatives contre un même compte entre de nombreuses adresses IP différentes, ce que le seuil de blocage habituel par adresse IP ne peut pas détecter à lui seul. Le compte lui-même n'est jamais verrouillé ; seules les tentatives échouées sont retardées progressivement."
COM_BFSTOP_SETTINGS_ACCOUNT_BLOCK_NUMBER_LABEL="Échecs avant limitation"
COM_BFSTOP_SETTINGS_ACCOUNT_BLOCK_NUMBER_DESC="Nombre d'échecs de connexion pour un même nom d'utilisateur, toutes adresses IP sources confondues, dans la fenêtre de comptage ci-dessous, à partir duquel les tentatives suivantes pour ce nom d'utilisateur subissent un délai supplémentaire."
COM_BFSTOP_SETTINGS_ACCOUNT_CHECK_INTERVAL_LABEL="Fenêtre de comptage (minutes)"
COM_BFSTOP_SETTINGS_ACCOUNT_CHECK_INTERVAL_DESC="La fenêtre de temps (en minutes) pendant laquelle les tentatives échouées pour un même nom d'utilisateur sont comptées, quelle que soit l'adresse IP source."
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_DELAY_LABEL="Délai supplémentaire (secondes)"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_DELAY_DESC="Nombre de secondes de délai supplémentaire ajoutées à chaque nouvel échec de connexion d'un nom d'utilisateur limité, en plus de tout autre délai déjà configuré."
COM_BFSTOP_SETTINGS_GEOIP_FIELDSET_LABEL="Base de données GeoIP"
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_LABEL="Chemin de la base de données GeoIP"
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_DESC="Chemin complet, dans le système de fichiers du serveur, d'une base de données .mmdb MaxMind GeoLite2 (ou GeoIP2), par exemple GeoLite2-City.mmdb. Téléchargez votre propre copie chez MaxMind (un compte gratuit est nécessaire) : BFStop n'inclut ni ne redistribue ces données. Une base de niveau City est nécessaire pour que la vue d'administration « Informations sur l'adresse IP » affiche région, ville et coordonnées ; une base de niveau Country suffit pour le signal de score de risque adaptatif ci-dessous. Laissez vide pour désactiver les deux. La recherche est entièrement locale ; aucune adresse IP n'est jamais envoyée à un tiers."
COM_BFSTOP_SETTINGS_RISK_FIELDSET_LABEL="Score de risque adaptatif"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_ENABLED_LABEL="Activer le signal de confiance « IP connue »"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_ENABLED_DESC="Si activé, un échec de connexion est considéré comme moins risqué (davantage de tentatives autorisées) lorsque cette même adresse IP s'est déjà connectée avec succès sous exactement ce nom d'utilisateur. Le signal porte sur le couple (IP, nom d'utilisateur) et pas sur l'adresse IP seule : se connecter avec un utilisateur ne peut donc pas réduire le score de risque des tentatives contre un autre nom d'utilisateur depuis la même adresse IP."
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_POINTS_LABEL="Points de confiance « IP connue »"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_POINTS_DESC="Nombre de points de risque à soustraire (c'est-à-dire de confiance supplémentaire accordée à la tentative) lorsque le signal « IP connue » correspond."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_ENABLED_LABEL="Activer le signal « nom d'utilisateur courant »"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_ENABLED_DESC="Si activé, un échec de connexion est considéré comme plus risqué (moins de tentatives autorisées) lorsque le nom d'utilisateur utilisé correspond à l'un des noms courants ou à forte valeur listés ci-dessous."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_LIST_LABEL="Noms d'utilisateur courants"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_LIST_DESC="Un nom d'utilisateur par ligne (insensible à la casse). Les tentatives contre l'un de ces noms sont considérées comme plus risquées."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_POINTS_LABEL="Points « nom d'utilisateur courant »"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_POINTS_DESC="Nombre de points de risque à ajouter lorsque le nom d'utilisateur utilisé figure dans la liste des noms courants."
COM_BFSTOP_SETTINGS_RISK_USERAGENT_ENABLED_LABEL="Activer le signal « User-Agent absent »"
COM_BFSTOP_SETTINGS_RISK_USERAGENT_ENABLED_DESC="Si activé, un échec de connexion sans en-tête User-Agent (ou avec un en-tête vide) est considéré comme plus risqué : les vrais navigateurs en envoient toujours un, mais beaucoup de scripts de connexion automatisés rudimentaires ne prennent pas la peine de le définir."
COM_BFSTOP_SETTINGS_RISK_USERAGENT_POINTS_LABEL="Points « User-Agent absent »"
COM_BFSTOP_SETTINGS_RISK_USERAGENT_POINTS_DESC="Nombre de points de risque à ajouter lorsque la requête n'a pas d'en-tête User-Agent."
COM_BFSTOP_SETTINGS_RISK_GEO_ENABLED_LABEL="Activer le signal GeoIP"
COM_BFSTOP_SETTINGS_RISK_GEO_ENABLED_DESC="Si activé, un échec de connexion est considéré comme plus risqué lorsque le pays de l'adresse IP attaquante (recherché dans la base GeoIP configurée ci-dessus) ne fait pas partie des pays d'origine configurés. Nécessite que le chemin de la base GeoIP soit renseigné ; sinon, sans effet."
COM_BFSTOP_SETTINGS_RISK_GEO_HOME_COUNTRIES_LABEL="Pays d'origine"
COM_BFSTOP_SETTINGS_RISK_GEO_HOME_COUNTRIES_DESC="Liste, séparée par des virgules, de codes pays ISO 3166-1 alpha-2 (par exemple « AT,DE,CH ») considérés comme la région attendue ou habituelle de votre site. Une tentative depuis tout autre pays ajoute des points de risque."
COM_BFSTOP_SETTINGS_RISK_GEO_POINTS_LABEL="Points géographiques"
COM_BFSTOP_SETTINGS_RISK_GEO_POINTS_DESC="Nombre de points de risque à ajouter lorsque le pays de l'adresse IP attaquante ne figure pas dans la liste des pays d'origine."
COM_BFSTOP_SETTINGS_RISK_RDNS_ENABLED_LABEL="Activer le signal DNS inverse"
COM_BFSTOP_SETTINGS_RISK_RDNS_ENABLED_DESC="Si activé, un échec de connexion depuis une adresse IP sans enregistrement DNS inverse (PTR) est considéré comme plus risqué. Attention : cela effectue une vraie requête DNS, qui peut être lente ou expirer de temps à autre ; les résultats sont mis en cache une semaine par adresse IP pour limiter ce phénomène, mais laissez cette option désactivée si vous ne mesurez pas le compromis en matière de latence."
COM_BFSTOP_SETTINGS_RISK_RDNS_POINTS_LABEL="Points DNS inverse"
COM_BFSTOP_SETTINGS_RISK_RDNS_POINTS_DESC="Nombre de points de risque à ajouter lorsque l'adresse IP attaquante n'a pas d'enregistrement DNS inverse (PTR)."
COM_BFSTOP_SETTINGS_PROGRESSIVE_BLOCK_DURATION_LABEL="Durée de blocage progressive"
COM_BFSTOP_SETTINGS_PROGRESSIVE_BLOCK_DURATION_DESC="Si activé, chaque fois que la même adresse IP est de nouveau bloquée, la durée du blocage est doublée par rapport au blocage précédent (dans la limite de 64 fois), au lieu d'utiliser toujours la même durée fixe. Elle reste bornée par le passage au blocage permanent configuré ci-dessous."
COM_BFSTOP_SETTINGS_BLOCK_MODE_LABEL="Mode de blocage"
COM_BFSTOP_SETTINGS_BLOCK_MODE_DESC="Ce qui se passe lorsqu'une adresse IP est bloquée. « Rapport seulement » ne restreint jamais rien : les tentatives échouées sont toujours journalisées, mais aucune adresse IP n'est bloquée ; utilisez ce mode pour observer l'activité avant d'appliquer quoi que ce soit. « Connexion seulement » laisse l'adresse IP naviguer normalement sur le site (y compris afficher le formulaire de connexion) et ne rejette que la tentative de connexion elle-même ; c'est plus proche du comportement habituel d'un limiteur de tentatives de connexion et moins gênant pour un utilisateur légitime qui s'est simplement trompé de mot de passe. « Site entier » refuse toutes les requêtes de l'adresse IP bloquée et affiche le message configuré ci-dessous. « Site entier + .htaccess » fait de même et ajoute en plus l'adresse IP à .htaccess afin que le serveur web lui-même la refuse avant que Joomla (et ce plugin) ne voie la requête ; une adresse IP bloquée ainsi ne peut donc pas être limitée à la connexion, et ce mode n'est pas proposé avec « Connexion seulement ». S'applique à tous les blocages, qu'ils soient créés automatiquement ou ajoutés manuellement dans la liste de blocage."
COM_BFSTOP_SETTINGS_BLOCK_MODE_OFF="Rapport seulement"
COM_BFSTOP_SETTINGS_BLOCK_MODE_LOGINONLY="Connexion seulement"
COM_BFSTOP_SETTINGS_BLOCK_MODE_FULL="Site entier"
COM_BFSTOP_SETTINGS_BLOCK_MODE_HTACCESS="Site entier + .htaccess"
COM_BFSTOP_SETTINGS_RISK_DELAY_PER_POINT_LABEL="Secondes de délai par point de risque"
COM_BFSTOP_SETTINGS_RISK_DELAY_PER_POINT_DESC="Nombre de secondes de délai supplémentaire à ajouter par point positif (risqué) du score de risque combiné, en plus du délai configuré ci-dessus. Un score négatif (de confiance) ne réduit jamais le délai en dessous de celui configuré ci-dessus. 0 (la valeur par défaut) n'ajoute aucun délai : chaque seconde de délai occupe un processus PHP du serveur, voir \"Réponses retardées en même temps\"."
COM_BFSTOP_SETTINGS_RISK_BLOCK_REDUCTION_PER_POINT_LABEL="Variation du seuil de blocage par point de risque"
COM_BFSTOP_SETTINGS_RISK_BLOCK_REDUCTION_PER_POINT_DESC="De combien réduire (pour un score positif / risqué) ou augmenter (pour un score négatif / de confiance) le nombre d'échecs autorisés avant blocage, par point du score de risque combiné."
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_LABEL="Nombre minimal de tentatives autorisées"
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_DESC="Un plancher strict pour le nombre de tentatives échouées autorisées après ajustement au risque, afin qu'un score de risque extrême ne puisse jamais le réduire à zéro (ou moins) et bloquer de fait dès la première tentative."
COM_BFSTOP_FAILEDLOGIN_AUTOPURGE_ENABLED="Les entrées d'échecs de connexion de plus de %d semaines sont supprimées automatiquement. Vous pouvez modifier cela avec le paramètre « Purger les anciennes tentatives » de l'onglet « Avancé » de la <a href=\"%s\">configuration</a>."
COM_BFSTOP_FAILEDLOGIN_AUTOPURGE_DISABLED="Les anciennes entrées d'échecs de connexion ne sont actuellement pas supprimées automatiquement. Pour l'activer, renseignez « Purger les anciennes tentatives » dans l'onglet « Avancé » de la <a href=\"%s\">configuration</a>, ou utilisez le bouton « Supprimer les anciennes entrées » pour les nettoyer manuellement."
COM_BFSTOP_BLOCKLIST_AUTOPURGE_ENABLED="Les blocages expirés (et leurs enregistrements de déblocage) terminés depuis plus de %d semaines sont supprimés automatiquement. Vous pouvez modifier cela avec le paramètre « Purger les anciennes tentatives » de l'onglet « Avancé » de la <a href=\"%s\">configuration</a>. Les blocages permanents ne sont jamais supprimés automatiquement."
COM_BFSTOP_BLOCKLIST_AUTOPURGE_DISABLED="Les blocages expirés ne sont actuellement pas supprimés automatiquement. Pour l'activer, renseignez « Purger les anciennes tentatives » dans l'onglet « Avancé » de la <a href=\"%s\">configuration</a>. Les blocages permanents ne sont jamais supprimés automatiquement."
COM_BFSTOP_FAILEDLOGIN_PURGE_BUTTON="Supprimer les anciennes entrées"
COM_BFSTOP_FAILEDLOGIN_PURGE_TITLE="Supprimer les anciennes entrées d'échecs de connexion"
COM_BFSTOP_FAILEDLOGIN_PURGE_DESC="Toutes les entrées d'échecs de connexion plus anciennes que le nombre de jours indiqué seront définitivement supprimées. Cette action est irréversible. Les blocages ne sont pas concernés."
COM_BFSTOP_FAILEDLOGIN_PURGE_AGE_LABEL="Conserver les entrées des ... derniers jours"
COM_BFSTOP_FAILEDLOGIN_PURGE_CONFIRM="Supprimer"
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED="%1$d entrées d'échecs de connexion de plus de %2$d jours ont été supprimées."
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED_0="Il n'y avait aucune entrée d'échec de connexion de plus de %2$d jours."
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED_1="Une entrée d'échec de connexion de plus de %2$d jours a été supprimée."
COM_BFSTOP_FAILEDLOGIN_PURGE_INVALID_AGE="Veuillez saisir un nombre de jours d'au moins 1."
COM_BFSTOP_FAILEDLOGIN_PURGE_FAILED="La suppression des anciennes entrées d'échecs de connexion a échoué : %s"
COM_BFSTOP_SUBMENU_USERNAMESTATS="Statistiques des noms d'utilisateur"
COM_BFSTOP_HEADING_USERNAMESTATS="Brute Force Stop : statistiques des noms d'utilisateur"
COM_BFSTOP_HEADING_RANK="#"
COM_BFSTOP_HEADING_FAILED_ATTEMPTS="Échecs de connexion"
COM_BFSTOP_HEADING_FIRST_ATTEMPT="Première tentative"
COM_BFSTOP_USERNAMESTATS_INFO="Les noms d'utilisateur utilisés lors de tentatives de connexion échouées, et le nombre de fois où chacun a été utilisé. Ces statistiques sont conservées indépendamment des entrées d'échecs de connexion ; elles ne sont donc pas affectées lorsque les anciennes entrées sont supprimées. Elles ne démarrent qu'à l'installation de BFStop 2.0.0 (ou à la mise à jour vers cette version), à partir des entrées d'échecs de connexion existant à ce moment-là. Cliquez sur un nom d'utilisateur pour voir ses entrées d'échecs de connexion encore conservées."
COM_BFSTOP_USERNAMESTATS_AUTOTRIM="%d noms d'utilisateur au maximum sont conservés : au-delà, ceux qui ont le moins de tentatives sont supprimés automatiquement (une fois par jour). Cette limite ne peut pas être modifiée."
COM_BFSTOP_USERNAMESTATS_EXISTING_ACCOUNT="Compte existant"
COM_BFSTOP_USERNAMESTATS_EXISTING_ACCOUNT_DESC="Un compte utilisateur portant ce nom d'utilisateur existe sur ce site."
COM_BFSTOP_USERNAMESTATS_PURGE_BUTTON="Supprimer les noms d'utilisateur obsolètes"
COM_BFSTOP_USERNAMESTATS_PURGE_TITLE="Supprimer les statistiques des noms d'utilisateur obsolètes"
COM_BFSTOP_USERNAMESTATS_PURGE_DESC="Les statistiques de tous les noms d'utilisateur qui n'ont pas été utilisés lors d'un échec de connexion depuis plus du nombre de jours indiqué seront définitivement supprimées. Cette action est irréversible. Les entrées d'échecs de connexion et les blocages ne sont pas concernés."
COM_BFSTOP_USERNAMESTATS_PURGE_AGE_LABEL="Supprimer les noms d'utilisateur non vus depuis plus de ... jours"
COM_BFSTOP_USERNAMESTATS_PURGE_CONFIRM="Supprimer"
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED="Les statistiques de %1$d noms d'utilisateur non vus depuis plus de %2$d jours ont été supprimées."
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED_0="Il n'y avait aucun nom d'utilisateur non vu depuis plus de %2$d jours."
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED_1="Les statistiques d'un nom d'utilisateur non vu depuis plus de %2$d jours ont été supprimées."
COM_BFSTOP_USERNAMESTATS_PURGE_INVALID_AGE="Veuillez saisir un nombre de jours d'au moins 1."
COM_BFSTOP_USERNAMESTATS_PURGE_FAILED="La suppression des statistiques des noms d'utilisateur obsolètes a échoué : %s"
COM_BFSTOP_FAILEDLOGIN_FILTERED_BY_USERNAME="Seuls les échecs de connexion du nom d'utilisateur « %s » sont affichés."
COM_BFSTOP_FAILEDLOGIN_FILTER_CLEAR="Tout afficher"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_LABEL="Noms d'utilisateur ne correspondant à aucun compte"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_DESC="Les utilisateurs saisissent souvent leur mot de passe dans le champ du nom d'utilisateur. Avec « Hachage », le nom d'utilisateur d'un échec de connexion n'est enregistré (puis affiché, journalisé et envoyé par e-mail) tel que saisi que s'il appartient à un compte existant ou figure dans la liste des noms d'utilisateur courants ; tout autre nom est remplacé par une valeur illisible, qui reste identique pour une même saisie, de sorte que les tentatives correspondantes sont comptées ensemble. « Enregistrer tel que saisi » conserve lisible chaque nom d'utilisateur saisi, mais enregistre alors aussi les mots de passe saisis dans le champ du nom d'utilisateur."
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_HASH="Hachage (recommandé)"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_PLAIN="Enregistrer tel que saisi"
COM_BFSTOP_SETTINGS_EMAIL_INVALID="Adresse e-mail invalide : %s"
COM_BFSTOP_SETTINGS_HTACCESS_PATH_INVALID="Le chemin de .htaccess doit être un répertoire existant du système de fichiers du serveur."
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_INVALID="Le chemin de la base de données GeoIP doit être le nom d'un fichier de base de données MaxMind (se terminant par .mmdb) dans le système de fichiers du serveur."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_LABEL="Granularité du suivi IPv6"
COM_BFSTOP_SETTINGS_IPV6_PREFIX_DESC="Un client disposant d'une adresse IPv6 contrôle généralement tout un réseau et peut passer à volonté à une autre adresse de celui-ci. Les échecs de connexion et les blocages des clients IPv6 sont donc enregistrés par réseau de cette taille plutôt que par adresse. Un /64 est un seul réseau local ; une connexion domestique, mobile ou d'entreprise reçoit généralement au moins un /56 - 256 réseaux de ce type, depuis chacun desquels son titulaire peut envoyer des requêtes -, c'est pourquoi /56 est recommandé. Ne choisissez un réseau plus petit ou une seule adresse que si vous savez que les clients de votre site partagent leurs réseaux avec d'autres que vous ne voulez pas bloquer en même temps."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_128="Adresse unique (/128)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_LABEL="Taille maximale du fichier journal (Mo)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_DESC="Lorsque le fichier journal dépasse cette taille, il est déplacé vers un second fichier (plg_system_bfstop.1.log.php dans le répertoire des journaux), qui remplace le précédent. Ainsi, les fichiers journaux réunis ne dépassent jamais beaucoup le double de cette taille."
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_LABEL="Conserver les entrées du journal (jours)"
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_DESC="Les entrées du journal plus anciennes que ce nombre de jours sont supprimées automatiquement (une fois par jour, même si la journalisation est désactivée entre-temps). Indiquez 0 pour conserver les entrées jusqu'à ce que la taille maximale soit atteinte."
COM_BFSTOP_LOG_AUTOPRUNE_ENABLED="Les entrées du journal de plus de %1$d jours sont supprimées automatiquement, et le fichier journal est archivé dès qu'il dépasse %2$d Mo. Vous pouvez modifier cela dans l'onglet « Avancé » de la <a href=\"%3$s\">configuration</a>."
COM_BFSTOP_LOG_AUTOPRUNE_DISABLED="Les anciennes entrées du journal ne sont actuellement pas supprimées selon leur âge, uniquement lors de la rotation du fichier journal lorsqu'il dépasse %1$d Mo. Pour modifier cela, renseignez « Conserver les entrées du journal » dans la <a href=\"%2$s\">configuration</a>, ou utilisez les boutons « Purger le journal » et « Vider le journal »."
COM_BFSTOP_LOG_PRUNE_BUTTON="Purger le journal"
COM_BFSTOP_LOG_PRUNE_DISABLED="La purge nécessite une durée de conservation : renseignez « Conserver les entrées du journal » dans la <a href=\"%s\">configuration</a>, ou videz plutôt le journal."
COM_BFSTOP_LOG_PRUNE_N_DELETED="%1$d entrées du journal de plus de %2$d jours ont été supprimées."
COM_BFSTOP_LOG_PRUNE_N_DELETED_0="Il n'y avait aucune entrée du journal de plus de %2$d jours."
COM_BFSTOP_LOG_PRUNE_N_DELETED_1="Une entrée du journal de plus de %2$d jours a été supprimée."
COM_BFSTOP_LOG_CLEAR_BUTTON="Vider le journal"
COM_BFSTOP_LOG_CLEAR_TITLE="Vider le journal"
COM_BFSTOP_LOG_CLEAR_DESC="Toutes les entrées du journal seront définitivement supprimées, y compris celles du fichier journal précédent. Cette action est irréversible. Les blocages et les entrées d'échecs de connexion ne sont pas concernés."
COM_BFSTOP_LOG_CLEAR_CONFIRM="Vider"
COM_BFSTOP_LOG_CLEARED="Le journal a été vidé."
COM_BFSTOP_SETTINGS_NOTIFY_ANY_NEEDS_LIVE_SITE="Les liens de déblocage pour toute adresse IP ne peuvent être envoyés que si l'adresse du site est définie ($live_site dans le configuration.php du site). Définissez-la là, ou choisissez de n'envoyer les liens qu'aux utilisateurs qui se sont déjà connectés depuis l'adresse bloquée."
COM_BFSTOP_WARNING_NO_LIVE_SITE="L'adresse du site n'est pas définie ($live_site dans configuration.php). Joomla! construit alors les liens des e-mails de Brute Force Stop avec l'hôte indiqué dans chaque requête, qu'un visiteur peut choisir librement - c'est pourquoi les liens de déblocage ne peuvent pas être envoyés pour toute adresse IP. Pour définir l'adresse, ajoutez cette ligne à la classe du configuration.php du site, avec l'adresse sous laquelle le site est accessible (proposée à partir de cette requête, veuillez la vérifier) : %s"
COM_BFSTOP_WARNING_NOTIFY_ANY_WITHOUT_LIVE_SITE="Les liens de déblocage doivent être envoyés pour toute adresse IP (<a href=\"%s\">paramètres</a>), mais l'adresse du site n'est pas définie ($live_site dans configuration.php) : ils ne sont envoyés qu'aux utilisateurs qui se sont déjà connectés depuis l'adresse bloquée."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_56="/56 (recommandé)"
COM_BFSTOP_SETTINGS_DELAY_MAX_CONCURRENT_LABEL="Réponses retardées en même temps"
COM_BFSTOP_SETTINGS_DELAY_MAX_CONCURRENT_DESC="Au plus ce nombre de réponses à des échecs de connexion sont retardées en même temps ; les autres reçoivent une réponse immédiate. Une réponse retardée occupe un processus PHP du serveur pendant tout le délai, et un attaquant disposant de nombreuses adresses peut envoyer des échecs de connexion en parallèle jusqu'à ce qu'il ne reste plus de processus pour les autres visiteurs. Gardez cette valeur bien en dessous du nombre de processus PHP (p. ex. pm.max_children de PHP-FPM). Les échecs de connexion qui reçoivent une réponse immédiate sont comptés et bloqués comme d'habitude."
COM_BFSTOP_IP_NETWORK_TOO_LARGE="Le réseau %1$s est trop grand : la longueur de son préfixe doit être d'au moins /%2$d pour IPv4 et /%3$d pour IPv6."
COM_BFSTOP_IPADDRESS_TRUSTED_PROXY="Il s'agit (ou cela contient) d'un proxy de confiance des paramètres : bloqué dans le fichier .htaccess, toute requête passant par lui serait refusée."
