COM_BFSTOP_WARNING_ADMIN_USER_EXISTS="Le profil 'SuperUtilisateur' est attribué à l'utilisateur 'admin'. Cette attribution constitue un risque important en terme de sécurité; les pirates savent que ce nom d'utilisateur est commun et notamment utilisé dans Joomla. Pour améliorer la sécurité, il est vivement recommandé de changer le nom d'utilisateur auquel il est attribué un profil d'administrateur 'SuperUtilisateur'! Consultez également: <a href='http://docs.joomla.org/Security_and_Performance_FAQs#Why_should_I_immediately_change_the_name_of_the_default_admin_user_after_a_new_install.3F' target='_blank'>Joomla! Sécurity et Performance FAQ: Pourquoi changer le nom de l'utilisateur administrateur après une nouvelle installation?</a>"
COM_BFSTOP_WARNING_HTACCESS_NOT_WORKING="Soit vous n'utilisez pas un serveur Apache, soit le fichier .htaccess n'existe pas ou n'est pas lisible ou modifiable. Le blocage via .htaccess ne fonctionnera pas."
COM_BFSTOP_WARNING_PLUGIN_NOT_INSTALLED="Le plugin bfstop n'est pas installé ! Veuillez installer le dernier paquet bfstop depuis <a href='https://bfstop.bfroehler.info'>la page de bfstop</a> ou depuis le <a href='https://extensions.joomla.org/'>répertoire des extensions Joomla</a> !"
COM_BFSTOP_WARNING_CANNOT_RETRIEVE_COMPONENT_CACHE="Impossible de récupérer le cache du manifeste du composant BFStop. Il semble y avoir un problème avec votre installation de Joomla!. Veuillez installer le dernier paquet bfstop depuis <a href='https://bfstop.bfroehler.info'>la page de bfstop</a> ou depuis le <a href='https://extensions.joomla.org/'>répertoire des extensions Joomla</a> !"
COM_BFSTOP_WARNING_COMPONENT_PLUGIN_DIFFERENT_VERSION="Le plugin et le composant BFStop semblent installés dans des versions différentes. Veuillez installer le dernier paquet bfstop depuis <a href='https://bfstop.bfroehler.info'>la page de bfstop</a> ou depuis le <a href='https://extensions.joomla.org/'>répertoire des extensions Joomla</a> !"
COM_BFSTOP_WARNING_PLUGIN_DISABLED="Le plugin BFStop n'est pas activé ! Rendez-vous dans la <a href=\"%s\">liste des plugins</a>, cherchez « Brute Force Stop » et activez le plugin « System - Brute Force Stop » : il doit être en fonctionnement pour que le blocage prenne effet. Tous les paramètres de BFStop se configurent ici, dans ce composant, et non sur le plugin lui-même."
COM_BFSTOP_WARNING_PROXY_NOT_CONFIGURED="Un en-tête de proxy / répartiteur de charge (par exemple X-Forwarded-For) a été détecté sur cette requête, mais « Derrière un proxy / répartiteur de charge » n'est pas activé dans la <a href=\"%s\">configuration du composant</a>. Sans cette configuration, BFStop ne se fie qu'à l'adresse de la connexion directe ; le blocage par adresse IP risque donc de mal fonctionner derrière votre proxy. Si votre site se trouve bien derrière un proxy inverse ou un répartiteur de charge, ouvrez la vue Configuration du composant, puis activez et configurez les options « Proxy / Répartiteur de charge » ; sinon, un visiteur pourrait falsifier cet en-tête pour faire bloquer une adresse IP arbitraire."
