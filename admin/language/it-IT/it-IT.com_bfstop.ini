COM_BFSTOP_YOUR_IP_IS="Il tuo indirizzo IP, come lo vede BFStop, è %s."
COM_BFSTOP_INSTALL_HINT="Brute Force Stop protegge il sito con le impostazioni predefinite non appena il suo plugin è installato (il pacchetto lo installa e lo attiva). Controlla le impostazioni nella <a href=\"%s\">vista Impostazioni del componente</a>."
COM_BFSTOP_SETTINGS_ACCOUNT_FIELDSET_LABEL="Limitazione a livello di account"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_ENABLED_LABEL="Attiva la limitazione a livello di account"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_ENABLED_DESC="Indica se contare gli accessi falliti anche per nome utente, sommando tutti gli indirizzi IP di origine che li hanno tentati, e non solo per indirizzo IP. Così si individua un attacco distribuito che ripartisce i tentativi contro un solo account su molti IP diversi, cosa che la normale soglia di blocco per IP da sola non può rilevare. L'account in sé non viene mai bloccato: vengono solo ritardati progressivamente i tentativi falliti."
COM_BFSTOP_SETTINGS_ACCOUNT_BLOCK_NUMBER_LABEL="Tentativi falliti prima della limitazione"
COM_BFSTOP_SETTINGS_ACCOUNT_BLOCK_NUMBER_DESC="Quanti accessi falliti per lo stesso nome utente, sommando tutti gli indirizzi IP di origine, entro la finestra di conteggio indicata sotto, servono prima che gli ulteriori tentativi per quel nome utente subiscano un ritardo aggiuntivo."
COM_BFSTOP_SETTINGS_ACCOUNT_CHECK_INTERVAL_LABEL="Finestra di conteggio (minuti)"
COM_BFSTOP_SETTINGS_ACCOUNT_CHECK_INTERVAL_DESC="La finestra di tempo (in minuti) entro cui vengono contati i tentativi falliti per lo stesso nome utente, indipendentemente dall'indirizzo IP di origine."
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_DELAY_LABEL="Ritardo aggiuntivo (secondi)"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_DELAY_DESC="Quanti secondi di ritardo aggiuntivo aggiungere a ogni ulteriore accesso fallito per un nome utente limitato, oltre a ogni altro ritardo già configurato."
COM_BFSTOP_SETTINGS_GEOIP_FIELDSET_LABEL="Database GeoIP"
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_LABEL="Percorso del database GeoIP"
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_DESC="Percorso completo, nel file system del server, di un database .mmdb MaxMind GeoLite2 (o GeoIP2), ad esempio GeoLite2-City.mmdb. Scarica la tua copia da MaxMind (serve un account gratuito): BFStop non include né ridistribuisce questi dati. Serve un database di livello City perché la vista «Informazioni sull'indirizzo IP» mostri regione, città e coordinate; per il segnale del punteggio di rischio adattivo indicato sotto basta un database di livello Country. Lascia vuoto per disattivare entrambi. La ricerca è interamente locale; nessun indirizzo IP viene mai inviato a terzi."
COM_BFSTOP_SETTINGS_RISK_FIELDSET_LABEL="Punteggio di rischio adattivo"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_ENABLED_LABEL="Attiva il segnale di fiducia «IP noto»"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_ENABLED_DESC="Se attivo, un accesso fallito è considerato meno rischioso (sono consentiti più tentativi) quando lo stesso indirizzo IP ha già effettuato con successo l'accesso con esattamente quel nome utente. Vale per la coppia (IP, nome utente) e non per il solo IP, quindi accedere come un utente non può abbassare il punteggio di rischio dei tentativi contro un altro nome utente dallo stesso IP."
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_POINTS_LABEL="Punti di fiducia «IP noto»"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_POINTS_DESC="Quanti punti di rischio sottrarre (cioè quanta fiducia in più accordare al tentativo) quando il segnale «IP noto» corrisponde."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_ENABLED_LABEL="Attiva il segnale «nome utente comune»"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_ENABLED_DESC="Se attivo, un accesso fallito è considerato più rischioso (sono consentiti meno tentativi) quando il nome utente usato corrisponde a uno dei nomi comuni o di alto valore elencati sotto."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_LIST_LABEL="Nomi utente comuni"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_LIST_DESC="Un nome utente per riga (senza distinzione tra maiuscole e minuscole). I tentativi contro uno qualsiasi di questi nomi sono considerati più rischiosi."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_POINTS_LABEL="Punti «nome utente comune»"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_POINTS_DESC="Quanti punti di rischio aggiungere quando il nome utente usato corrisponde all'elenco dei nomi comuni."
COM_BFSTOP_SETTINGS_RISK_USERAGENT_ENABLED_LABEL="Attiva il segnale «User-Agent mancante»"
COM_BFSTOP_SETTINGS_RISK_USERAGENT_ENABLED_DESC="Se attivo, un accesso fallito senza header User-Agent del browser (o con header vuoto) è considerato più rischioso: i browser veri ne inviano sempre uno, mentre molti script di accesso automatici poco sofisticati non si preoccupano di impostarlo."
COM_BFSTOP_SETTINGS_RISK_USERAGENT_POINTS_LABEL="Punti «User-Agent mancante»"
COM_BFSTOP_SETTINGS_RISK_USERAGENT_POINTS_DESC="Quanti punti di rischio aggiungere quando la richiesta non ha l'header User-Agent."
COM_BFSTOP_SETTINGS_RISK_GEO_ENABLED_LABEL="Attiva il segnale GeoIP"
COM_BFSTOP_SETTINGS_RISK_GEO_ENABLED_DESC="Se attivo, un accesso fallito è considerato più rischioso quando il paese dell'IP attaccante (cercato nel database GeoIP configurato sopra) non è uno dei paesi d'origine configurati. Richiede che sia impostato il percorso del database GeoIP; altrimenti non ha effetto."
COM_BFSTOP_SETTINGS_RISK_GEO_HOME_COUNTRIES_LABEL="Paesi d'origine"
COM_BFSTOP_SETTINGS_RISK_GEO_HOME_COUNTRIES_DESC="Elenco, separato da virgole, di codici paese ISO 3166-1 alpha-2 (ad esempio «AT,DE,CH») considerati la regione prevista o tipica del tuo sito. Un tentativo da qualsiasi altro paese aggiunge punti di rischio."
COM_BFSTOP_SETTINGS_RISK_GEO_POINTS_LABEL="Punti geografici"
COM_BFSTOP_SETTINGS_RISK_GEO_POINTS_DESC="Quanti punti di rischio aggiungere quando il paese dell'IP attaccante non è nell'elenco dei paesi d'origine."
COM_BFSTOP_SETTINGS_RISK_RDNS_ENABLED_LABEL="Attiva il segnale DNS inverso"
COM_BFSTOP_SETTINGS_RISK_RDNS_ENABLED_DESC="Se attivo, un accesso fallito da un indirizzo IP senza record DNS inverso (PTR) è considerato più rischioso. Attenzione: viene eseguita una vera ricerca DNS, che può essere lenta o occasionalmente andare in timeout; i risultati vengono messi in cache per una settimana per IP per limitare il fenomeno, ma lascia l'opzione disattivata a meno che tu non comprenda il compromesso sulla latenza."
COM_BFSTOP_SETTINGS_RISK_RDNS_POINTS_LABEL="Punti DNS inverso"
COM_BFSTOP_SETTINGS_RISK_RDNS_POINTS_DESC="Quanti punti di rischio aggiungere quando l'IP attaccante non ha un record DNS inverso (PTR)."
COM_BFSTOP_SETTINGS_PROGRESSIVE_BLOCK_DURATION_LABEL="Durata progressiva del blocco"
COM_BFSTOP_SETTINGS_PROGRESSIVE_BLOCK_DURATION_DESC="Se attivo, ogni volta che lo stesso indirizzo IP viene bloccato di nuovo, la durata del blocco raddoppia rispetto al blocco precedente (fino a un massimo di 64 volte), invece di usare sempre la stessa durata fissa. Rimane comunque limitata dal passaggio al blocco permanente configurato sotto."
COM_BFSTOP_SETTINGS_BLOCK_MODE_LABEL="Modalità di blocco"
COM_BFSTOP_SETTINGS_BLOCK_MODE_DESC="Cosa succede quando un indirizzo IP viene bloccato. «Solo segnalazione» non limita mai nulla: i tentativi falliti vengono comunque registrati, ma nessun IP viene bloccato, quindi usala per osservare l'attività prima di applicare qualsiasi restrizione. «Solo accesso» lascia che l'IP continui a navigare normalmente sul sito (compreso il modulo di accesso) e rifiuta solo il tentativo di accesso in sé: è più vicino al comportamento tipico di un limitatore di tentativi di accesso e disturba meno un utente legittimo che ha semplicemente sbagliato la password. «Intero sito» rifiuta ogni richiesta dall'indirizzo IP bloccato e mostra il messaggio configurato sotto. «Intero sito + .htaccess» fa lo stesso e in più aggiunge l'IP a .htaccess, così il server web stesso lo rifiuta prima che Joomla (e questo plugin) veda la richiesta; questo significa anche che un IP bloccato in questo modo non può essere limitato al solo accesso, perciò non viene offerto insieme a «Solo accesso». Vale per ogni blocco, sia creato automaticamente sia aggiunto a mano nella lista dei blocchi."
COM_BFSTOP_SETTINGS_BLOCK_MODE_OFF="Solo segnalazione"
COM_BFSTOP_SETTINGS_BLOCK_MODE_LOGINONLY="Solo accesso"
COM_BFSTOP_SETTINGS_BLOCK_MODE_FULL="Intero sito"
COM_BFSTOP_SETTINGS_BLOCK_MODE_HTACCESS="Intero sito + .htaccess"
COM_BFSTOP_SETTINGS_RISK_DELAY_PER_POINT_LABEL="Secondi di ritardo per punto di rischio"
COM_BFSTOP_SETTINGS_RISK_DELAY_PER_POINT_DESC="Quanti secondi di ritardo aggiuntivo aggiungere per ogni punto positivo (rischioso) del punteggio di rischio combinato, oltre al ritardo configurato sopra. Un punteggio negativo (di fiducia) non riduce mai il ritardo al di sotto di quello configurato sopra. 0 (il valore predefinito) non aggiunge ritardo: ogni secondo di ritardo tiene occupato un processo PHP del server, vedi \"Risposte ritardate contemporaneamente\"."
COM_BFSTOP_SETTINGS_RISK_BLOCK_REDUCTION_PER_POINT_LABEL="Variazione della soglia di blocco per punto di rischio"
COM_BFSTOP_SETTINGS_RISK_BLOCK_REDUCTION_PER_POINT_DESC="Di quanto ridurre (con punteggio positivo / rischioso) o aumentare (con punteggio negativo / di fiducia) il numero di tentativi falliti consentiti prima del blocco, per ogni punto del punteggio di rischio combinato."
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_LABEL="Tentativi minimi consentiti"
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_DESC="Un limite inferiore rigido per il numero di tentativi falliti consentiti corretto in base al rischio, così che un punteggio di rischio estremo non possa mai ridurlo a zero (o meno) e di fatto bloccare già al primo tentativo."
COM_BFSTOP_FAILEDLOGIN_AUTOPURGE_ENABLED="Le voci di accessi falliti più vecchie di %d settimane vengono eliminate automaticamente. Puoi cambiarlo con l'impostazione «Elimina i vecchi tentativi» nella scheda «Avanzate» della <a href=\"%s\">Configurazione</a>."
COM_BFSTOP_FAILEDLOGIN_AUTOPURGE_DISABLED="Le vecchie voci di accessi falliti attualmente non vengono eliminate automaticamente. Per attivarlo, imposta «Elimina i vecchi tentativi» nella scheda «Avanzate» della <a href=\"%s\">Configurazione</a>, oppure usa il pulsante «Elimina le voci vecchie» per ripulirle a mano."
COM_BFSTOP_BLOCKLIST_AUTOPURGE_ENABLED="I blocchi scaduti (e i relativi record di sblocco) terminati da più di %d settimane vengono eliminati automaticamente. Puoi cambiarlo con l'impostazione «Elimina i vecchi tentativi» nella scheda «Avanzate» della <a href=\"%s\">Configurazione</a>. I blocchi permanenti non vengono mai eliminati automaticamente."
COM_BFSTOP_BLOCKLIST_AUTOPURGE_DISABLED="I blocchi scaduti attualmente non vengono eliminati automaticamente. Per attivarlo, imposta «Elimina i vecchi tentativi» nella scheda «Avanzate» della <a href=\"%s\">Configurazione</a>. I blocchi permanenti non vengono mai eliminati automaticamente."
COM_BFSTOP_FAILEDLOGIN_PURGE_BUTTON="Elimina le voci vecchie"
COM_BFSTOP_FAILEDLOGIN_PURGE_TITLE="Elimina le vecchie voci di accessi falliti"
COM_BFSTOP_FAILEDLOGIN_PURGE_DESC="Tutte le voci di accessi falliti più vecchie del numero di giorni indicato verranno eliminate definitivamente. Questa operazione non può essere annullata. I blocchi non sono interessati."
COM_BFSTOP_FAILEDLOGIN_PURGE_AGE_LABEL="Mantieni le voci degli ultimi ... giorni"
COM_BFSTOP_FAILEDLOGIN_PURGE_CONFIRM="Elimina"
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED="Sono state eliminate %1$d voci di accessi falliti più vecchie di %2$d giorni."
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED_0="Non c'erano voci di accessi falliti più vecchie di %2$d giorni."
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED_1="È stata eliminata una voce di accessi falliti più vecchia di %2$d giorni."
COM_BFSTOP_FAILEDLOGIN_PURGE_INVALID_AGE="Inserisci un numero di giorni pari ad almeno 1."
COM_BFSTOP_FAILEDLOGIN_PURGE_FAILED="Eliminazione delle vecchie voci di accessi falliti non riuscita: %s"
COM_BFSTOP_SUBMENU_USERNAMESTATS="Statistiche dei nomi utente"
COM_BFSTOP_HEADING_USERNAMESTATS="Brute Force Stop: Statistiche dei nomi utente"
COM_BFSTOP_HEADING_RANK="#"
COM_BFSTOP_HEADING_FAILED_ATTEMPTS="Accessi falliti"
COM_BFSTOP_HEADING_FIRST_ATTEMPT="Primo tentativo"
COM_BFSTOP_USERNAMESTATS_INFO="I nomi utente usati nei tentativi di accesso falliti e quante volte è stato usato ciascuno. Queste statistiche sono conservate indipendentemente dalle voci di accessi falliti, quindi non sono influenzate dall'eliminazione delle voci vecchie; partono solo con l'installazione di BFStop 2.0.0 (o l'aggiornamento a questa versione), a partire dalle voci di accessi falliti esistenti in quel momento. Fai clic su un nome utente per vedere le sue voci di accessi falliti ancora conservate."
COM_BFSTOP_USERNAMESTATS_AUTOTRIM="Vengono conservati al massimo %d nomi utente: oltre questo numero, i nomi con meno tentativi vengono eliminati automaticamente (una volta al giorno). Questo limite non può essere modificato."
COM_BFSTOP_USERNAMESTATS_EXISTING_ACCOUNT="Account esistente"
COM_BFSTOP_USERNAMESTATS_EXISTING_ACCOUNT_DESC="Su questo sito esiste un account utente con questo nome utente."
COM_BFSTOP_USERNAMESTATS_PURGE_BUTTON="Elimina i nomi utente obsoleti"
COM_BFSTOP_USERNAMESTATS_PURGE_TITLE="Elimina le statistiche dei nomi utente obsoleti"
COM_BFSTOP_USERNAMESTATS_PURGE_DESC="Le statistiche di tutti i nomi utente che non sono stati usati in un accesso fallito da più del numero di giorni indicato verranno eliminate definitivamente. Questa operazione non può essere annullata. Le voci di accessi falliti e i blocchi non sono interessati."
COM_BFSTOP_USERNAMESTATS_PURGE_AGE_LABEL="Elimina i nomi utente non visti da più di ... giorni"
COM_BFSTOP_USERNAMESTATS_PURGE_CONFIRM="Elimina"
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED="Sono state eliminate le statistiche di %1$d nomi utente non visti da più di %2$d giorni."
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED_0="Non c'erano nomi utente non visti da più di %2$d giorni."
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED_1="Sono state eliminate le statistiche di un nome utente non visto da più di %2$d giorni."
COM_BFSTOP_USERNAMESTATS_PURGE_INVALID_AGE="Inserisci un numero di giorni pari ad almeno 1."
COM_BFSTOP_USERNAMESTATS_PURGE_FAILED="Eliminazione delle statistiche dei nomi utente obsoleti non riuscita: %s"
COM_BFSTOP_FAILEDLOGIN_FILTERED_BY_USERNAME="Vengono mostrati solo gli accessi falliti per il nome utente «%s»."
COM_BFSTOP_FAILEDLOGIN_FILTER_CLEAR="Mostra tutti"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_LABEL="Nomi utente che non corrispondono a un account"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_DESC="Spesso gli utenti digitano la password nel campo del nome utente. Con «Hash», il nome utente di un accesso fallito viene memorizzato (e mostrato, registrato nel log e inviato per email) così come digitato solo se appartiene a un account esistente o è nell'elenco dei nomi utente comuni; ogni altro viene sostituito da un valore illeggibile, che resta uguale per lo stesso input, così i tentativi relativi vengono contati insieme. «Memorizza come digitato» mantiene leggibile ogni nome utente inserito, ma in tal caso memorizza anche le password digitate nel campo del nome utente."
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_HASH="Hash (consigliato)"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_PLAIN="Memorizza come digitato"
COM_BFSTOP_SETTINGS_EMAIL_INVALID="Indirizzo email non valido: %s"
COM_BFSTOP_SETTINGS_PROXY_INVALID="Non è un indirizzo IP, oppure è una rete più ampia di /%2$s (IPv4) o /%3$s (IPv6): %1$s"
COM_BFSTOP_SETTINGS_HTACCESS_PATH_INVALID="Il percorso di .htaccess deve essere una cartella esistente del file system del server."
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_INVALID="Il percorso del database GeoIP deve essere il nome di un file di database MaxMind (che termina con .mmdb) nel file system del server."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_LABEL="Granularità del tracciamento IPv6"
COM_BFSTOP_SETTINGS_IPV6_PREFIX_DESC="Un client con indirizzo IPv6 di solito controlla un'intera rete e può passare a piacere a un altro indirizzo al suo interno. Gli accessi falliti e i blocchi dei client IPv6 vengono quindi registrati per rete di questa dimensione anziché per indirizzo. Un /64 è una singola rete locale; una connessione domestica, mobile o aziendale riceve di solito almeno un /56 - 256 reti di questo tipo, da ognuna delle quali il titolare può inviare richieste -, per questo si consiglia /56. Scegli una rete più piccola o un singolo indirizzo solo se sai che i client del tuo sito condividono le loro reti con altri che non vuoi bloccare insieme."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_128="Singolo indirizzo (/128)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_LABEL="Limite di dimensione del file di log (MB)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_DESC="Quando il file di log supera questa dimensione, viene spostato in un secondo file (plg_system_bfstop.1.log.php nella cartella dei log), che sostituisce il precedente. Così i file di log insieme non superano mai di molto il doppio di questa dimensione."
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_LABEL="Conserva le voci di log (giorni)"
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_DESC="Le voci di log più vecchie di questo numero di giorni vengono eliminate automaticamente (una volta al giorno, anche se nel frattempo il logging viene disattivato). Imposta 0 per conservare le voci finché non si raggiunge il limite di dimensione."
COM_BFSTOP_LOG_AUTOPRUNE_ENABLED="Le voci di log più vecchie di %1$d giorni vengono eliminate automaticamente e il file di log viene ruotato quando supera %2$d MB. Puoi cambiarlo nella scheda «Avanzate» della <a href=\"%3$s\">Configurazione</a>."
COM_BFSTOP_LOG_AUTOPRUNE_DISABLED="Le vecchie voci di log attualmente non vengono eliminate in base all'età, ma solo quando il file di log viene ruotato dopo aver superato %1$d MB. Per cambiarlo, imposta «Conserva le voci di log» nella <a href=\"%2$s\">Configurazione</a>, oppure usa i pulsanti «Elimina le voci vecchie del log» e «Svuota il log»."
COM_BFSTOP_LOG_PRUNE_BUTTON="Elimina le voci vecchie del log"
COM_BFSTOP_LOG_PRUNE_DISABLED="L'eliminazione richiede un periodo di conservazione: imposta «Conserva le voci di log» nella <a href=\"%s\">Configurazione</a>, oppure svuota il log."
COM_BFSTOP_LOG_PRUNE_N_DELETED="Sono state eliminate %1$d voci di log più vecchie di %2$d giorni."
COM_BFSTOP_LOG_PRUNE_N_DELETED_0="Non c'erano voci di log più vecchie di %2$d giorni."
COM_BFSTOP_LOG_PRUNE_N_DELETED_1="È stata eliminata una voce di log più vecchia di %2$d giorni."
COM_BFSTOP_LOG_CLEAR_BUTTON="Svuota il log"
COM_BFSTOP_LOG_CLEAR_TITLE="Svuota il log"
COM_BFSTOP_LOG_CLEAR_DESC="Tutte le voci del log verranno eliminate definitivamente, comprese quelle del file di log precedente. Questa operazione non può essere annullata. I blocchi e le voci di accessi falliti non sono interessati."
COM_BFSTOP_LOG_CLEAR_CONFIRM="Svuota"
COM_BFSTOP_LOG_CLEARED="Il log è stato svuotato."
COM_BFSTOP_SETTINGS_NOTIFY_ANY_NEEDS_LIVE_SITE="I link di sblocco possono essere inviati solo se l'indirizzo del sito è impostato ($live_site nel configuration.php del sito). Impostalo lì, oppure disattiva i link di sblocco."
COM_BFSTOP_WARNING_NO_LIVE_SITE="L'indirizzo del sito non è impostato ($live_site in configuration.php). Joomla! costruisce allora i link nelle email di Brute Force Stop dall'host indicato in ogni richiesta, che un visitatore può scegliere liberamente - per questo non vengono inviati link di sblocco e le notifiche agli amministratori non indicano alcun indirizzo. Per impostare l'indirizzo, aggiungi questa riga alla classe nel configuration.php del sito, con l'indirizzo con cui si raggiunge il sito (proposto in base a questa richiesta, verificalo): %s"
COM_BFSTOP_WARNING_NOTIFY_ANY_WITHOUT_LIVE_SITE="I link di sblocco devono essere inviati (<a href=\"%s\">impostazioni</a>), ma l'indirizzo del sito non è impostato ($live_site in configuration.php): non viene inviato alcun link di sblocco."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_56="/56 (consigliato)"
COM_BFSTOP_SETTINGS_DELAY_MAX_CONCURRENT_LABEL="Risposte ritardate contemporaneamente"
COM_BFSTOP_SETTINGS_DELAY_MAX_CONCURRENT_DESC="Al massimo questo numero di risposte ad accessi falliti viene ritardato contemporaneamente; le altre ricevono subito una risposta. Una risposta ritardata tiene occupato un processo PHP del server per tutto il ritardo, e un attaccante con molti indirizzi può inviare accessi falliti in parallelo finché non resta alcun processo libero per gli altri visitatori. Mantieni questo valore ben al di sotto del numero di processi PHP (ad es. pm.max_children di PHP-FPM). Gli accessi falliti a cui si risponde subito vengono contati e bloccati come al solito."
COM_BFSTOP_IP_NETWORK_TOO_LARGE="La rete %1$s è troppo grande: la lunghezza del prefisso deve essere almeno /%2$d per IPv4 e /%3$d per IPv6."
COM_BFSTOP_IPADDRESS_TRUSTED_PROXY="Questo è (o contiene) un proxy attendibile delle impostazioni: bloccato nel file .htaccess, ogni richiesta che passa da esso verrebbe respinta."
