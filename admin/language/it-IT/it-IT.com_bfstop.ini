COM_BFSTOP_TEST_NOTIFICATION_FAILED="L'invio della notifica di prova è fallito (%s)! Si prega di controllare le Impostazioni Mail nella configurazione di Joomla!; la configurazione di notifica di questo plugin; e l'indirizzo e-mail per l'utente scelto nella configurazione del plugin."
