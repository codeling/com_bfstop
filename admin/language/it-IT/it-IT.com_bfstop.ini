COM_BFSTOP_WARNING_ADMIN_USER_EXISTS="Il Superuser sta usando il nome utente 'admin' predefinito. Questo è un rischio per la sicurezza; gli attaccanti sanno che questo nome utente esiste in molte installazioni Joomla!, e viene utilizzato spesso in molti attacchi. Per aumentare la sicurezza si consiglia di modificare il nome utente per il Superuser! Vedi anche:<a href='http://docs.joomla.org/Security_and_Performance_FAQs#Why_should_I_immediately_change_the_name_of_the_default_admin_user_after_a_new_install.3F' target='_blank'>Joomla! Security and Performance FAQ: Why should I immediately change the name of the default admin user after a new install?</a>"
COM_BFSTOP_WARNING_HTACCESS_NOT_WORKING="O non stai usando un server Apache, oppure il file .htaccess non esiste o non è leggibile o scrivibile. Il blocco tramite .htaccess non funzionerà."
COM_BFSTOP_WARNING_PLUGIN_NOT_INSTALLED="Il plugin bfstop non è installato! Installa l'ultimo pacchetto di bfstop dalla <a href='https://bfstop.bfroehler.info'>pagina di bfstop</a> o dalla <a href='https://extensions.joomla.org/'>Joomla Extensions Directory</a>!"
COM_BFSTOP_WARNING_CANNOT_RETRIEVE_COMPONENT_CACHE="Impossibile leggere la cache del manifest del componente BFStop. Sembra che ci sia qualcosa che non va nella tua installazione di Joomla!. Installa l'ultimo pacchetto di bfstop dalla <a href='https://bfstop.bfroehler.info'>pagina di bfstop</a> o dalla <a href='https://extensions.joomla.org/'>Joomla Extensions Directory</a>!"
COM_BFSTOP_WARNING_COMPONENT_PLUGIN_DIFFERENT_VERSION="Il plugin e il componente BFStop sembrano installati in versioni diverse. Installa l'ultimo pacchetto di bfstop dalla <a href='https://bfstop.bfroehler.info'>pagina di bfstop</a> o dalla <a href='https://extensions.joomla.org/'>Joomla Extensions Directory</a>!"
COM_BFSTOP_WARNING_PLUGIN_DISABLED="Il plugin BFStop non è abilitato! Vai alla <a href=\"%s\">panoramica dei plugin</a>, cerca «Brute Force Stop» e abilita il plugin «System - Brute Force Stop»: deve essere in esecuzione perché il blocco abbia effetto. Tutte le impostazioni di BFStop si configurano qui, in questo componente, non sul plugin stesso."
COM_BFSTOP_WARNING_PROXY_NOT_CONFIGURED="In questa richiesta è stato rilevato un header di proxy / bilanciatore di carico (ad esempio X-Forwarded-For), ma «Dietro un proxy / bilanciatore di carico» non è attivo nella <a href=\"%s\">configurazione del componente</a>. Senza questa impostazione BFStop si fida solo dell'indirizzo della connessione diretta, quindi il blocco basato su IP potrebbe non funzionare correttamente dietro il tuo proxy. Se il tuo sito si trova davvero dietro un reverse proxy o un bilanciatore di carico, vai alla vista Configurazione del componente e attiva e configura le opzioni «Proxy / Bilanciatore di carico»; altrimenti un visitatore potrebbe falsificare questo header per far bloccare un indirizzo IP qualsiasi."
COM_BFSTOP_BLOCK_NEW="Aggiungere"
COM_BFSTOP_BLOCK_EDIT="Modifica"
COM_BFSTOP_BLOCK_DETAILS="Dettagli"
COM_BFSTOP_UNBLOCK="Sblocca"
COM_BFSTOP_DESC_BLOCK_IPADDRESS="L'indirizzo IP (o la sottorete) da bloccare. Le sottoreti si indicano in notazione con suffisso CIDR, cioè nella forma <indirizzo della sottorete>/<bit della maschera>, ad esempio «192.168.0.0/24». Fai attenzione quando inserisci una sottorete, per non bloccare il tuo stesso IP!"
COM_BFSTOP_DESC_BLOCK_CRDATE="La data/ora di inizio del blocco"
COM_BFSTOP_DESC_ALLOWLIST_IPADDRESS="L'indirizzo IP (o la sottorete) per cui l'accesso a questo sito sarà sempre consentito (disattiva tutti i blocchi e i controlli eseguiti dal plugin). Le sottoreti si indicano in notazione con suffisso CIDR, cioè nella forma <indirizzo della sottorete>/<bit della maschera>, ad esempio «192.168.0.0/24»"
COM_BFSTOP_DESC_ALLOWLIST_NOTES="Inserisci una nota a piacere per la voce della whitelist, ad esempio la data di creazione o l'utente per cui è stata creata."
COM_BFSTOP_DESC_DURATION="La durata del blocco"
