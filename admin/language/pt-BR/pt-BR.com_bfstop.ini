COM_BFSTOP_WARNING_ADMIN_USER_EXISTS="O Super Usuário está usando o nome de usuário padrão 'admin'. Isso é um risco de segurança; os atacantes sabem que esse nome de usuário existe em muitas instalações do Joomla!, por isso ele é muito usado em vários ataques. Para aumentar a segurança, recomenda-se alterar o nome de usuário do Super Usuário! Veja também: <a href='http://docs.joomla.org/Security_and_Performance_FAQs#Why_should_I_immediately_change_the_name_of_the_default_admin_user_after_a_new_install.3F' target='_blank'>Joomla! Security and Performance FAQ: Why should I immediately change the name of the default admin user after a new install?</a>"
COM_BFSTOP_WARNING_HTACCESS_NOT_WORKING="Ou você não está usando um servidor Apache, ou o arquivo .htaccess não existe ou não pode ser lido nem gravado. O bloqueio via .htaccess não vai funcionar."
COM_BFSTOP_WARNING_PLUGIN_NOT_INSTALLED="O plugin bfstop não está instalado! Instale o pacote bfstop mais recente a partir da <a href='https://bfstop.bfroehler.info'>página do bfstop</a> ou do <a href='https://extensions.joomla.org/'>Joomla Extensions Directory</a>!"
COM_BFSTOP_WARNING_CANNOT_RETRIEVE_COMPONENT_CACHE="Não foi possível obter o cache do manifesto do componente BFStop. Parece haver algo errado com a sua instalação do Joomla!. Instale o pacote bfstop mais recente a partir da <a href='https://bfstop.bfroehler.info'>página do bfstop</a> ou do <a href='https://extensions.joomla.org/'>Joomla Extensions Directory</a>!"
COM_BFSTOP_WARNING_COMPONENT_PLUGIN_DIFFERENT_VERSION="O plugin e o componente BFStop parecem estar instalados em versões diferentes. Instale o pacote bfstop mais recente a partir da <a href='https://bfstop.bfroehler.info'>página do bfstop</a> ou do <a href='https://extensions.joomla.org/'>Joomla Extensions Directory</a>!"
COM_BFSTOP_WARNING_PLUGIN_DISABLED="O plugin BFStop não está ativado! Acesse a <a href=\"%s\">visão geral de plugins</a>, procure por 'Brute Force Stop' e ative o plugin 'System - Brute Force Stop' - ele precisa estar em execução para que o bloqueio tenha efeito. Todas as configurações do BFStop são feitas aqui neste componente, não no próprio plugin."
COM_BFSTOP_WARNING_PROXY_NOT_CONFIGURED="Um cabeçalho de proxy / balanceador de carga (por exemplo, X-Forwarded-For) foi detectado nesta requisição, mas 'Atrás de um proxy / balanceador de carga' não está ativado nas <a href=\"%s\">configurações do componente</a>. Sem essa configuração, o BFStop só confia no endereço da conexão direta, então o bloqueio por IP pode não funcionar corretamente atrás do seu proxy. Se o seu site realmente está atrás de um proxy reverso ou de um balanceador de carga, acesse a visualização Configurações do componente e ative e configure as opções de 'Proxy / Balanceador de carga' - caso contrário, um visitante poderia forjar esse cabeçalho para fazer um endereço IP arbitrário ser bloqueado."
COM_BFSTOP_BLOCK_NEW="Adicionar"
COM_BFSTOP_BLOCK_EDIT="Editar"
