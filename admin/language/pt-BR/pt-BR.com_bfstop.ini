COM_BFSTOP_YOUR_IP_IS="O seu endereço IP, como o BFStop o vê, é %s."
COM_BFSTOP_INSTALL_HINT="O Brute Force Stop protege o seu site com as configurações padrão assim que o plugin é instalado (o pacote o instala e ativa). Revise-as na <a href=\"%s\">visualização Configurações do componente</a>."
COM_BFSTOP_SETTINGS_ACCOUNT_FIELDSET_LABEL="Limitação no nível da conta"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_ENABLED_LABEL="Ativar a limitação no nível da conta"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_ENABLED_DESC="Se os logins com falha também devem ser contados por nome de usuário, somando todos os endereços IP de origem que os tentaram - e não apenas por endereço IP. Isso detecta um ataque distribuído que espalha as tentativas contra uma única conta por muitos IPs diferentes, o que o limite de bloqueio normal por IP, sozinho, não consegue detectar. A conta em si nunca é bloqueada; apenas as tentativas com falha são atrasadas progressivamente."
COM_BFSTOP_SETTINGS_ACCOUNT_BLOCK_NUMBER_LABEL="Tentativas com falha antes da limitação"
COM_BFSTOP_SETTINGS_ACCOUNT_BLOCK_NUMBER_DESC="Quantos logins com falha para o mesmo nome de usuário, somados em todos os endereços IP de origem, dentro da janela de contagem abaixo, são necessários antes que as tentativas seguintes para esse nome de usuário recebam um atraso adicional."
COM_BFSTOP_SETTINGS_ACCOUNT_CHECK_INTERVAL_LABEL="Janela de contagem (minutos)"
COM_BFSTOP_SETTINGS_ACCOUNT_CHECK_INTERVAL_DESC="A janela de tempo (em minutos) dentro da qual as tentativas com falha para o mesmo nome de usuário são contadas, independentemente do endereço IP de origem."
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_DELAY_LABEL="Atraso adicional (segundos)"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_DELAY_DESC="Quantos segundos de atraso adicional somar a cada novo login com falha de um nome de usuário limitado, além de qualquer outro atraso já configurado."
COM_BFSTOP_SETTINGS_GEOIP_FIELDSET_LABEL="Banco de dados GeoIP"
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_LABEL="Caminho do banco de dados GeoIP"
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_DESC="Caminho completo, no sistema de arquivos do servidor, de um banco de dados .mmdb MaxMind GeoLite2 (ou GeoIP2), por exemplo GeoLite2-City.mmdb. Baixe a sua própria cópia na MaxMind (é necessária uma conta gratuita) - o BFStop não inclui nem redistribui esses dados. É preciso um banco de dados do nível City para que a visualização 'Informações do endereço IP' mostre região, cidade e coordenadas; um banco do nível Country basta para o sinal de pontuação de risco adaptativa abaixo. Deixe vazio para desativar ambos. A consulta é totalmente local; nenhum endereço IP é enviado a terceiros."
COM_BFSTOP_SETTINGS_RISK_FIELDSET_LABEL="Pontuação de risco adaptativa"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_ENABLED_LABEL="Ativar o sinal de confiança de IP conhecido"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_ENABLED_DESC="Se ativado, um login com falha é tratado como menos arriscado (mais tentativas permitidas) quando o mesmo endereço IP já fez login com sucesso exatamente com esse nome de usuário. Vale para o par (IP, nome de usuário) e não só para o IP, de modo que entrar como um usuário não pode reduzir a pontuação de risco de tentativas contra outro nome de usuário a partir do mesmo IP."
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_POINTS_LABEL="Pontos de confiança de IP conhecido"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_POINTS_DESC="Quantos pontos de risco subtrair (ou seja, quanto mais confiar na tentativa) quando o sinal de IP conhecido se aplica."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_ENABLED_LABEL="Ativar o sinal de nome de usuário comum"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_ENABLED_DESC="Se ativado, um login com falha é tratado como mais arriscado (menos tentativas permitidas) quando o nome de usuário usado corresponde a um dos nomes comuns ou de alto valor listados abaixo."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_LIST_LABEL="Nomes de usuário comuns"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_LIST_DESC="Um nome de usuário por linha (sem diferenciar maiúsculas de minúsculas). Tentativas contra qualquer um desses nomes são tratadas como mais arriscadas."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_POINTS_LABEL="Pontos de nome de usuário comum"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_POINTS_DESC="Quantos pontos de risco somar quando o nome de usuário usado corresponde à lista de nomes comuns."
COM_BFSTOP_SETTINGS_RISK_USERAGENT_ENABLED_LABEL="Ativar o sinal de User-Agent ausente"
COM_BFSTOP_SETTINGS_RISK_USERAGENT_ENABLED_DESC="Se ativado, um login com falha sem cabeçalho User-Agent do navegador (ou com ele vazio) é tratado como mais arriscado - navegadores reais sempre enviam um, mas muitos scripts de login automatizados simples não se dão ao trabalho de defini-lo."
COM_BFSTOP_SETTINGS_RISK_USERAGENT_POINTS_LABEL="Pontos de User-Agent ausente"
COM_BFSTOP_SETTINGS_RISK_USERAGENT_POINTS_DESC="Quantos pontos de risco somar quando a requisição não tem cabeçalho User-Agent."
COM_BFSTOP_SETTINGS_RISK_GEO_ENABLED_LABEL="Ativar o sinal GeoIP"
COM_BFSTOP_SETTINGS_RISK_GEO_ENABLED_DESC="Se ativado, um login com falha é tratado como mais arriscado quando o país do IP atacante (consultado no banco de dados GeoIP configurado acima) não é um dos países de origem configurados. Requer que o caminho do banco de dados GeoIP esteja configurado; caso contrário, não faz nada."
COM_BFSTOP_SETTINGS_RISK_GEO_HOME_COUNTRIES_LABEL="Países de origem"
COM_BFSTOP_SETTINGS_RISK_GEO_HOME_COUNTRIES_DESC="Lista separada por vírgulas de códigos de país ISO 3166-1 alfa-2 (por exemplo 'AT,DE,CH') considerados a região esperada ou típica do seu site. Uma tentativa vinda de qualquer outro país soma pontos de risco."
COM_BFSTOP_SETTINGS_RISK_GEO_POINTS_LABEL="Pontos geográficos"
COM_BFSTOP_SETTINGS_RISK_GEO_POINTS_DESC="Quantos pontos de risco somar quando o país do IP atacante não está na lista de países de origem."
COM_BFSTOP_SETTINGS_RISK_RDNS_ENABLED_LABEL="Ativar o sinal de DNS reverso"
COM_BFSTOP_SETTINGS_RISK_RDNS_ENABLED_DESC="Se ativado, um login com falha vindo de um endereço IP sem registro de DNS reverso (PTR) é tratado como mais arriscado. Atenção: isso faz uma consulta DNS real, que pode ser lenta ou ocasionalmente expirar - os resultados ficam em cache por uma semana por IP para limitar a frequência, mas deixe desativado a menos que você entenda a troca em relação à latência."
COM_BFSTOP_SETTINGS_RISK_RDNS_POINTS_LABEL="Pontos de DNS reverso"
COM_BFSTOP_SETTINGS_RISK_RDNS_POINTS_DESC="Quantos pontos de risco somar quando o IP atacante não tem registro de DNS reverso (PTR)."
COM_BFSTOP_SETTINGS_PROGRESSIVE_BLOCK_DURATION_LABEL="Duração progressiva do bloqueio"
COM_BFSTOP_SETTINGS_PROGRESSIVE_BLOCK_DURATION_DESC="Se ativado, a cada vez que o mesmo endereço IP é bloqueado novamente, a duração do bloqueio é dobrada em relação ao bloqueio anterior (até o limite de 64 vezes), em vez de sempre usar a mesma duração fixa. Continua limitada pela passagem para o bloqueio permanente configurada abaixo."
COM_BFSTOP_SETTINGS_BLOCK_MODE_LABEL="Modo de bloqueio"
COM_BFSTOP_SETTINGS_BLOCK_MODE_DESC="O que acontece depois que um endereço IP é bloqueado. 'Somente relatório' nunca restringe nada - as tentativas com falha continuam sendo registradas, mas nenhum IP é bloqueado, então use-o para observar a atividade antes de aplicar qualquer coisa. 'Somente login' deixa o IP continuar navegando normalmente pelo site (inclusive vendo o formulário de login) e recusa apenas a tentativa de login em si - mais próximo do comportamento típico de um limitador de tentativas de login e menos incômodo para um usuário legítimo que apenas errou a senha. 'Site inteiro' recusa todas as requisições do endereço IP bloqueado e mostra a mensagem configurada abaixo. 'Site inteiro + .htaccess' faz o mesmo e, além disso, acrescenta o IP ao .htaccess para que o próprio servidor web o recuse antes que o Joomla (e este plugin) chegue a ver a requisição - isso também significa que um IP bloqueado assim não pode ser restrito apenas ao login, por isso não é oferecido junto com 'Somente login'. Vale para todos os bloqueios, sejam criados automaticamente ou adicionados manualmente na lista de bloqueios."
COM_BFSTOP_SETTINGS_BLOCK_MODE_OFF="Somente relatório"
COM_BFSTOP_SETTINGS_BLOCK_MODE_LOGINONLY="Somente login"
COM_BFSTOP_SETTINGS_BLOCK_MODE_FULL="Site inteiro"
COM_BFSTOP_SETTINGS_BLOCK_MODE_HTACCESS="Site inteiro + .htaccess"
COM_BFSTOP_SETTINGS_RISK_DELAY_PER_POINT_LABEL="Segundos de atraso por ponto de risco"
COM_BFSTOP_SETTINGS_RISK_DELAY_PER_POINT_DESC="Quantos segundos de atraso adicional somar por ponto positivo (arriscado) da pontuação de risco combinada, além do atraso configurado acima. Uma pontuação negativa (de confiança) nunca reduz o atraso abaixo do configurado acima. 0 (o padrão) não adiciona atraso: cada segundo de atraso mantém ocupado um processo PHP do servidor, veja \"Respostas atrasadas ao mesmo tempo\"."
COM_BFSTOP_SETTINGS_RISK_BLOCK_REDUCTION_PER_POINT_LABEL="Alteração do limite de bloqueio por ponto de risco"
COM_BFSTOP_SETTINGS_RISK_BLOCK_REDUCTION_PER_POINT_DESC="Quanto reduzir (para uma pontuação positiva/arriscada) ou aumentar (para uma pontuação negativa/de confiança) o número de tentativas com falha permitidas antes do bloqueio, por ponto da pontuação de risco combinada."
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_LABEL="Mínimo de tentativas permitidas"
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_DESC="Um piso rígido para o número de tentativas com falha permitidas ajustado pelo risco, para que uma pontuação de risco extrema nunca possa reduzi-lo a zero (ou menos) e, na prática, bloquear já na primeira tentativa."
COM_BFSTOP_FAILEDLOGIN_AUTOPURGE_ENABLED="Entradas de logins com falha com mais de %d semanas são excluídas automaticamente. Você pode alterar isso na configuração 'Limpar tentativas antigas', na aba 'Avançado' das <a href=\"%s\">Configurações</a>."
COM_BFSTOP_FAILEDLOGIN_AUTOPURGE_DISABLED="Entradas antigas de logins com falha não são excluídas automaticamente no momento. Para ativar, defina 'Limpar tentativas antigas' na aba 'Avançado' das <a href=\"%s\">Configurações</a>, ou use o botão 'Excluir entradas antigas' para limpá-las manualmente."
COM_BFSTOP_BLOCKLIST_AUTOPURGE_ENABLED="Bloqueios expirados (e seus registros de desbloqueio) encerrados há mais de %d semanas são excluídos automaticamente. Você pode alterar isso na configuração 'Limpar tentativas antigas', na aba 'Avançado' das <a href=\"%s\">Configurações</a>. Bloqueios permanentes nunca são excluídos automaticamente."
COM_BFSTOP_BLOCKLIST_AUTOPURGE_DISABLED="Bloqueios expirados não são excluídos automaticamente no momento. Para ativar, defina 'Limpar tentativas antigas' na aba 'Avançado' das <a href=\"%s\">Configurações</a>. Bloqueios permanentes nunca são excluídos automaticamente."
COM_BFSTOP_FAILEDLOGIN_PURGE_BUTTON="Excluir entradas antigas"
COM_BFSTOP_FAILEDLOGIN_PURGE_TITLE="Excluir entradas antigas de logins com falha"
COM_BFSTOP_FAILEDLOGIN_PURGE_DESC="Todas as entradas de logins com falha mais antigas que o número de dias informado serão excluídas permanentemente. Isso não pode ser desfeito. Os bloqueios não são afetados."
COM_BFSTOP_FAILEDLOGIN_PURGE_AGE_LABEL="Manter as entradas dos últimos ... dias"
COM_BFSTOP_FAILEDLOGIN_PURGE_CONFIRM="Excluir"
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED="%1$d entradas de logins com falha com mais de %2$d dias foram excluídas."
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED_0="Não havia entradas de logins com falha com mais de %2$d dias."
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED_1="Uma entrada de login com falha com mais de %2$d dias foi excluída."
COM_BFSTOP_FAILEDLOGIN_PURGE_INVALID_AGE="Informe um número de dias igual ou maior que 1."
COM_BFSTOP_FAILEDLOGIN_PURGE_FAILED="Falha ao excluir as entradas antigas de logins com falha: %s"
COM_BFSTOP_SUBMENU_USERNAMESTATS="Estatísticas de nomes de usuário"
COM_BFSTOP_HEADING_USERNAMESTATS="Brute Force Stop: Estatísticas de nomes de usuário"
COM_BFSTOP_HEADING_RANK="#"
COM_BFSTOP_HEADING_FAILED_ATTEMPTS="Logins com falha"
COM_BFSTOP_HEADING_FIRST_ATTEMPT="Primeira tentativa"
COM_BFSTOP_USERNAMESTATS_INFO="Os nomes de usuário usados em tentativas de login com falha e quantas vezes cada um foi usado. Essas estatísticas são mantidas independentemente das entradas de logins com falha, portanto não são afetadas quando entradas antigas são excluídas; elas só começam com a instalação do (ou a atualização para o) BFStop 2.0.0, a partir das entradas de logins com falha que existiam naquele momento. Clique em um nome de usuário para ver as entradas de logins com falha dele que ainda estão armazenadas."
COM_BFSTOP_USERNAMESTATS_AUTOTRIM="No máximo %d nomes de usuário são mantidos: acima disso, os nomes com menos tentativas são excluídos automaticamente (uma vez por dia). Esse limite não pode ser alterado."
COM_BFSTOP_USERNAMESTATS_EXISTING_ACCOUNT="Conta existente"
COM_BFSTOP_USERNAMESTATS_EXISTING_ACCOUNT_DESC="Existe neste site uma conta de usuário com esse nome de usuário."
COM_BFSTOP_USERNAMESTATS_PURGE_BUTTON="Excluir nomes de usuário obsoletos"
COM_BFSTOP_USERNAMESTATS_PURGE_TITLE="Excluir estatísticas de nomes de usuário obsoletos"
COM_BFSTOP_USERNAMESTATS_PURGE_DESC="As estatísticas de todos os nomes de usuário que não foram usados em um login com falha há mais do número de dias informado serão excluídas permanentemente. Isso não pode ser desfeito. As entradas de logins com falha e os bloqueios não são afetados."
COM_BFSTOP_USERNAMESTATS_PURGE_AGE_LABEL="Excluir nomes de usuário não vistos há mais de ... dias"
COM_BFSTOP_USERNAMESTATS_PURGE_CONFIRM="Excluir"
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED="As estatísticas de %1$d nomes de usuário não vistos há mais de %2$d dias foram excluídas."
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED_0="Não havia nomes de usuário não vistos há mais de %2$d dias."
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED_1="As estatísticas de um nome de usuário não visto há mais de %2$d dias foram excluídas."
COM_BFSTOP_USERNAMESTATS_PURGE_INVALID_AGE="Informe um número de dias igual ou maior que 1."
COM_BFSTOP_USERNAMESTATS_PURGE_FAILED="Falha ao excluir as estatísticas de nomes de usuário obsoletos: %s"
COM_BFSTOP_FAILEDLOGIN_FILTERED_BY_USERNAME="Mostrando apenas os logins com falha do nome de usuário '%s'."
COM_BFSTOP_FAILEDLOGIN_FILTER_CLEAR="Mostrar todos"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_LABEL="Nomes de usuário que não correspondem a uma conta"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_DESC="Os usuários costumam digitar a senha no campo de nome de usuário. Com 'Hash', o nome de usuário de um login com falha só é armazenado (e exibido, registrado em log e enviado por e-mail) como foi digitado se pertencer a uma conta existente ou estiver na lista de nomes de usuário comuns; qualquer outro é substituído por um valor ilegível, que continua sendo o mesmo para a mesma entrada, de modo que as tentativas com ele são contadas juntas. 'Armazenar como digitado' mantém legível todo nome de usuário informado, mas então também armazena senhas digitadas no campo de nome de usuário."
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_HASH="Hash (recomendado)"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_PLAIN="Armazenar como digitado"
COM_BFSTOP_SETTINGS_EMAIL_INVALID="Não é um endereço de e-mail válido: %s"
COM_BFSTOP_SETTINGS_PROXY_IP_INVALID="Não é um endereço de proxy válido: %1$s. Cada entrada deve ser um endereço IP ou uma rede em notação CIDR, com um comprimento do prefixo de pelo menos /%2$d para IPv4 e /%3$d para IPv6."
COM_BFSTOP_SETTINGS_HTACCESS_PATH_INVALID="O caminho do .htaccess precisa ser um diretório existente no sistema de arquivos do servidor."
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_INVALID="O caminho do banco de dados GeoIP precisa ser o nome de um arquivo de banco de dados MaxMind (terminado em .mmdb) no sistema de arquivos do servidor."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_LABEL="Granularidade do rastreamento de IPv6"
COM_BFSTOP_SETTINGS_IPV6_PREFIX_DESC="Um cliente com endereço IPv6 normalmente controla uma rede inteira e pode mudar para outro endereço dela quando quiser. Por isso, os logins com falha e os bloqueios de clientes IPv6 são registrados por rede deste tamanho em vez de por endereço. Um /64 é uma única rede local; uma conexão doméstica, móvel ou empresarial normalmente recebe pelo menos um /56 - 256 redes desse tipo, de qualquer uma das quais o titular pode enviar requisições -, por isso /56 é recomendado. Escolha uma rede menor ou um único endereço apenas se souber que os clientes do seu site compartilham suas redes com outros que você não quer bloquear junto."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_128="Endereço único (/128)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_LABEL="Limite de tamanho do arquivo de log (MB)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_DESC="Quando o arquivo de log fica maior que isto, ele é movido para um segundo arquivo (plg_system_bfstop.1.log.php no diretório de logs), substituindo o anterior. Assim, os arquivos de log juntos nunca ocupam muito mais que o dobro deste tamanho."
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_LABEL="Manter entradas do log (dias)"
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_DESC="Entradas do log mais antigas que este número de dias são excluídas automaticamente (uma vez por dia, mesmo que o log seja desativado nesse meio-tempo). Use 0 para manter as entradas até atingir o limite de tamanho."
COM_BFSTOP_LOG_AUTOPRUNE_ENABLED="Entradas do log com mais de %1$d dias são excluídas automaticamente, e o arquivo de log é rotacionado quando ultrapassa %2$d MB. Você pode alterar isso na aba 'Avançado' das <a href=\"%3$s\">Configurações</a>."
COM_BFSTOP_LOG_AUTOPRUNE_DISABLED="Entradas antigas do log não são excluídas por idade no momento, apenas quando o arquivo de log é rotacionado ao ultrapassar %1$d MB. Para alterar isso, defina 'Manter entradas do log' nas <a href=\"%2$s\">Configurações</a>, ou use os botões 'Limpar entradas antigas do log' e 'Esvaziar o log'."
COM_BFSTOP_LOG_PRUNE_BUTTON="Limpar entradas antigas do log"
COM_BFSTOP_LOG_PRUNE_DISABLED="A limpeza precisa de um período de retenção: defina 'Manter entradas do log' nas <a href=\"%s\">Configurações</a> ou esvazie o log."
COM_BFSTOP_LOG_PRUNE_N_DELETED="%1$d entradas do log com mais de %2$d dias foram excluídas."
COM_BFSTOP_LOG_PRUNE_N_DELETED_0="Não havia entradas do log com mais de %2$d dias."
COM_BFSTOP_LOG_PRUNE_N_DELETED_1="Uma entrada do log com mais de %2$d dias foi excluída."
COM_BFSTOP_LOG_CLEAR_BUTTON="Esvaziar o log"
COM_BFSTOP_LOG_CLEAR_TITLE="Esvaziar o log"
COM_BFSTOP_LOG_CLEAR_DESC="Todas as entradas do log serão excluídas permanentemente, inclusive as do arquivo de log anterior. Isso não pode ser desfeito. Os bloqueios e as entradas de logins com falha não são afetados."
COM_BFSTOP_LOG_CLEAR_CONFIRM="Esvaziar"
COM_BFSTOP_LOG_CLEARED="O log foi esvaziado."
COM_BFSTOP_SETTINGS_NOTIFY_ANY_NEEDS_LIVE_SITE="Links de desbloqueio para qualquer endereço IP só podem ser enviados se o endereço do site estiver definido ($live_site no configuration.php do site). Defina-o lá, ou escolha enviar os links apenas a usuários que já fizeram login a partir do endereço bloqueado."
COM_BFSTOP_WARNING_NO_LIVE_SITE="O endereço do site não está definido ($live_site no configuration.php). O Joomla! então monta os links dos e-mails do Brute Force Stop com o host indicado em cada requisição, que um visitante pode escolher livremente - por isso os links de desbloqueio não podem ser enviados para qualquer endereço IP. Para definir o endereço, adicione esta linha à classe no configuration.php do site, com o endereço pelo qual o site é acessado (proposto a partir desta requisição, verifique-o): %s"
COM_BFSTOP_WARNING_NOTIFY_ANY_WITHOUT_LIVE_SITE="Os links de desbloqueio devem ser enviados para qualquer endereço IP (<a href=\"%s\">configurações</a>), mas o endereço do site não está definido ($live_site no configuration.php): eles só são enviados a usuários que já fizeram login a partir do endereço bloqueado."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_56="/56 (recomendado)"
COM_BFSTOP_SETTINGS_DELAY_MAX_CONCURRENT_LABEL="Respostas atrasadas ao mesmo tempo"
COM_BFSTOP_SETTINGS_DELAY_MAX_CONCURRENT_DESC="No máximo este número de respostas a logins com falha é atrasado ao mesmo tempo; as demais são respondidas imediatamente. Uma resposta atrasada mantém ocupado um processo PHP do servidor durante todo o atraso, e um atacante com muitos endereços pode enviar logins com falha em paralelo até não sobrar nenhum processo para outros visitantes. Mantenha este valor bem abaixo do número de processos PHP (p. ex. pm.max_children do PHP-FPM). Logins com falha respondidos imediatamente são contados e bloqueados normalmente."
COM_BFSTOP_IP_NETWORK_TOO_LARGE="A rede %1$s é grande demais: o comprimento do prefixo deve ser de pelo menos /%2$d para IPv4 e /%3$d para IPv6."
COM_BFSTOP_IPADDRESS_TRUSTED_PROXY="Isto é (ou contém) um proxy confiável das configurações: bloqueado no arquivo .htaccess, toda requisição que passa por ele seria recusada."
