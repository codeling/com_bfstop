COM_BFSTOP_FAILEDLOGIN_PURGE_CONFIRM="Удалить"
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED="Удалено записей о неудачных входах старше %2$d дн.: %1$d."
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED_0="Записей о неудачных входах старше %2$d дн. не было."
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED_1="Удалена одна запись о неудачном входе старше %2$d дн."
COM_BFSTOP_FAILEDLOGIN_PURGE_INVALID_AGE="Введите количество дней не менее 1."
COM_BFSTOP_FAILEDLOGIN_PURGE_FAILED="Не удалось удалить старые записи о неудачных входах: %s"
COM_BFSTOP_SUBMENU_USERNAMESTATS="Статистика имён пользователей"
COM_BFSTOP_HEADING_USERNAMESTATS="Brute Force Stop: Статистика имён пользователей"
COM_BFSTOP_HEADING_RANK="#"
COM_BFSTOP_HEADING_FAILED_ATTEMPTS="Неудачных входов"
COM_BFSTOP_HEADING_FIRST_ATTEMPT="Первая попытка"
COM_BFSTOP_USERNAMESTATS_INFO="Имена пользователей, использованные в неудачных попытках входа, и сколько раз использовалось каждое. Эта статистика ведётся независимо от записей о неудачных входах, поэтому удаление старых записей на неё не влияет; она начинается только с установки BFStop 2.0.0 (или обновления до неё) на основе записей о неудачных входах, существовавших на тот момент. Нажмите на имя пользователя, чтобы увидеть его ещё хранящиеся записи о неудачных входах."
COM_BFSTOP_USERNAMESTATS_AUTOTRIM="Хранится не более %d имён пользователей: сверх этого имена с наименьшим числом попыток удаляются автоматически (раз в сутки). Это ограничение изменить нельзя."
COM_BFSTOP_USERNAMESTATS_EXISTING_ACCOUNT="Существующая учётная запись"
COM_BFSTOP_USERNAMESTATS_EXISTING_ACCOUNT_DESC="На этом сайте существует учётная запись пользователя с таким именем."
COM_BFSTOP_USERNAMESTATS_PURGE_BUTTON="Удалить устаревшие имена"
COM_BFSTOP_USERNAMESTATS_PURGE_TITLE="Удаление статистики устаревших имён пользователей"
COM_BFSTOP_USERNAMESTATS_PURGE_DESC="Статистика всех имён пользователей, которые не использовались в неудачных входах дольше указанного числа дней, будет безвозвратно удалена. Это действие нельзя отменить. Записи о неудачных входах и блокировки не затрагиваются."
COM_BFSTOP_USERNAMESTATS_PURGE_AGE_LABEL="Удалить имена, не встречавшиеся более ... дн."
COM_BFSTOP_USERNAMESTATS_PURGE_CONFIRM="Удалить"
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED="Удалена статистика имён пользователей, не встречавшихся более %2$d дн.: %1$d."
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED_0="Имён пользователей, не встречавшихся более %2$d дн., не было."
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED_1="Удалена статистика одного имени пользователя, не встречавшегося более %2$d дн."
COM_BFSTOP_USERNAMESTATS_PURGE_INVALID_AGE="Введите количество дней не менее 1."
COM_BFSTOP_USERNAMESTATS_PURGE_FAILED="Не удалось удалить статистику устаревших имён пользователей: %s"
COM_BFSTOP_FAILEDLOGIN_FILTERED_BY_USERNAME="Показаны только неудачные входы для имени пользователя «%s»."
COM_BFSTOP_FAILEDLOGIN_FILTER_CLEAR="Показать все"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_LABEL="Имена, не соответствующие учётной записи"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_DESC="Пользователи часто вводят пароль в поле имени пользователя. В режиме «Хеш» имя пользователя при неудачном входе сохраняется (а также показывается, записывается в журнал и отправляется по почте) в том виде, как оно введено, только если оно принадлежит существующей учётной записи или есть в списке распространённых имён; всё остальное заменяется нечитаемым значением, которое для одного и того же ввода остаётся одинаковым, поэтому попытки с ним считаются вместе. «Сохранять как введено» оставляет каждое введённое имя читаемым, но тогда сохраняются и пароли, введённые в поле имени пользователя."
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_HASH="Хеш (рекомендуется)"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_PLAIN="Сохранять как введено"
COM_BFSTOP_SETTINGS_EMAIL_INVALID="Недопустимый адрес электронной почты: %s"
COM_BFSTOP_SETTINGS_HTACCESS_PATH_INVALID="Путь к .htaccess должен быть существующим каталогом в файловой системе сервера."
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_INVALID="Путь к базе данных GeoIP должен быть именем файла базы данных MaxMind (с расширением .mmdb) в файловой системе сервера."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_LABEL="Детализация отслеживания IPv6"
COM_BFSTOP_SETTINGS_IPV6_PREFIX_DESC="Клиент с адресом IPv6 обычно управляет целой сетью и может по желанию перейти на другой адрес в ней. Поэтому неудачные входы и блокировки клиентов IPv6 учитываются по сети такого размера, а не по адресу. /64 — это одна локальная сеть; домашнее, мобильное или корпоративное подключение обычно получает как минимум /56 — 256 таких сетей, из любой из которых владелец может отправлять запросы, — поэтому рекомендуется /56. Выбирайте меньшую сеть или один адрес, только если знаете, что клиенты вашего сайта делят свои сети с другими, которых вы не хотите блокировать вместе с ними."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_128="Отдельный адрес (/128)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_LABEL="Максимальный размер файла журнала (МБ)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_DESC="Когда файл журнала становится больше этого размера, он переносится во второй файл (plg_system_bfstop.1.log.php в каталоге журналов), заменяя предыдущий. Таким образом, файлы журнала вместе никогда не занимают намного больше удвоенного размера."
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_LABEL="Хранить записи журнала (дни)"
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_DESC="Записи журнала старше этого числа дней удаляются автоматически (раз в сутки, даже если тем временем ведение журнала отключено). Укажите 0, чтобы хранить записи до достижения предела размера."
COM_BFSTOP_LOG_AUTOPRUNE_ENABLED="Записи журнала старше %1$d дн. удаляются автоматически, а файл журнала ротируется, когда его размер превышает %2$d МБ. Это можно изменить на вкладке «Дополнительно» в <a href=\"%3$s\">настройках</a>."
COM_BFSTOP_LOG_AUTOPRUNE_DISABLED="Старые записи журнала сейчас не удаляются по возрасту, а только при ротации файла журнала после превышения %1$d МБ. Чтобы изменить это, задайте «Хранить записи журнала» в <a href=\"%2$s\">настройках</a> или воспользуйтесь кнопками «Очистить старое в журнале» и «Очистить журнал»."
COM_BFSTOP_LOG_PRUNE_BUTTON="Очистить старое в журнале"
COM_BFSTOP_LOG_PRUNE_DISABLED="Для очистки нужен срок хранения: задайте «Хранить записи журнала» в <a href=\"%s\">настройках</a> или очистите журнал целиком."
COM_BFSTOP_LOG_PRUNE_N_DELETED="Удалено записей журнала старше %2$d дн.: %1$d."
COM_BFSTOP_LOG_PRUNE_N_DELETED_0="Записей журнала старше %2$d дн. не было."
COM_BFSTOP_LOG_PRUNE_N_DELETED_1="Удалена одна запись журнала старше %2$d дн."
COM_BFSTOP_LOG_CLEAR_BUTTON="Очистить журнал"
COM_BFSTOP_LOG_CLEAR_TITLE="Очистка журнала"
COM_BFSTOP_LOG_CLEAR_DESC="Все записи журнала будут безвозвратно удалены, включая записи предыдущего файла журнала. Это действие нельзя отменить. Блокировки и записи о неудачных входах не затрагиваются."
COM_BFSTOP_LOG_CLEAR_CONFIRM="Очистить"
COM_BFSTOP_LOG_CLEARED="Журнал очищен."
COM_BFSTOP_SETTINGS_NOTIFY_ANY_NEEDS_LIVE_SITE="Ссылки разблокировки можно отправлять, только если задан адрес сайта ($live_site в configuration.php сайта). Задайте его там или отключите ссылки разблокировки."
COM_BFSTOP_WARNING_NO_LIVE_SITE="Адрес сайта не задан ($live_site в configuration.php). Тогда Joomla! строит ссылки в письмах Brute Force Stop с хостом, указанным в каждом запросе, который посетитель может выбрать произвольно, — поэтому ссылки разблокировки не отправляются, а уведомления администраторам не содержат адреса. Чтобы задать адрес, добавьте эту строку в класс в configuration.php сайта, указав адрес, по которому доступен сайт (предложен на основе этого запроса, проверьте его): %s"
COM_BFSTOP_WARNING_NOTIFY_ANY_WITHOUT_LIVE_SITE="Ссылки разблокировки должны отправляться (<a href=\"%s\">настройки</a>), но адрес сайта не задан ($live_site в configuration.php): ссылки разблокировки не отправляются."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_56="/56 (рекомендуется)"
COM_BFSTOP_SETTINGS_DELAY_MAX_CONCURRENT_LABEL="Одновременно задерживаемые ответы"
COM_BFSTOP_SETTINGS_DELAY_MAX_CONCURRENT_DESC="Одновременно задерживается не больше этого числа ответов на неудачные входы; остальные получают ответ сразу. Задержанный ответ занимает рабочий процесс PHP сервера на всё время задержки, и атакующий с множеством адресов может отправлять неудачные входы параллельно, пока для других посетителей не останется свободных процессов. Держите это значение заметно ниже числа процессов PHP (например, pm.max_children в PHP-FPM). Неудачные входы, получившие ответ сразу, учитываются и блокируются как обычно."
COM_BFSTOP_IP_NETWORK_TOO_LARGE="Сеть %1$s слишком велика: длина её префикса должна быть не меньше /%2$d для IPv4 и /%3$d для IPv6."
COM_BFSTOP_IPADDRESS_TRUSTED_PROXY="Это (или содержит) доверенный прокси из настроек: при блокировке в файле .htaccess отклонялся бы любой запрос, проходящий через него."
