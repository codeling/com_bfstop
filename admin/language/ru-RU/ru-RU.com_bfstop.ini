COM_BFSTOP_INSTALL_HINT="Brute Force Stop защищает сайт с настройками по умолчанию, как только установлен его плагин (пакет устанавливает и включает его). Проверьте настройки в <a href=\"%s\">разделе настроек компонента</a>."
COM_BFSTOP_SETTINGS_ACCOUNT_FIELDSET_LABEL="Замедление на уровне учётной записи"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_ENABLED_LABEL="Включить замедление на уровне учётной записи"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_ENABLED_DESC="Считать ли неудачные входы также по имени пользователя, суммируя все исходные IP-адреса, с которых они выполнялись, а не только по IP-адресу. Это позволяет выявить распределённую атаку, которая распределяет попытки против одной учётной записи между множеством разных IP, чего обычный порог блокировки по IP сам по себе обнаружить не может. Сама учётная запись никогда не блокируется; прогрессивно замедляются только неудачные попытки."
COM_BFSTOP_SETTINGS_ACCOUNT_BLOCK_NUMBER_LABEL="Неудачных попыток до замедления"
COM_BFSTOP_SETTINGS_ACCOUNT_BLOCK_NUMBER_DESC="Сколько неудачных входов с одним и тем же именем пользователя, суммарно со всех исходных IP-адресов, за указанное ниже окно подсчёта должно произойти, прежде чем для следующих попыток с этим именем появится дополнительная задержка."
COM_BFSTOP_SETTINGS_ACCOUNT_CHECK_INTERVAL_LABEL="Окно подсчёта (минуты)"
COM_BFSTOP_SETTINGS_ACCOUNT_CHECK_INTERVAL_DESC="Интервал времени (в минутах), в течение которого учитываются неудачные попытки с одним и тем же именем пользователя независимо от исходного IP-адреса."
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_DELAY_LABEL="Дополнительная задержка (секунды)"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_DELAY_DESC="Сколько секунд дополнительной задержки добавлять к каждому следующему неудачному входу для замедляемого имени пользователя поверх любой другой уже настроенной задержки."
COM_BFSTOP_SETTINGS_GEOIP_FIELDSET_LABEL="База данных GeoIP"
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_LABEL="Путь к базе данных GeoIP"
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_DESC="Полный путь в файловой системе сервера к базе данных MaxMind GeoLite2 (или GeoIP2) в формате .mmdb, например GeoLite2-City.mmdb. Скачайте собственную копию на сайте MaxMind (нужна бесплатная учётная запись) - BFStop не включает и не распространяет эти данные. Для отображения региона, города и координат в разделе «Информация об IP-адресе» нужна база уровня City; для сигнала адаптивной оценки риска, описанного ниже, достаточно базы уровня Country. Оставьте поле пустым, чтобы отключить и то и другое. Поиск выполняется полностью локально; IP-адреса никогда не передаются третьим лицам."
COM_BFSTOP_SETTINGS_RISK_FIELDSET_LABEL="Адаптивная оценка риска"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_ENABLED_LABEL="Включить сигнал доверия «известный IP»"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_ENABLED_DESC="Если включено, неудачный вход считается менее рискованным (допускается больше попыток), когда с того же IP-адреса ранее уже был выполнен успешный вход именно с этим именем пользователя. Учитывается пара (IP, имя пользователя), а не один IP, поэтому вход под одним пользователем не может снизить оценку риска попыток с другим именем пользователя с того же IP."
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_POINTS_LABEL="Баллы доверия «известный IP»"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_POINTS_DESC="Сколько баллов риска вычитать (то есть насколько больше доверять попытке), когда срабатывает сигнал «известный IP»."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_ENABLED_LABEL="Включить сигнал «распространённое имя пользователя»"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_ENABLED_DESC="Если включено, неудачный вход считается более рискованным (допускается меньше попыток), когда использованное имя пользователя совпадает с одним из распространённых или ценных имён из списка ниже."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_LIST_LABEL="Распространённые имена пользователей"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_LIST_DESC="По одному имени пользователя в строке (без учёта регистра). Попытки с любым из этих имён считаются более рискованными."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_POINTS_LABEL="Баллы «распространённое имя пользователя»"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_POINTS_DESC="Сколько баллов риска добавлять, когда использованное имя пользователя есть в списке распространённых имён."
COM_BFSTOP_SETTINGS_RISK_USERAGENT_ENABLED_LABEL="Включить сигнал «отсутствует User-Agent»"
COM_BFSTOP_SETTINGS_RISK_USERAGENT_ENABLED_DESC="Если включено, неудачный вход без заголовка User-Agent браузера (или с пустым заголовком) считается более рискованным: настоящие браузеры всегда его отправляют, а многие примитивные скрипты автоматического входа не утруждают себя его заданием."
COM_BFSTOP_SETTINGS_RISK_USERAGENT_POINTS_LABEL="Баллы «отсутствует User-Agent»"
COM_BFSTOP_SETTINGS_RISK_USERAGENT_POINTS_DESC="Сколько баллов риска добавлять, когда в запросе нет заголовка User-Agent."
COM_BFSTOP_SETTINGS_RISK_GEO_ENABLED_LABEL="Включить сигнал GeoIP"
COM_BFSTOP_SETTINGS_RISK_GEO_ENABLED_DESC="Если включено, неудачный вход считается более рискованным, когда страна атакующего IP (определяется по настроенной выше базе GeoIP) не входит в число настроенных «домашних» стран. Требуется, чтобы был задан путь к базе GeoIP; иначе параметр ничего не делает."
COM_BFSTOP_SETTINGS_RISK_GEO_HOME_COUNTRIES_LABEL="«Домашние» страны"
COM_BFSTOP_SETTINGS_RISK_GEO_HOME_COUNTRIES_DESC="Список двухбуквенных кодов стран ISO 3166-1 alpha-2 через запятую (например, «AT,DE,CH»), которые считаются ожидаемым или типичным регионом вашего сайта. Попытка из любой другой страны добавляет баллы риска."
COM_BFSTOP_SETTINGS_RISK_GEO_POINTS_LABEL="Географические баллы"
COM_BFSTOP_SETTINGS_RISK_GEO_POINTS_DESC="Сколько баллов риска добавлять, когда страны атакующего IP нет в списке «домашних» стран."
COM_BFSTOP_SETTINGS_RISK_RDNS_ENABLED_LABEL="Включить сигнал обратного DNS"
COM_BFSTOP_SETTINGS_RISK_RDNS_ENABLED_DESC="Если включено, неудачный вход с IP-адреса без записи обратного DNS (PTR) считается более рискованным. Внимание: при этом выполняется настоящий DNS-запрос, который может быть медленным или иногда завершаться по тайм-ауту; результаты кешируются на неделю для каждого IP, чтобы это случалось реже, но оставьте параметр выключенным, если не понимаете компромисс с задержкой."
COM_BFSTOP_SETTINGS_RISK_RDNS_POINTS_LABEL="Баллы обратного DNS"
COM_BFSTOP_SETTINGS_RISK_RDNS_POINTS_DESC="Сколько баллов риска добавлять, когда у атакующего IP нет записи обратного DNS (PTR)."
COM_BFSTOP_SETTINGS_PROGRESSIVE_BLOCK_DURATION_LABEL="Прогрессивная длительность блокировки"
COM_BFSTOP_SETTINGS_PROGRESSIVE_BLOCK_DURATION_DESC="Если включено, при каждой повторной блокировке одного и того же IP-адреса длительность блокировки удваивается по сравнению с предыдущей (максимум в 64 раза), вместо того чтобы всегда использовать одну и ту же фиксированную длительность. По-прежнему ограничена переходом к постоянной блокировке, настроенным ниже."
COM_BFSTOP_SETTINGS_BLOCK_MODE_LABEL="Режим блокировки"
COM_BFSTOP_SETTINGS_BLOCK_MODE_DESC="Что происходит после блокировки IP-адреса. «Только отчёты» ничего не ограничивает: неудачные попытки по-прежнему записываются, но ни один IP не блокируется, поэтому используйте этот режим, чтобы понаблюдать за активностью, прежде чем что-либо применять. «Только вход» позволяет IP как обычно просматривать сайт (включая форму входа) и отклоняет только саму попытку входа - это ближе к поведению типичного ограничителя попыток входа и меньше мешает добросовестному пользователю, который просто ошибся при вводе пароля. «Весь сайт» отклоняет все запросы с заблокированного IP-адреса и показывает сообщение, настроенное ниже. «Весь сайт + .htaccess» делает то же самое и дополнительно добавляет IP в .htaccess, чтобы сам веб-сервер отклонял его ещё до того, как запрос увидит Joomla (и этот плагин); это также означает, что IP, заблокированный таким образом, нельзя ограничить только входом, поэтому этот режим не предлагается вместе с «Только вход». Применяется к любой блокировке, созданной автоматически или добавленной вручную в список блокировок."
COM_BFSTOP_SETTINGS_BLOCK_MODE_OFF="Только отчёты"
COM_BFSTOP_SETTINGS_BLOCK_MODE_LOGINONLY="Только вход"
COM_BFSTOP_SETTINGS_BLOCK_MODE_FULL="Весь сайт"
COM_BFSTOP_SETTINGS_BLOCK_MODE_HTACCESS="Весь сайт + .htaccess"
COM_BFSTOP_SETTINGS_RISK_DELAY_PER_POINT_LABEL="Секунд задержки на балл риска"
COM_BFSTOP_SETTINGS_RISK_DELAY_PER_POINT_DESC="Сколько секунд дополнительной задержки добавлять за каждый положительный (рискованный) балл суммарной оценки риска поверх задержки, настроенной выше. Отрицательная (доверительная) оценка никогда не уменьшает задержку ниже настроенной выше. 0 (по умолчанию) не добавляет задержки: каждая секунда задержки занимает рабочий процесс PHP сервера, см. \"Одновременно задерживаемые ответы\"."
COM_BFSTOP_SETTINGS_RISK_BLOCK_REDUCTION_PER_POINT_LABEL="Изменение порога блокировки на балл риска"
COM_BFSTOP_SETTINGS_RISK_BLOCK_REDUCTION_PER_POINT_DESC="На сколько уменьшать (при положительной/рискованной оценке) или увеличивать (при отрицательной/доверительной оценке) число допустимых неудачных попыток до блокировки на каждый балл суммарной оценки риска."
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_LABEL="Минимум допустимых попыток"
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_DESC="Жёсткая нижняя граница для скорректированного с учётом риска числа допустимых неудачных попыток, чтобы экстремальная оценка риска никогда не могла снизить его до нуля (или ниже) и фактически заблокировать уже с первой попытки."
COM_BFSTOP_FAILEDLOGIN_AUTOPURGE_ENABLED="Записи о неудачных входах старше %d нед. удаляются автоматически. Это можно изменить параметром «Очистка старых попыток» на вкладке «Дополнительно» в <a href=\"%s\">настройках</a>."
COM_BFSTOP_FAILEDLOGIN_AUTOPURGE_DISABLED="Старые записи о неудачных входах сейчас не удаляются автоматически. Чтобы включить это, задайте «Очистка старых попыток» на вкладке «Дополнительно» в <a href=\"%s\">настройках</a> или воспользуйтесь кнопкой «Удалить старые записи» для ручной очистки."
COM_BFSTOP_BLOCKLIST_AUTOPURGE_ENABLED="Истёкшие блокировки (и записи об их снятии), закончившиеся более %d нед. назад, удаляются автоматически. Это можно изменить параметром «Очистка старых попыток» на вкладке «Дополнительно» в <a href=\"%s\">настройках</a>. Постоянные блокировки автоматически не удаляются никогда."
COM_BFSTOP_BLOCKLIST_AUTOPURGE_DISABLED="Истёкшие блокировки сейчас не удаляются автоматически. Чтобы включить это, задайте «Очистка старых попыток» на вкладке «Дополнительно» в <a href=\"%s\">настройках</a>. Постоянные блокировки автоматически не удаляются никогда."
COM_BFSTOP_FAILEDLOGIN_PURGE_BUTTON="Удалить старые записи"
COM_BFSTOP_FAILEDLOGIN_PURGE_TITLE="Удаление старых записей о неудачных входах"
COM_BFSTOP_FAILEDLOGIN_PURGE_DESC="Все записи о неудачных входах старше указанного числа дней будут безвозвратно удалены. Это действие нельзя отменить. Блокировки не затрагиваются."
