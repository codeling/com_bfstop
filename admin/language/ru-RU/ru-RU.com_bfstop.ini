COM_BFSTOP_DESC_BLOCK_IPADDRESS="IP-адрес (или подсеть), который нужно заблокировать. Подсети задаются в CIDR-нотации, то есть в виде <адрес подсети>/<число бит маски>, например «192.168.0.0/24». Будьте осторожны при вводе подсети, чтобы не заблокировать собственный IP!"
COM_BFSTOP_DESC_BLOCK_CRDATE="Начало блокировки (дата/время)"
COM_BFSTOP_DESC_ALLOWLIST_IPADDRESS="IP-адрес (или подсеть), для которого доступ к этому сайту всегда разрешён (отключает все блокировки и проверки, выполняемые плагином). Подсети задаются в CIDR-нотации, то есть в виде <адрес подсети>/<число бит маски>, например «192.168.0.0/24»"
COM_BFSTOP_DESC_ALLOWLIST_NOTES="Введите любую заметку к записи списка разрешённых, например время её создания или пользователя, для которого она создана."
