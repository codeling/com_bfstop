COM_BFSTOP_WARNING_ADMIN_USER_EXISTS="Супер администратор использует по умолчанию имя пользователя 'admin'. Это риск для безопасности; хакеры используют это имя пользователя очень часто для взлома. Для повышения безопасности рекомендуется изменить имя пользователя для супер администратора! Смотри также: <a href='http://docs.joomla.org/Security_and_Performance_FAQs#Why_should_I_immediately_change_the_name_of_the_default_admin_user_after_a_new_install.3F' target='_blank'>Joomla! FAQ Безопасность и производительность: Почему я должен немедленно изменить имя пользователя администратора по умолчанию после установки Joomla?</a>"
COM_BFSTOP_WARNING_HTACCESS_NOT_WORKING="Либо вы используете не сервер Apache, либо файл .htaccess не существует или недоступен для чтения или записи. Блокировка через .htaccess работать не будет."
COM_BFSTOP_WARNING_PLUGIN_NOT_INSTALLED="Плагин bfstop не установлен! Установите последнюю версию пакета bfstop со <a href='https://bfstop.bfroehler.info'>страницы bfstop</a> или из <a href='https://extensions.joomla.org/'>каталога расширений Joomla</a>!"
COM_BFSTOP_WARNING_CANNOT_RETRIEVE_COMPONENT_CACHE="Не удаётся получить кеш манифеста компонента BFStop. Похоже, с вашей установкой Joomla! что-то не так. Установите последнюю версию пакета bfstop со <a href='https://bfstop.bfroehler.info'>страницы bfstop</a> или из <a href='https://extensions.joomla.org/'>каталога расширений Joomla</a>!"
COM_BFSTOP_WARNING_COMPONENT_PLUGIN_DIFFERENT_VERSION="Плагин и компонент BFStop, судя по всему, установлены в разных версиях. Установите последнюю версию пакета bfstop со <a href='https://bfstop.bfroehler.info'>страницы bfstop</a> или из <a href='https://extensions.joomla.org/'>каталога расширений Joomla</a>!"
COM_BFSTOP_WARNING_PLUGIN_DISABLED="Плагин BFStop не включён! Откройте <a href=\"%s\">список плагинов</a>, найдите «Brute Force Stop» и включите плагин «System - Brute Force Stop» - он должен работать, чтобы блокировка действовала. Все настройки BFStop задаются здесь, в этом компоненте, а не в самом плагине."
COM_BFSTOP_WARNING_PROXY_NOT_CONFIGURED="В этом запросе обнаружен заголовок прокси / балансировщика нагрузки (например, X-Forwarded-For), но параметр «За прокси / балансировщиком нагрузки» не включён в <a href=\"%s\">настройках компонента</a>. Без этой настройки BFStop доверяет только адресу прямого соединения, поэтому блокировка по IP за вашим прокси может работать неправильно. Если ваш сайт действительно находится за обратным прокси или балансировщиком нагрузки, откройте раздел «Настройки» компонента, включите и настройте параметры «Прокси / Балансировщик нагрузки» - иначе посетитель сможет подделать этот заголовок и добиться блокировки произвольного IP-адреса."
