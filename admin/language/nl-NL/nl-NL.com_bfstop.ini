COM_BFSTOP_WARNING_PLUGIN_DISABLED="De BFStop-plugin is niet ingeschakeld! Ga naar het <a href=\"%s\">pluginoverzicht</a>, zoek op 'Brute Force Stop' en schakel de plugin 'System - Brute Force Stop' in - die moet actief zijn om te kunnen blokkeren. Alle BFStop-instellingen worden hier in deze component ingesteld, niet in de plugin zelf."
COM_BFSTOP_WARNING_PROXY_NOT_CONFIGURED="Bij dit verzoek is een proxy-/load balancer-header (bijvoorbeeld X-Forwarded-For) gedetecteerd, maar 'Achter een proxy / load balancer' is niet ingeschakeld in de <a href=\"%s\">componentinstellingen</a>. Zonder deze instelling vertrouwt BFStop alleen het adres van de directe verbinding, waardoor blokkeren op basis van IP achter je proxy mogelijk niet goed werkt. Staat je site wel achter een reverse proxy of load balancer, ga dan naar de weergave Instellingen van de component en schakel de opties onder 'Proxy / Load balancer' in en stel ze in - anders kan een bezoeker deze header vervalsen om een willekeurig IP-adres te laten blokkeren."
