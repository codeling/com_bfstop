COM_BFSTOP_SETTINGS_ACCOUNT_FIELDSET_LABEL="Beperking op accountniveau"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_ENABLED_LABEL="Beperking op accountniveau inschakelen"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_ENABLED_DESC="Of mislukte aanmeldingen ook per gebruikersnaam worden geteld, opgeteld over alle bron-IP-adressen die het hebben geprobeerd - en niet alleen per IP-adres. Zo wordt een gedistribueerde aanval opgemerkt die de pogingen tegen één account over veel verschillende IP's verspreidt, wat de gewone blokkadedrempel per IP alleen niet kan detecteren. Het account zelf wordt nooit vergrendeld; alleen mislukte pogingen worden steeds verder vertraagd."
COM_BFSTOP_SETTINGS_ACCOUNT_BLOCK_NUMBER_LABEL="Mislukte pogingen vóór beperking"
COM_BFSTOP_SETTINGS_ACCOUNT_BLOCK_NUMBER_DESC="Hoeveel mislukte aanmeldingen voor dezelfde gebruikersnaam, opgeteld over alle bron-IP-adressen, binnen het hieronder ingestelde telvenster nodig zijn voordat verdere pogingen voor die gebruikersnaam extra worden vertraagd."
COM_BFSTOP_SETTINGS_ACCOUNT_CHECK_INTERVAL_LABEL="Telvenster (minuten)"
COM_BFSTOP_SETTINGS_ACCOUNT_CHECK_INTERVAL_DESC="Het tijdvenster (in minuten) waarbinnen mislukte pogingen voor dezelfde gebruikersnaam worden geteld, ongeacht het bron-IP-adres."
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_DELAY_LABEL="Extra vertraging (seconden)"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_DELAY_DESC="Hoeveel seconden extra vertraging worden toegevoegd aan elke verdere mislukte aanmelding voor een beperkte gebruikersnaam, bovenop elke andere al ingestelde vertraging."
COM_BFSTOP_SETTINGS_GEOIP_FIELDSET_LABEL="GeoIP-database"
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_LABEL="Pad naar de GeoIP-database"
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_DESC="Volledig pad in het bestandssysteem van de server naar een MaxMind GeoLite2- (of GeoIP2-)database in .mmdb-formaat, bijvoorbeeld GeoLite2-City.mmdb. Download je eigen kopie bij MaxMind (hiervoor is een gratis account nodig) - BFStop bundelt of verspreidt deze gegevens niet. Een database van het niveau City is nodig om in de beheerweergave 'Informatie voor IP-adres' regio, plaats en coördinaten te tonen; voor het hieronder genoemde signaal van de adaptieve risicoscore volstaat een database van het niveau Country. Laat leeg om beide uit te schakelen. De opzoeking gebeurt volledig lokaal; er wordt nooit een IP-adres naar een derde partij gestuurd."
COM_BFSTOP_SETTINGS_RISK_FIELDSET_LABEL="Adaptieve risicoscore"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_ENABLED_LABEL="Vertrouwenssignaal 'bekend IP' inschakelen"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_ENABLED_DESC="Indien ingeschakeld wordt een mislukte aanmelding als minder riskant beschouwd (meer pogingen toegestaan) wanneer hetzelfde IP-adres eerder succesvol is aangemeld met precies die gebruikersnaam. Dit geldt voor het paar (IP, gebruikersnaam) en niet voor het IP alleen, zodat aanmelden als de ene gebruiker de risicoscore van pogingen tegen een andere gebruikersnaam vanaf hetzelfde IP niet kan verlagen."
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_POINTS_LABEL="Vertrouwenspunten 'bekend IP'"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_POINTS_DESC="Hoeveel risicopunten er worden afgetrokken (dus hoeveel meer de poging wordt vertrouwd) wanneer het signaal 'bekend IP' van toepassing is."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_ENABLED_LABEL="Signaal 'veelgebruikte gebruikersnaam' inschakelen"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_ENABLED_DESC="Indien ingeschakeld wordt een mislukte aanmelding als riskanter beschouwd (minder pogingen toegestaan) wanneer de gebruikte gebruikersnaam overeenkomt met een van de hieronder genoemde veelgebruikte of waardevolle gebruikersnamen."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_LIST_LABEL="Veelgebruikte gebruikersnamen"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_LIST_DESC="Eén gebruikersnaam per regel (hoofdletterongevoelig). Pogingen tegen een van deze gebruikersnamen worden als riskanter beschouwd."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_POINTS_LABEL="Punten 'veelgebruikte gebruikersnaam'"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_POINTS_DESC="Hoeveel risicopunten er worden toegevoegd wanneer de gebruikte gebruikersnaam overeenkomt met de lijst van veelgebruikte gebruikersnamen."
COM_BFSTOP_SETTINGS_RISK_USERAGENT_ENABLED_LABEL="Signaal 'ontbrekende User-Agent' inschakelen"
COM_BFSTOP_SETTINGS_RISK_USERAGENT_ENABLED_DESC="Indien ingeschakeld wordt een mislukte aanmelding zonder (of met een lege) User-Agent-header van de browser als riskanter beschouwd - echte browsers sturen er altijd een mee, maar veel eenvoudige geautomatiseerde aanmeldscripts stellen hem niet in."
COM_BFSTOP_SETTINGS_RISK_USERAGENT_POINTS_LABEL="Punten 'ontbrekende User-Agent'"
COM_BFSTOP_SETTINGS_RISK_USERAGENT_POINTS_DESC="Hoeveel risicopunten er worden toegevoegd wanneer het verzoek geen User-Agent-header heeft."
COM_BFSTOP_SETTINGS_RISK_GEO_ENABLED_LABEL="GeoIP-signaal inschakelen"
COM_BFSTOP_SETTINGS_RISK_GEO_ENABLED_DESC="Indien ingeschakeld wordt een mislukte aanmelding als riskanter beschouwd wanneer het land van het aanvallende IP (opgezocht in de hierboven ingestelde GeoIP-database) niet een van de ingestelde thuislanden is. Hiervoor moet het pad naar de GeoIP-database zijn ingesteld; anders doet dit niets."
COM_BFSTOP_SETTINGS_RISK_GEO_HOME_COUNTRIES_LABEL="Thuislanden"
COM_BFSTOP_SETTINGS_RISK_GEO_HOME_COUNTRIES_DESC="Door komma's gescheiden lijst van ISO 3166-1 alpha-2-landcodes (bijvoorbeeld 'AT,DE,CH') die als de verwachte of typische regio van je site gelden. Een poging vanuit een ander land voegt risicopunten toe."
COM_BFSTOP_SETTINGS_RISK_GEO_POINTS_LABEL="Geopunten"
COM_BFSTOP_SETTINGS_RISK_GEO_POINTS_DESC="Hoeveel risicopunten er worden toegevoegd wanneer het land van het aanvallende IP niet in de lijst met thuislanden staat."
COM_BFSTOP_SETTINGS_RISK_RDNS_ENABLED_LABEL="Reverse-DNS-signaal inschakelen"
COM_BFSTOP_SETTINGS_RISK_RDNS_ENABLED_DESC="Indien ingeschakeld wordt een mislukte aanmelding vanaf een IP-adres zonder reverse-DNS-record (PTR) als riskanter beschouwd. Let op: dit voert een echte DNS-opzoeking uit, die traag kan zijn of af en toe een time-out kan geven - resultaten worden een week per IP gecachet om dit te beperken, maar laat dit uitgeschakeld tenzij je de afweging met de latentie begrijpt."
COM_BFSTOP_SETTINGS_RISK_RDNS_POINTS_LABEL="Reverse-DNS-punten"
COM_BFSTOP_SETTINGS_RISK_RDNS_POINTS_DESC="Hoeveel risicopunten er worden toegevoegd wanneer het aanvallende IP geen reverse-DNS-record (PTR) heeft."
COM_BFSTOP_SETTINGS_PROGRESSIVE_BLOCK_DURATION_LABEL="Oplopende blokkadeduur"
COM_BFSTOP_SETTINGS_PROGRESSIVE_BLOCK_DURATION_DESC="Indien ingeschakeld wordt de blokkadeduur telkens als hetzelfde IP-adres opnieuw wordt geblokkeerd verdubbeld ten opzichte van de vorige blokkade (tot maximaal 64 keer), in plaats van steeds dezelfde vaste duur te gebruiken. Blijft nog steeds begrensd door de hieronder ingestelde overgang naar een permanente blokkade."
COM_BFSTOP_SETTINGS_BLOCK_MODE_LABEL="Blokkeermodus"
COM_BFSTOP_SETTINGS_BLOCK_MODE_DESC="Wat er gebeurt zodra een IP-adres is geblokkeerd. 'Alleen rapporteren' beperkt nooit iets - mislukte pogingen worden nog steeds gelogd, maar er wordt nooit een IP geblokkeerd; gebruik dit om de activiteit te bekijken voordat je iets afdwingt. 'Alleen aanmelden' laat het IP gewoon op de site rondkijken (inclusief het aanmeldformulier) en weigert alleen de aanmeldpoging zelf - dichter bij hoe een begrenzer van aanmeldpogingen gewoonlijk werkt, en minder storend voor een legitieme gebruiker die zich gewoon in zijn wachtwoord heeft vergist. 'Hele site' weigert elk verzoek van het geblokkeerde IP-adres en toont het hieronder ingestelde bericht. 'Hele site + .htaccess' doet hetzelfde en voegt het IP bovendien toe aan .htaccess, zodat de webserver zelf het weigert voordat Joomla (en deze plugin) het verzoek ziet - dit betekent ook dat een zo geblokkeerd IP niet tot alleen aanmelden beperkt kan worden, dus wordt het niet samen met 'Alleen aanmelden' aangeboden. Geldt voor elke blokkade, of die nu automatisch is aangemaakt of handmatig aan de blokkadelijst is toegevoegd."
COM_BFSTOP_SETTINGS_BLOCK_MODE_OFF="Alleen rapporteren"
COM_BFSTOP_SETTINGS_BLOCK_MODE_LOGINONLY="Alleen aanmelden"
COM_BFSTOP_SETTINGS_BLOCK_MODE_FULL="Hele site"
COM_BFSTOP_SETTINGS_BLOCK_MODE_HTACCESS="Hele site + .htaccess"
COM_BFSTOP_SETTINGS_RISK_DELAY_PER_POINT_LABEL="Seconden vertraging per risicopunt"
COM_BFSTOP_SETTINGS_RISK_DELAY_PER_POINT_DESC="Hoeveel seconden extra vertraging er worden toegevoegd per positief (riskant) punt van de gecombineerde risicoscore, bovenop de hierboven ingestelde vertraging. Een negatieve (vertrouwde) score verlaagt de vertraging nooit onder de hierboven ingestelde waarde. 0 (de standaard) voegt geen vertraging toe: elke seconde vertraging houdt een PHP-proces van de server bezig, zie \"Tegelijk vertraagde antwoorden\"."
COM_BFSTOP_SETTINGS_RISK_BLOCK_REDUCTION_PER_POINT_LABEL="Wijziging blokkadedrempel per risicopunt"
COM_BFSTOP_SETTINGS_RISK_BLOCK_REDUCTION_PER_POINT_DESC="Hoeveel het aantal toegestane mislukte pogingen vóór blokkade per punt van de gecombineerde risicoscore wordt verlaagd (bij een positieve/riskante score) of verhoogd (bij een negatieve/vertrouwde score)."
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_LABEL="Minimaal toegestane pogingen"
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_DESC="Een harde ondergrens voor het op risico aangepaste aantal toegestane mislukte pogingen, zodat een extreme risicoscore het nooit tot nul (of lager) kan verlagen en feitelijk al bij de allereerste poging blokkeert."
COM_BFSTOP_FAILEDLOGIN_AUTOPURGE_ENABLED="Mislukte aanmeldingen die ouder zijn dan %d weken worden automatisch verwijderd. Je kunt dit wijzigen met de instelling 'Oude pogingen opschonen' op het tabblad 'Geavanceerd' van de <a href=\"%s\">Instellingen</a>."
COM_BFSTOP_FAILEDLOGIN_AUTOPURGE_DISABLED="Oude mislukte aanmeldingen worden momenteel niet automatisch verwijderd. Stel hiervoor 'Oude pogingen opschonen' in op het tabblad 'Geavanceerd' van de <a href=\"%s\">Instellingen</a>, of gebruik de knop 'Oude items verwijderen' om ze handmatig op te ruimen."
COM_BFSTOP_BLOCKLIST_AUTOPURGE_ENABLED="Verlopen blokkades (en hun deblokkaderecords) die meer dan %d weken geleden zijn geëindigd, worden automatisch verwijderd. Je kunt dit wijzigen met de instelling 'Oude pogingen opschonen' op het tabblad 'Geavanceerd' van de <a href=\"%s\">Instellingen</a>. Permanente blokkades worden nooit automatisch verwijderd."
COM_BFSTOP_BLOCKLIST_AUTOPURGE_DISABLED="Verlopen blokkades worden momenteel niet automatisch verwijderd. Stel hiervoor 'Oude pogingen opschonen' in op het tabblad 'Geavanceerd' van de <a href=\"%s\">Instellingen</a>. Permanente blokkades worden nooit automatisch verwijderd."
COM_BFSTOP_FAILEDLOGIN_PURGE_BUTTON="Oude items verwijderen"
COM_BFSTOP_FAILEDLOGIN_PURGE_TITLE="Oude mislukte aanmeldingen verwijderen"
COM_BFSTOP_FAILEDLOGIN_PURGE_DESC="Alle mislukte aanmeldingen die ouder zijn dan het opgegeven aantal dagen worden definitief verwijderd. Dit kan niet ongedaan worden gemaakt. Blokkades worden niet beïnvloed."
COM_BFSTOP_FAILEDLOGIN_PURGE_AGE_LABEL="Items van de laatste ... dagen bewaren"
COM_BFSTOP_FAILEDLOGIN_PURGE_CONFIRM="Verwijderen"
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED="%1$d mislukte aanmeldingen die ouder waren dan %2$d dagen zijn verwijderd."
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED_0="Er waren geen mislukte aanmeldingen die ouder waren dan %2$d dagen."
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED_1="Eén mislukte aanmelding die ouder was dan %2$d dagen is verwijderd."
COM_BFSTOP_FAILEDLOGIN_PURGE_INVALID_AGE="Voer een aantal dagen van minimaal 1 in."
COM_BFSTOP_FAILEDLOGIN_PURGE_FAILED="Het verwijderen van oude mislukte aanmeldingen is mislukt: %s"
COM_BFSTOP_SUBMENU_USERNAMESTATS="Statistieken gebruikersnamen"
COM_BFSTOP_HEADING_USERNAMESTATS="Brute Force Stop: Statistieken gebruikersnamen"
COM_BFSTOP_HEADING_RANK="#"
COM_BFSTOP_HEADING_FAILED_ATTEMPTS="Mislukte logins"
COM_BFSTOP_HEADING_FIRST_ATTEMPT="Eerste poging"
COM_BFSTOP_USERNAMESTATS_INFO="De gebruikersnamen die bij mislukte aanmeldpogingen zijn gebruikt, en hoe vaak elk is gebruikt. Deze statistieken worden los van de mislukte aanmeldingen bijgehouden en worden dus niet beïnvloed wanneer oude mislukte aanmeldingen worden verwijderd; ze beginnen pas bij de installatie van (of update naar) BFStop 2.0.0, gevuld met de mislukte aanmeldingen die op dat moment bestonden. Klik op een gebruikersnaam om de nog opgeslagen mislukte aanmeldingen ervan te zien."
COM_BFSTOP_USERNAMESTATS_AUTOTRIM="Er worden maximaal %d gebruikersnamen bewaard: daarboven worden de gebruikersnamen met de minste pogingen automatisch verwijderd (één keer per dag). Deze limiet kan niet worden gewijzigd."
COM_BFSTOP_USERNAMESTATS_EXISTING_ACCOUNT="Bestaand account"
COM_BFSTOP_USERNAMESTATS_EXISTING_ACCOUNT_DESC="Er bestaat een gebruikersaccount met deze gebruikersnaam op deze site."
COM_BFSTOP_USERNAMESTATS_PURGE_BUTTON="Verouderde gebruikersnamen verwijderen"
COM_BFSTOP_USERNAMESTATS_PURGE_TITLE="Statistieken van verouderde gebruikersnamen verwijderen"
COM_BFSTOP_USERNAMESTATS_PURGE_DESC="De statistieken van alle gebruikersnamen die langer dan het opgegeven aantal dagen niet bij een mislukte aanmelding zijn gebruikt, worden definitief verwijderd. Dit kan niet ongedaan worden gemaakt. Mislukte aanmeldingen en blokkades worden niet beïnvloed."
COM_BFSTOP_USERNAMESTATS_PURGE_AGE_LABEL="Gebruikersnamen verwijderen die al meer dan ... dagen niet zijn gezien"
COM_BFSTOP_USERNAMESTATS_PURGE_CONFIRM="Verwijderen"
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED="De statistieken van %1$d gebruikersnamen die al meer dan %2$d dagen niet zijn gezien, zijn verwijderd."
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED_0="Er waren geen gebruikersnamen die al meer dan %2$d dagen niet zijn gezien."
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED_1="De statistieken van één gebruikersnaam die al meer dan %2$d dagen niet is gezien, zijn verwijderd."
COM_BFSTOP_USERNAMESTATS_PURGE_INVALID_AGE="Voer een aantal dagen van minimaal 1 in."
COM_BFSTOP_USERNAMESTATS_PURGE_FAILED="Het verwijderen van de statistieken van verouderde gebruikersnamen is mislukt: %s"
COM_BFSTOP_FAILEDLOGIN_FILTERED_BY_USERNAME="Alleen mislukte aanmeldingen voor gebruikersnaam '%s' worden getoond."
COM_BFSTOP_FAILEDLOGIN_FILTER_CLEAR="Alles tonen"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_LABEL="Gebruikersnamen die niet bij een account horen"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_DESC="Gebruikers typen hun wachtwoord vaak in het veld voor de gebruikersnaam. Met 'Hash' wordt de gebruikersnaam van een mislukte aanmelding alleen zoals getypt opgeslagen (en getoond, gelogd en gemaild) als die bij een bestaand account hoort of op de lijst van veelgebruikte gebruikersnamen staat; al het andere wordt vervangen door een onleesbare waarde, die voor dezelfde invoer wel hetzelfde blijft, zodat pogingen ermee samen worden geteld. 'Opslaan zoals getypt' houdt elke ingevoerde gebruikersnaam leesbaar, maar slaat dan ook wachtwoorden op die in het veld voor de gebruikersnaam zijn getypt."
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_HASH="Hash (aanbevolen)"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_PLAIN="Opslaan zoals getypt"
COM_BFSTOP_SETTINGS_EMAIL_INVALID="Geen geldig e-mailadres: %s"
COM_BFSTOP_SETTINGS_HTACCESS_PATH_INVALID="Het .htaccess-pad moet een bestaande map in het bestandssysteem van de server zijn."
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_INVALID="Het pad naar de GeoIP-database moet de naam zijn van een MaxMind-databasebestand (eindigend op .mmdb) in het bestandssysteem van de server."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_LABEL="Granulariteit van IPv6-tracking"
COM_BFSTOP_SETTINGS_IPV6_PREFIX_DESC="Een client met een IPv6-adres beheert meestal een heel netwerk en kan daarin naar believen naar een ander adres overstappen. Mislukte aanmeldingen en blokkeringen van IPv6-clients worden daarom per netwerk van deze grootte bijgehouden in plaats van per adres. Een /64 is één lokaal netwerk; een aansluiting thuis, mobiel of bij een bedrijf krijgt meestal minstens een /56 - 256 van zulke netwerken, vanuit elk waarvan de eigenaar verzoeken kan sturen -, daarom wordt /56 aanbevolen. Kies alleen een kleiner netwerk of één adres als je weet dat clients van je site hun netwerken delen met anderen die je niet samen wilt blokkeren."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_128="Enkel adres (/128)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_LABEL="Maximale grootte logbestand (MB)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_DESC="Zodra het logbestand groter is dan dit, wordt het verplaatst naar een tweede bestand (plg_system_bfstop.1.log.php in de logmap), dat het vorige vervangt. De logbestanden samen nemen dus nooit veel meer dan het dubbele van deze grootte in beslag."
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_LABEL="Logitems bewaren (dagen)"
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_DESC="Logitems die ouder zijn dan dit aantal dagen worden automatisch verwijderd (één keer per dag, ook als het loggen intussen is uitgeschakeld). Stel in op 0 om items te bewaren tot de maximale grootte is bereikt."
COM_BFSTOP_LOG_AUTOPRUNE_ENABLED="Logitems die ouder zijn dan %1$d dagen worden automatisch verwijderd, en het logbestand wordt geroteerd zodra het groter is dan %2$d MB. Je kunt dit wijzigen op het tabblad 'Geavanceerd' van de <a href=\"%3$s\">Instellingen</a>."
COM_BFSTOP_LOG_AUTOPRUNE_DISABLED="Oude logitems worden momenteel niet op leeftijd verwijderd, alleen wanneer het logbestand wordt geroteerd zodra het groter is dan %1$d MB. Stel om dit te wijzigen 'Logitems bewaren' in bij de <a href=\"%2$s\">Instellingen</a>, of gebruik de knoppen 'Log opschonen' en 'Log wissen'."
COM_BFSTOP_LOG_PRUNE_BUTTON="Log opschonen"
COM_BFSTOP_LOG_PRUNE_DISABLED="Opschonen vereist een bewaartermijn: stel 'Logitems bewaren' in bij de <a href=\"%s\">Instellingen</a>, of wis in plaats daarvan het log."
COM_BFSTOP_LOG_PRUNE_N_DELETED="%1$d logitems die ouder waren dan %2$d dagen zijn verwijderd."
COM_BFSTOP_LOG_PRUNE_N_DELETED_0="Er waren geen logitems die ouder waren dan %2$d dagen."
COM_BFSTOP_LOG_PRUNE_N_DELETED_1="Eén logitem dat ouder was dan %2$d dagen is verwijderd."
COM_BFSTOP_LOG_CLEAR_BUTTON="Log wissen"
COM_BFSTOP_LOG_CLEAR_TITLE="Het log wissen"
COM_BFSTOP_LOG_CLEAR_DESC="Alle logitems worden definitief verwijderd, inclusief die van het vorige logbestand. Dit kan niet ongedaan worden gemaakt. Blokkades en mislukte aanmeldingen worden niet beïnvloed."
COM_BFSTOP_LOG_CLEAR_CONFIRM="Wissen"
COM_BFSTOP_LOG_CLEARED="Het log is gewist."
COM_BFSTOP_SETTINGS_NOTIFY_ANY_NEEDS_LIVE_SITE="Deblokkeerlinks voor elk IP-adres kunnen alleen worden verzonden als het adres van de site is ingesteld ($live_site in de configuration.php van de site). Stel het daar in, of kies ervoor de links alleen te sturen naar gebruikers die zich al eerder vanaf het geblokkeerde adres hebben aangemeld."
COM_BFSTOP_WARNING_NO_LIVE_SITE="Het adres van de site is niet ingesteld ($live_site in configuration.php). Joomla! bouwt de links in de e-mails van Brute Force Stop dan met de host die elk verzoek noemt en die een bezoeker vrij kan kiezen - daarom kunnen deblokkeerlinks niet voor elk IP-adres worden verzonden. Voeg om het adres in te stellen deze regel toe aan de klasse in de configuration.php van de site, met het adres waaronder de site bereikbaar is (voorgesteld op basis van dit verzoek, controleer het): %s"
COM_BFSTOP_WARNING_NOTIFY_ANY_WITHOUT_LIVE_SITE="Deblokkeerlinks moeten voor elk IP-adres worden verzonden (<a href=\"%s\">instellingen</a>), maar het adres van de site is niet ingesteld ($live_site in configuration.php): ze gaan alleen naar gebruikers die zich al eerder vanaf het geblokkeerde adres hebben aangemeld."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_56="/56 (aanbevolen)"
COM_BFSTOP_SETTINGS_DELAY_MAX_CONCURRENT_LABEL="Tegelijk vertraagde antwoorden"
COM_BFSTOP_SETTINGS_DELAY_MAX_CONCURRENT_DESC="Hoogstens zoveel antwoorden op mislukte aanmeldingen worden tegelijk vertraagd; verdere worden meteen beantwoord. Een vertraagd antwoord houdt een PHP-proces van de server de hele vertraging bezig, en een aanvaller met veel adressen kan mislukte aanmeldingen parallel sturen tot er voor andere bezoekers geen proces meer vrij is. Houd deze waarde ruim onder het aantal PHP-processen (bijv. pm.max_children van PHP-FPM). Mislukte aanmeldingen die meteen worden beantwoord, worden zoals gewoonlijk geteld en geblokkeerd."
COM_BFSTOP_IP_NETWORK_TOO_LARGE="Het netwerk %1$s is te groot: de prefixlengte moet minstens /%2$d zijn voor IPv4 en /%3$d voor IPv6."
