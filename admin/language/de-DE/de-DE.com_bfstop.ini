COM_BFSTOP_INSTALL_HINT="Brute Force Stop schützt die Website mit den Standardeinstellungen, sobald das Plugin installiert ist (das Paket installiert und aktiviert es). Bitte die Einstellungen in der <a href=\"%s\">Einstellungen-Ansicht der Komponente</a> überprüfen."
COM_BFSTOP_SETTINGS_ACCOUNT_FIELDSET_LABEL="Drosselung auf Kontoebene"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_ENABLED_LABEL="Drosselung auf Kontoebene aktivieren"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_ENABLED_DESC="Ob fehlgeschlagene Logins zusätzlich pro Benutzername gezählt werden, summiert über alle Quell-IP-Adressen, von denen sie ausgingen - und nicht nur pro IP-Adresse. So wird ein verteilter Angriff erkannt, der seine Versuche gegen ein einzelnes Konto auf viele verschiedene IPs verteilt, was die übliche Sperrschwelle pro IP allein nicht erkennen kann. Das Konto selbst wird nie gesperrt; nur fehlgeschlagene Versuche werden zunehmend verzögert."
COM_BFSTOP_SETTINGS_ACCOUNT_BLOCK_NUMBER_LABEL="Fehlversuche bis zur Drosselung"
COM_BFSTOP_SETTINGS_ACCOUNT_BLOCK_NUMBER_DESC="Wie viele fehlgeschlagene Logins für denselben Benutzernamen, summiert über alle Quell-IP-Adressen, innerhalb des unten eingestellten Zählfensters auftreten müssen, bevor weitere Versuche für diesen Benutzernamen zusätzlich verzögert werden."
COM_BFSTOP_SETTINGS_ACCOUNT_CHECK_INTERVAL_LABEL="Zählfenster (Minuten)"
COM_BFSTOP_SETTINGS_ACCOUNT_CHECK_INTERVAL_DESC="Das Zeitfenster (in Minuten), innerhalb dessen fehlgeschlagene Versuche für denselben Benutzernamen gezählt werden, unabhängig von der Quell-IP-Adresse."
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_DELAY_LABEL="Zusätzliche Verzögerung (Sekunden)"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_DELAY_DESC="Wie viele Sekunden zusätzliche Verzögerung jedem weiteren fehlgeschlagenen Login eines gedrosselten Benutzernamens hinzugefügt werden, zusätzlich zu einer bereits eingestellten Verzögerung."
COM_BFSTOP_SETTINGS_GEOIP_FIELDSET_LABEL="GeoIP-Datenbank"
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_LABEL="Pfad der GeoIP-Datenbank"
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_DESC="Vollständiger Pfad im Dateisystem des Servers zu einer MaxMind-GeoLite2-Datenbank (oder GeoIP2-Datenbank) im .mmdb-Format, z.B. GeoLite2-City.mmdb. Lade deine eigene Kopie bei MaxMind herunter (ein kostenloses Konto ist erforderlich) - BFStop enthält und verbreitet diese Daten nicht. Damit die Admin-Ansicht „Informationen zur IP-Adresse“ Region, Stadt und Koordinaten anzeigt, ist eine Datenbank der Stufe City nötig; für das unten beschriebene Signal der adaptiven Risikobewertung genügt eine Datenbank der Stufe Country. Leer lassen, um beides zu deaktivieren. Die Abfrage erfolgt vollständig lokal; es wird nie eine IP-Adresse an Dritte gesendet."
COM_BFSTOP_SETTINGS_RISK_FIELDSET_LABEL="Adaptive Risikobewertung"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_ENABLED_LABEL="Vertrauenssignal „bekannte IP“ aktivieren"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_ENABLED_DESC="Wenn aktiviert, wird ein fehlgeschlagener Login als weniger riskant eingestuft (mehr Versuche erlaubt), wenn sich dieselbe IP-Adresse zuvor erfolgreich mit genau diesem Benutzernamen angemeldet hat. Gilt für das Paar (IP, Benutzername) und nicht nur für die IP, sodass ein Login als ein Benutzer die Risikobewertung von Versuchen gegen einen anderen Benutzernamen von derselben IP nicht senken kann."
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_POINTS_LABEL="Vertrauenspunkte „bekannte IP“"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_POINTS_DESC="Wie viele Risikopunkte abgezogen werden (d.h. wie viel mehr dem Versuch vertraut wird), wenn das Signal „bekannte IP“ zutrifft."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_ENABLED_LABEL="Signal „häufiger Benutzername“ aktivieren"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_ENABLED_DESC="Wenn aktiviert, wird ein fehlgeschlagener Login als riskanter eingestuft (weniger Versuche erlaubt), wenn der verwendete Benutzername einem der unten aufgeführten häufigen bzw. wertvollen Benutzernamen entspricht."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_LIST_LABEL="Häufige Benutzernamen"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_LIST_DESC="Ein Benutzername pro Zeile (Groß-/Kleinschreibung wird nicht beachtet). Versuche gegen einen dieser Benutzernamen gelten als riskanter."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_POINTS_LABEL="Punkte „häufiger Benutzername“"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_POINTS_DESC="Wie viele Risikopunkte hinzugefügt werden, wenn der verwendete Benutzername in der Liste der häufigen Benutzernamen steht."
COM_BFSTOP_SETTINGS_RISK_USERAGENT_ENABLED_LABEL="Signal „fehlender User-Agent“ aktivieren"
COM_BFSTOP_SETTINGS_RISK_USERAGENT_ENABLED_DESC="Wenn aktiviert, wird ein fehlgeschlagener Login ohne (oder mit leerem) User-Agent-Header des Browsers als riskanter eingestuft - echte Browser senden immer einen, aber viele einfache automatisierte Login-Skripte setzen ihn nicht."
COM_BFSTOP_SETTINGS_RISK_USERAGENT_POINTS_LABEL="Punkte „fehlender User-Agent“"
COM_BFSTOP_SETTINGS_RISK_USERAGENT_POINTS_DESC="Wie viele Risikopunkte hinzugefügt werden, wenn die Anfrage keinen User-Agent-Header hat."
COM_BFSTOP_SETTINGS_RISK_GEO_ENABLED_LABEL="GeoIP-Signal aktivieren"
COM_BFSTOP_SETTINGS_RISK_GEO_ENABLED_DESC="Wenn aktiviert, wird ein fehlgeschlagener Login als riskanter eingestuft, wenn das Land der angreifenden IP (nachgeschlagen in der oben eingestellten GeoIP-Datenbank) nicht zu den konfigurierten Heimatländern gehört. Erfordert, dass der Pfad der GeoIP-Datenbank eingestellt ist; andernfalls ohne Wirkung."
COM_BFSTOP_SETTINGS_RISK_GEO_HOME_COUNTRIES_LABEL="Heimatländer"
COM_BFSTOP_SETTINGS_RISK_GEO_HOME_COUNTRIES_DESC="Durch Kommas getrennte Liste von Ländercodes nach ISO 3166-1 alpha-2 (z.B. „AT,DE,CH“), die als erwartete bzw. typische Region deiner Website gelten. Ein Versuch aus einem anderen Land fügt Risikopunkte hinzu."
COM_BFSTOP_SETTINGS_RISK_GEO_POINTS_LABEL="Geo-Punkte"
COM_BFSTOP_SETTINGS_RISK_GEO_POINTS_DESC="Wie viele Risikopunkte hinzugefügt werden, wenn das Land der angreifenden IP nicht in der Liste der Heimatländer steht."
COM_BFSTOP_SETTINGS_RISK_RDNS_ENABLED_LABEL="Reverse-DNS-Signal aktivieren"
COM_BFSTOP_SETTINGS_RISK_RDNS_ENABLED_DESC="Wenn aktiviert, wird ein fehlgeschlagener Login von einer IP-Adresse ohne Reverse-DNS-Eintrag (PTR) als riskanter eingestuft. Achtung: Dies führt eine echte DNS-Abfrage durch, die langsam sein oder gelegentlich in ein Timeout laufen kann - die Ergebnisse werden pro IP eine Woche zwischengespeichert, um das zu begrenzen; lass die Option aber deaktiviert, wenn du den Kompromiss bei der Latenz nicht einschätzen kannst."
COM_BFSTOP_SETTINGS_RISK_RDNS_POINTS_LABEL="Reverse-DNS-Punkte"
COM_BFSTOP_SETTINGS_RISK_RDNS_POINTS_DESC="Wie viele Risikopunkte hinzugefügt werden, wenn die angreifende IP keinen Reverse-DNS-Eintrag (PTR) hat."
COM_BFSTOP_SETTINGS_PROGRESSIVE_BLOCK_DURATION_LABEL="Zunehmende Sperrdauer"
COM_BFSTOP_SETTINGS_PROGRESSIVE_BLOCK_DURATION_DESC="Wenn aktiviert, wird die Sperrdauer jedes Mal, wenn dieselbe IP-Adresse erneut gesperrt wird, gegenüber der vorherigen Sperre verdoppelt (bis zum 64-Fachen), statt immer dieselbe feste Dauer zu verwenden. Nach oben bleibt sie durch den unten eingestellten Übergang zur dauerhaften Sperre begrenzt."
COM_BFSTOP_SETTINGS_BLOCK_MODE_LABEL="Sperrmodus"
COM_BFSTOP_SETTINGS_BLOCK_MODE_DESC="Was passiert, sobald eine IP-Adresse gesperrt wird. „Nur Berichten“ schränkt nie etwas ein - fehlgeschlagene Versuche werden weiterhin protokolliert, aber es wird keine IP gesperrt; nutze dies, um die Aktivität zu beobachten, bevor du etwas durchsetzt. „Nur Login“ lässt die IP die Website weiter normal nutzen (auch das Login-Formular ansehen) und weist nur den Login-Versuch selbst ab - das entspricht eher dem üblichen Verhalten einer Begrenzung von Login-Versuchen und stört legitime Benutzer weniger, die sich nur beim Passwort vertippt haben. „Ganze Website“ weist jede Anfrage von der gesperrten IP-Adresse ab und zeigt die unten eingestellte Meldung. „Ganze Website + .htaccess“ tut dasselbe und trägt die IP zusätzlich in die .htaccess ein, sodass der Webserver selbst sie abweist, bevor Joomla (und dieses Plugin) die Anfrage überhaupt sieht - dadurch kann eine so gesperrte IP aber auch nicht auf den Login beschränkt werden, weshalb dieser Modus nicht zusammen mit „Nur Login“ angeboten wird. Gilt für jede Sperre, egal ob automatisch erstellt oder manuell in der Sperrliste hinzugefügt."
COM_BFSTOP_SETTINGS_BLOCK_MODE_OFF="Nur Berichten"
COM_BFSTOP_SETTINGS_BLOCK_MODE_LOGINONLY="Nur Login"
COM_BFSTOP_SETTINGS_BLOCK_MODE_FULL="Ganze Website"
COM_BFSTOP_SETTINGS_BLOCK_MODE_HTACCESS="Ganze Website + .htaccess"
COM_BFSTOP_SETTINGS_RISK_DELAY_PER_POINT_LABEL="Verzögerung in Sekunden pro Risikopunkt"
COM_BFSTOP_SETTINGS_RISK_DELAY_PER_POINT_DESC="Wie viele Sekunden zusätzliche Verzögerung pro positivem (riskantem) Punkt der kombinierten Risikobewertung hinzugefügt werden, zusätzlich zur oben eingestellten Verzögerung. Eine negative (vertrauenswürdige) Bewertung senkt die Verzögerung nie unter den oben eingestellten Wert."
COM_BFSTOP_SETTINGS_RISK_BLOCK_REDUCTION_PER_POINT_LABEL="Änderung der Sperrschwelle pro Risikopunkt"
COM_BFSTOP_SETTINGS_RISK_BLOCK_REDUCTION_PER_POINT_DESC="Um wie viel die Zahl der erlaubten Fehlversuche vor der Sperre pro Punkt der kombinierten Risikobewertung verringert (bei positiver/riskanter Bewertung) bzw. erhöht (bei negativer/vertrauenswürdiger Bewertung) wird."
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_LABEL="Minimal erlaubte Versuche"
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_DESC="Eine harte Untergrenze für die risikobereinigte Zahl erlaubter Fehlversuche, damit eine extreme Risikobewertung sie nie auf null (oder darunter) senken und damit faktisch schon beim allerersten Versuch sperren kann."
COM_BFSTOP_FAILEDLOGIN_AUTOPURGE_ENABLED="Fehlgeschlagene Login-Versuche, die älter als %d Wochen sind, werden automatisch gelöscht. Dies kann über die Einstellung 'Löschen alter Einträge' im Reiter 'Advanced' der <a href=\"%s\">Einstellungen</a> geändert werden."
COM_BFSTOP_FAILEDLOGIN_AUTOPURGE_DISABLED="Alte fehlgeschlagene Login-Versuche werden derzeit nicht automatisch gelöscht. Um das zu aktivieren, 'Löschen alter Einträge' im Reiter 'Advanced' der <a href=\"%s\">Einstellungen</a> setzen, oder mit dem Button 'Alte Einträge löschen' manuell aufräumen."
COM_BFSTOP_BLOCKLIST_AUTOPURGE_ENABLED="Abgelaufene Sperren (und ihre Entsperr-Einträge), die vor mehr als %d Wochen geendet haben, werden automatisch gelöscht. Dies kann über die Einstellung 'Löschen alter Einträge' im Reiter 'Advanced' der <a href=\"%s\">Einstellungen</a> geändert werden. Permanente Sperren werden nie automatisch gelöscht."
COM_BFSTOP_BLOCKLIST_AUTOPURGE_DISABLED="Abgelaufene Sperren werden derzeit nicht automatisch gelöscht. Um das zu aktivieren, 'Löschen alter Einträge' im Reiter 'Advanced' der <a href=\"%s\">Einstellungen</a> setzen. Permanente Sperren werden nie automatisch gelöscht."
COM_BFSTOP_FAILEDLOGIN_PURGE_BUTTON="Alte Einträge löschen"
COM_BFSTOP_FAILEDLOGIN_PURGE_TITLE="Alte fehlgeschlagene Login-Versuche löschen"
COM_BFSTOP_FAILEDLOGIN_PURGE_DESC="Alle fehlgeschlagenen Login-Versuche, die älter als die angegebene Anzahl an Tagen sind, werden endgültig gelöscht. Dies kann nicht rückgängig gemacht werden. Sperren sind davon nicht betroffen."
COM_BFSTOP_FAILEDLOGIN_PURGE_AGE_LABEL="Einträge der letzten ... Tage behalten"
COM_BFSTOP_FAILEDLOGIN_PURGE_CONFIRM="Löschen"
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED="%1$d fehlgeschlagene Login-Versuche, älter als %2$d Tage, wurden gelöscht."
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED_0="Es gab keine fehlgeschlagenen Login-Versuche, die älter als %2$d Tage sind."
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED_1="Ein fehlgeschlagener Login-Versuch, älter als %2$d Tage, wurde gelöscht."
COM_BFSTOP_FAILEDLOGIN_PURGE_INVALID_AGE="Bitte eine Anzahl an Tagen von mindestens 1 angeben."
COM_BFSTOP_FAILEDLOGIN_PURGE_FAILED="Löschen der alten fehlgeschlagenen Login-Versuche fehlgeschlagen: %s"
COM_BFSTOP_SUBMENU_USERNAMESTATS="Benutzernamen-Statistik"
COM_BFSTOP_HEADING_USERNAMESTATS="Brute Force Stop: Benutzernamen-Statistik"
COM_BFSTOP_HEADING_RANK="#"
COM_BFSTOP_HEADING_FAILED_ATTEMPTS="Fehlgeschlagene Logins"
COM_BFSTOP_HEADING_FIRST_ATTEMPT="Erster Versuch"
COM_BFSTOP_USERNAMESTATS_INFO="Die bei fehlgeschlagenen Login-Versuchen verwendeten Benutzernamen, und wie oft jeder davon verwendet wurde. Diese Statistik wird unabhängig von den fehlgeschlagenen Login-Versuchen geführt und ist daher nicht betroffen, wenn alte fehlgeschlagene Login-Versuche gelöscht werden; sie beginnt erst mit der Installation von (bzw. dem Update auf) BFStop 2.0.0, ausgehend von den zu diesem Zeitpunkt vorhandenen fehlgeschlagenen Login-Versuchen. Ein Klick auf einen Benutzernamen zeigt die dafür noch gespeicherten fehlgeschlagenen Login-Versuche."
COM_BFSTOP_USERNAMESTATS_AUTOTRIM="Es werden höchstens %d Benutzernamen gespeichert: darüber hinaus werden automatisch (einmal täglich) die Benutzernamen mit den wenigsten Versuchen gelöscht. Dieses Limit kann nicht geändert werden."
COM_BFSTOP_USERNAMESTATS_EXISTING_ACCOUNT="Existierendes Konto"
COM_BFSTOP_USERNAMESTATS_EXISTING_ACCOUNT_DESC="Auf dieser Seite existiert ein Benutzerkonto mit diesem Benutzernamen."
COM_BFSTOP_USERNAMESTATS_PURGE_BUTTON="Veraltete Benutzernamen löschen"
COM_BFSTOP_USERNAMESTATS_PURGE_TITLE="Statistik veralteter Benutzernamen löschen"
COM_BFSTOP_USERNAMESTATS_PURGE_DESC="Die Statistik aller Benutzernamen, die seit mehr als der angegebenen Anzahl an Tagen nicht mehr bei einem fehlgeschlagenen Login verwendet wurden, wird endgültig gelöscht. Dies kann nicht rückgängig gemacht werden. Fehlgeschlagene Login-Versuche und Sperren sind davon nicht betroffen."
COM_BFSTOP_USERNAMESTATS_PURGE_AGE_LABEL="Benutzernamen löschen, die seit mehr als ... Tagen nicht verwendet wurden"
COM_BFSTOP_USERNAMESTATS_PURGE_CONFIRM="Löschen"
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED="Die Statistik von %1$d Benutzernamen, die seit mehr als %2$d Tagen nicht verwendet wurden, wurde gelöscht."
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED_0="Es gab keine Benutzernamen, die seit mehr als %2$d Tagen nicht verwendet wurden."
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED_1="Die Statistik eines Benutzernamens, der seit mehr als %2$d Tagen nicht verwendet wurde, wurde gelöscht."
COM_BFSTOP_USERNAMESTATS_PURGE_INVALID_AGE="Bitte eine Anzahl an Tagen von mindestens 1 angeben."
COM_BFSTOP_USERNAMESTATS_PURGE_FAILED="Löschen der Statistik veralteter Benutzernamen fehlgeschlagen: %s"
COM_BFSTOP_FAILEDLOGIN_FILTERED_BY_USERNAME="Es werden nur fehlgeschlagene Logins für den Benutzernamen '%s' angezeigt."
COM_BFSTOP_FAILEDLOGIN_FILTER_CLEAR="Alle anzeigen"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_LABEL="Benutzernamen ohne passendes Konto"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_DESC="Benutzer tippen oft ihr Passwort in das Benutzernamenfeld. Mit 'Hash' wird der Benutzername eines fehlgeschlagenen Logins nur dann so wie eingegeben gespeichert (angezeigt, protokolliert und per E-Mail gesendet), wenn er zu einem bestehenden Konto gehört oder in der Liste der häufigen Benutzernamen steht; alles andere wird durch einen unlesbaren Wert ersetzt, der für dieselbe Eingabe immer gleich ist, sodass Versuche damit zusammen gezählt werden. 'Wie eingegeben speichern' lässt jeden eingegebenen Benutzernamen lesbar, speichert dann aber auch Passwörter, die ins Benutzernamenfeld getippt wurden."
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_HASH="Hash (empfohlen)"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_PLAIN="Wie eingegeben speichern"
COM_BFSTOP_SETTINGS_EMAIL_INVALID="Keine gültige E-Mail-Adresse: %s"
COM_BFSTOP_SETTINGS_HTACCESS_PATH_INVALID="Der .htaccess-Pfad muss ein existierendes Verzeichnis im Dateisystem des Servers sein."
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_INVALID="Der Pfad der GeoIP-Datenbank muss der Name einer MaxMind-Datenbankdatei (Endung .mmdb) im Dateisystem des Servers sein."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_LABEL="Genauigkeit bei IPv6"
COM_BFSTOP_SETTINGS_IPV6_PREFIX_DESC="Ein Client mit IPv6-Adresse kontrolliert meist ein ganzes Netz und kann nach Belieben zu einer anderen Adresse darin wechseln. Fehlgeschlagene Logins und Sperren von IPv6-Clients werden deshalb pro Netz dieser Größe statt pro Adresse erfasst. /64 ist die Größe eines üblichen Heim- oder Mobilfunkanschlusses. Wähle eine einzelne Adresse nur, wenn du weißt, dass Clients deiner Seite sich ihr /64 mit anderen teilen, die nicht mitgesperrt werden sollen."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_64="/64 (empfohlen)"
COM_BFSTOP_SETTINGS_IPV6_PREFIX_128="Einzelne Adresse (/128)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_LABEL="Größenlimit der Logdatei (MB)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_DESC="Wird die Logdatei größer, wird sie in eine zweite Datei verschoben (plg_system_bfstop.1.log.php im Log-Verzeichnis), die die vorherige ersetzt. Die Logdateien zusammen belegen also nie viel mehr als das Doppelte dieser Größe."
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_LABEL="Logeinträge behalten (Tage)"
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_DESC="Logeinträge, die älter als diese Anzahl an Tagen sind, werden automatisch gelöscht (einmal täglich, auch wenn das Logging inzwischen deaktiviert wurde). Bei 0 werden Einträge behalten, bis das Größenlimit erreicht ist."
COM_BFSTOP_LOG_AUTOPRUNE_ENABLED="Logeinträge, die älter als %1$d Tage sind, werden automatisch gelöscht, und die Logdatei wird rotiert, sobald sie %2$d MB überschreitet. Dies kann im Tab 'Erweitert' der <a href=\"%3$s\">Einstellungen</a> geändert werden."
COM_BFSTOP_LOG_AUTOPRUNE_DISABLED="Alte Logeinträge werden derzeit nicht nach Alter gelöscht, sondern nur wenn die Logdatei rotiert wird, sobald sie %1$d MB überschreitet. Um das zu ändern, 'Logeinträge behalten' in den <a href=\"%2$s\">Einstellungen</a> setzen, oder die Buttons 'Log bereinigen' und 'Log leeren' verwenden."
COM_BFSTOP_LOG_PRUNE_BUTTON="Log bereinigen"
COM_BFSTOP_LOG_PRUNE_DISABLED="Zum Bereinigen ist eine Aufbewahrungsdauer nötig: 'Logeinträge behalten' in den <a href=\"%s\">Einstellungen</a> setzen, oder stattdessen das Log leeren."
COM_BFSTOP_LOG_PRUNE_N_DELETED="%1$d Logeinträge, die älter als %2$d Tage waren, wurden gelöscht."
COM_BFSTOP_LOG_PRUNE_N_DELETED_0="Es gab keine Logeinträge, die älter als %2$d Tage waren."
COM_BFSTOP_LOG_PRUNE_N_DELETED_1="Ein Logeintrag, der älter als %2$d Tage war, wurde gelöscht."
COM_BFSTOP_LOG_CLEAR_BUTTON="Log leeren"
COM_BFSTOP_LOG_CLEAR_TITLE="Log leeren"
COM_BFSTOP_LOG_CLEAR_DESC="Alle Logeinträge werden unwiderruflich gelöscht, auch die der vorherigen Logdatei. Sperren und fehlgeschlagene Anmeldungen sind nicht betroffen."
COM_BFSTOP_LOG_CLEAR_CONFIRM="Leeren"
COM_BFSTOP_LOG_CLEARED="Das Log wurde geleert."
