COM_BFSTOP_WARNING_PLUGIN_NOT_INSTALLED="Das BFStop Plugin ist nicht installiert! Bitte installieren Sie die neuste Version des BFStop Pakets von <a href='https://bfstop.bfroehler.info'>der BFStop Seite</a> oder dem <a href='https://extensions.joomla.org/'>Joomla Extensions Directory</a>!"
COM_BFSTOP_WARNING_CANNOT_RETRIEVE_COMPONENT_CACHE="Kann den manifest cache der BFStop-Komponente nicht laden; es scheint etwas schiefzulaufen in Ihrer Joomla! Installation. Bitte installieren Sie die neuste Version des BFStop Pakets von <a href='https://bfstop.bfroehler.info'>der BFStop Seite</a> oder dem <a href='https://extensions.joomla.org/'>Joomla Extensions Directory</a>!"
COM_BFSTOP_WARNING_COMPONENT_PLUGIN_DIFFERENT_VERSION="Es sind unterschiedliche Versionen von BFStop Plugin und Komponente installiert! Bitte installieren Sie die neuste Version des BFStop Pakets von <a href='https://bfstop.bfroehler.info'>der BFStop Seite</a> oder dem <a href='https://extensions.joomla.org/'>Joomla Extensions Directory</a>!"
COM_BFSTOP_WARNING_PLUGIN_DISABLED="Das BFStop Plugin ist nicht aktiviert! Bitte gehe zur <a href=\"%s\">Plugin-Übersicht</a>, suche nach 'Brute Force Stop' und aktiviere das Plugin 'System - Brute Force Stop' - es muss laufen, damit die Blockierung wirksam wird. Alle BFStop-Einstellungen werden hier in dieser Komponente konfiguriert, nicht mehr im Plugin selbst."
COM_BFSTOP_WARNING_PROXY_NOT_CONFIGURED="Bei dieser Anfrage wurde ein Proxy-/Load-Balancer-Header (z.B. X-Forwarded-For) erkannt, aber 'Hinter einem Proxy / Load Balancer' ist in den <a href=\"%s\">Komponenten-Einstellungen</a> nicht aktiviert. Ohne diese Einstellung vertraut BFStop nur der direkten Verbindungsadresse, wodurch die IP-basierte Blockierung hinter deinem Proxy möglicherweise nicht korrekt funktioniert. Falls deine Website tatsächlich hinter einem Reverse-Proxy oder Load Balancer betrieben wird, gehe zur Settings-Ansicht der Komponente und aktiviere und konfiguriere dort die Optionen 'Proxy / Load Balancer' - andernfalls könnte ein Besucher diesen Header fälschen, um eine beliebige IP-Adresse blockieren zu lassen."
