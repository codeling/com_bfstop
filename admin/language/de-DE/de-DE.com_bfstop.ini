COM_BFSTOP_DESC_BLOCK_IPADDRESS="Die IP-Adresse (oder das Subnetz), die gesperrt werden soll. Ein Subnetz muss in der CIDR-Suffix-Notation angegeben werden, d.h. in der Form <Subnetz-Adresse>/<Bitzahl>, z.B. 192.168.0.0/24."
COM_BFSTOP_DESC_BLOCK_CRDATE="Der Beginn der Sperre"
COM_BFSTOP_DESC_ALLOWLIST_IPADDRESS="Die IP-Adresse (oder das Subnetz), der der Zugriff auf die Seite immer erlaubt werden soll (dies deaktiviert jegliche Überprüfung oder Sperre durch das Plugin). Ein Subnetz muss in der CIDR-Suffix-Notation angegeben werden, d.h. in der Form <Subnetz-Adresse>/<Bitzahl>, z.B. 192.168.0.0/24."
COM_BFSTOP_DESC_ALLOWLIST_NOTES="Hier können beliebige Notizen zum Eintrag eingetragen werden (etwa die Zeit zu der der Eintrag erstellt wurde, oder der Benutzer, für den dieser Eintrag erstellt wurde)."
