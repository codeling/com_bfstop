COM_BFSTOP_YOUR_IP_IS="O seu endereço IP, como o BFStop o vê, é %s."
COM_BFSTOP_INSTALL_HINT="O Brute Force Stop protege o seu site com as definições padrão assim que o plugin é instalado (o pacote o instala e ativa). Revise-as na <a href=\"%s\">vista Definições do componente</a>."
COM_BFSTOP_SETTINGS_ACCOUNT_FIELDSET_LABEL="Limitação no nível da conta"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_ENABLED_LABEL="Ativar a limitação no nível da conta"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_ENABLED_DESC="Se os inícios de sessão falhados também devem ser contados por nome de utilizador, somando todos os endereços IP de origem que os tentaram - e não apenas por endereço IP. Isso detecta um ataque distribuído que espalha as tentativas contra uma única conta por muitos IPs diferentes, o que o limite de bloqueio normal por IP, sozinho, não consegue detectar. A conta em si nunca é bloqueada; apenas as tentativas com falha são atrasadas progressivamente."
COM_BFSTOP_SETTINGS_ACCOUNT_BLOCK_NUMBER_LABEL="Tentativas com falha antes da limitação"
COM_BFSTOP_SETTINGS_ACCOUNT_BLOCK_NUMBER_DESC="Quantos inícios de sessão falhados para o mesmo nome de utilizador, somados em todos os endereços IP de origem, dentro da janela de contagem abaixo, são necessários antes que as tentativas seguintes para esse nome de utilizador recebam um atraso adicional."
COM_BFSTOP_SETTINGS_ACCOUNT_CHECK_INTERVAL_LABEL="Janela de contagem (minutos)"
COM_BFSTOP_SETTINGS_ACCOUNT_CHECK_INTERVAL_DESC="A janela de tempo (em minutos) dentro da qual as tentativas com falha para o mesmo nome de utilizador são contadas, independentemente do endereço IP de origem."
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_DELAY_LABEL="Atraso adicional (segundos)"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_DELAY_DESC="Quantos segundos de atraso adicional somar a cada novo início de sessão falhado de um nome de utilizador limitado, além de qualquer outro atraso já configurado."
COM_BFSTOP_SETTINGS_GEOIP_FIELDSET_LABEL="Base de dados GeoIP"
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_LABEL="Caminho do base de dados GeoIP"
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_DESC="Caminho completo, no sistema de ficheiros do servidor, de um base de dados .mmdb MaxMind GeoLite2 (ou GeoIP2), por exemplo GeoLite2-City.mmdb. Baixe a sua própria cópia na MaxMind (é necessária uma conta gratuita) - o BFStop não inclui nem redistribui esses dados. É preciso um base de dados do nível City para que a vista 'Informações do endereço IP' mostre região, cidade e coordenadas; um banco do nível Country basta para o sinal de pontuação de risco adaptativa abaixo. Deixe vazio para desativar ambos. A consulta é totalmente local; nenhum endereço IP é enviado a terceiros."
COM_BFSTOP_SETTINGS_RISK_FIELDSET_LABEL="Pontuação de risco adaptativa"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_ENABLED_LABEL="Ativar o sinal de confiança de IP conhecido"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_ENABLED_DESC="Se ativado, um início de sessão falhado é tratado como menos arriscado (mais tentativas permitidas) quando o mesmo endereço IP já fez início de sessão com sucesso exatamente com esse nome de utilizador. Vale para o par (IP, nome de utilizador) e não só para o IP, de modo que entrar como um utilizador não pode reduzir a pontuação de risco de tentativas contra outro nome de utilizador a partir do mesmo IP."
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_POINTS_LABEL="Pontos de confiança de IP conhecido"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_POINTS_DESC="Quantos pontos de risco subtrair (ou seja, quanto mais confiar na tentativa) quando o sinal de IP conhecido se aplica."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_ENABLED_LABEL="Ativar o sinal de nome de utilizador comum"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_ENABLED_DESC="Se ativado, um início de sessão falhado é tratado como mais arriscado (menos tentativas permitidas) quando o nome de utilizador usado corresponde a um dos nomes comuns ou de alto valor listados abaixo."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_LIST_LABEL="Nomes de utilizador comuns"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_LIST_DESC="Um nome de utilizador por linha (sem diferenciar maiúsculas de minúsculas). Tentativas contra qualquer um desses nomes são tratadas como mais arriscadas."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_POINTS_LABEL="Pontos de nome de utilizador comum"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_POINTS_DESC="Quantos pontos de risco somar quando o nome de utilizador usado corresponde à lista de nomes comuns."
COM_BFSTOP_SETTINGS_RISK_USERAGENT_ENABLED_LABEL="Ativar o sinal de User-Agent ausente"
COM_BFSTOP_SETTINGS_RISK_USERAGENT_ENABLED_DESC="Se ativado, um início de sessão falhado sem cabeçalho User-Agent do navegador (ou com ele vazio) é tratado como mais arriscado - navegadores reais sempre enviam um, mas muitos scripts de início de sessão automatizados simples não se dão ao trabalho de defini-lo."
COM_BFSTOP_SETTINGS_RISK_USERAGENT_POINTS_LABEL="Pontos de User-Agent ausente"
COM_BFSTOP_SETTINGS_RISK_USERAGENT_POINTS_DESC="Quantos pontos de risco somar quando a pedido não tem cabeçalho User-Agent."
COM_BFSTOP_SETTINGS_RISK_GEO_ENABLED_LABEL="Ativar o sinal GeoIP"
COM_BFSTOP_SETTINGS_RISK_GEO_ENABLED_DESC="Se ativado, um início de sessão falhado é tratado como mais arriscado quando o país do IP atacante (consultado no base de dados GeoIP configurado acima) não é um dos países de origem configurados. Requer que o caminho do base de dados GeoIP esteja configurado; caso contrário, não faz nada."
COM_BFSTOP_SETTINGS_RISK_GEO_HOME_COUNTRIES_LABEL="Países de origem"
COM_BFSTOP_SETTINGS_RISK_GEO_HOME_COUNTRIES_DESC="Lista separada por vírgulas de códigos de país ISO 3166-1 alfa-2 (por exemplo 'AT,DE,CH') considerados a região esperada ou típica do seu site. Uma tentativa vinda de qualquer outro país soma pontos de risco."
COM_BFSTOP_SETTINGS_RISK_GEO_POINTS_LABEL="Pontos geográficos"
COM_BFSTOP_SETTINGS_RISK_GEO_POINTS_DESC="Quantos pontos de risco somar quando o país do IP atacante não está na lista de países de origem."
COM_BFSTOP_SETTINGS_RISK_RDNS_ENABLED_LABEL="Ativar o sinal de DNS reverso"
COM_BFSTOP_SETTINGS_RISK_RDNS_ENABLED_DESC="Se ativado, um início de sessão falhado vindo de um endereço IP sem registo de DNS reverso (PTR) é tratado como mais arriscado. Atenção: isso faz uma consulta DNS real, que pode ser lenta ou ocasionalmente expirar - os resultados ficam em cache por uma semana por IP para limitar a frequência, mas deixe desativado a menos que o utilizador entenda a troca em relação à latência."
COM_BFSTOP_SETTINGS_RISK_RDNS_POINTS_LABEL="Pontos de DNS reverso"
COM_BFSTOP_SETTINGS_RISK_RDNS_POINTS_DESC="Quantos pontos de risco somar quando o IP atacante não tem registo de DNS reverso (PTR)."
COM_BFSTOP_SETTINGS_PROGRESSIVE_BLOCK_DURATION_LABEL="Duração progressiva do bloqueio"
COM_BFSTOP_SETTINGS_PROGRESSIVE_BLOCK_DURATION_DESC="Se ativado, a cada vez que o mesmo endereço IP é bloqueado novamente, a duração do bloqueio é dobrada em relação ao bloqueio anterior (até o limite de 64 vezes), em vez de sempre usar a mesma duração fixa. Continua limitada pela passagem para o bloqueio permanente configurada abaixo."
COM_BFSTOP_SETTINGS_BLOCK_MODE_LABEL="Modo de bloqueio"
COM_BFSTOP_SETTINGS_BLOCK_MODE_DESC="O que acontece depois que um endereço IP é bloqueado. 'Somente relatório' nunca restringe nada - as tentativas com falha continuam a ser registadas, mas nenhum IP é bloqueado, então use-o para observar a atividade antes de aplicar qualquer coisa. 'Somente início de sessão' deixa o IP continuar navegando normalmente pelo site (inclusive vendo o formulário de início de sessão) e recusa apenas a tentativa de início de sessão em si - mais próximo do comportamento típico de um limitador de tentativas de início de sessão e menos incômodo para um utilizador legítimo que apenas errou a palavra-passe. 'Site inteiro' recusa todas as pedidos do endereço IP bloqueado e mostra a mensagem configurada abaixo. 'Site inteiro + .htaccess' faz o mesmo e, além disso, acrescenta o IP ao .htaccess para que o próprio servidor web o recuse antes que o Joomla (e este plugin) chegue a ver a pedido - isso também significa que um IP bloqueado assim não pode ser restrito apenas ao início de sessão, por isso não é oferecido junto com 'Somente início de sessão'. Vale para todos os bloqueios, sejam criados automaticamente ou adicionados manualmente na lista de bloqueios."
COM_BFSTOP_SETTINGS_BLOCK_MODE_OFF="Somente relatório"
COM_BFSTOP_SETTINGS_BLOCK_MODE_LOGINONLY="Somente início de sessão"
COM_BFSTOP_SETTINGS_BLOCK_MODE_FULL="Site inteiro"
COM_BFSTOP_SETTINGS_BLOCK_MODE_HTACCESS="Site inteiro + .htaccess"
COM_BFSTOP_SETTINGS_RISK_DELAY_PER_POINT_LABEL="Segundos de atraso por ponto de risco"
COM_BFSTOP_SETTINGS_RISK_DELAY_PER_POINT_DESC="Quantos segundos de atraso adicional somar por ponto positivo (arriscado) da pontuação de risco combinada, além do atraso configurado acima. Uma pontuação negativa (de confiança) nunca reduz o atraso abaixo do configurado acima."
COM_BFSTOP_SETTINGS_RISK_BLOCK_REDUCTION_PER_POINT_LABEL="Alteração do limite de bloqueio por ponto de risco"
COM_BFSTOP_SETTINGS_RISK_BLOCK_REDUCTION_PER_POINT_DESC="Quanto reduzir (para uma pontuação positiva/arriscada) ou aumentar (para uma pontuação negativa/de confiança) o número de tentativas com falha permitidas antes do bloqueio, por ponto da pontuação de risco combinada."
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_LABEL="Mínimo de tentativas permitidas"
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_DESC="Um piso rígido para o número de tentativas com falha permitidas ajustado pelo risco, para que uma pontuação de risco extrema nunca possa reduzi-lo a zero (ou menos) e, na prática, bloquear já na primeira tentativa."
COM_BFSTOP_FAILEDLOGIN_AUTOPURGE_ENABLED="Entradas de inícios de sessão falhados com mais de %d semanas são eliminadas automaticamente. O utilizador pode alterar isso na configuração 'Limpar tentativas antigas', na aba 'Avançado' das <a href=\"%s\">Definições</a>."
COM_BFSTOP_FAILEDLOGIN_AUTOPURGE_DISABLED="Entradas antigas de inícios de sessão falhados não são eliminadas automaticamente de momento. Para ativar, defina 'Limpar tentativas antigas' na aba 'Avançado' das <a href=\"%s\">Definições</a>, ou use o botão 'Eliminar entradas antigas' para limpá-las manualmente."
COM_BFSTOP_BLOCKLIST_AUTOPURGE_ENABLED="Bloqueios expirados (e seus registros de desbloqueio) encerrados há mais de %d semanas são eliminados automaticamente. O utilizador pode alterar isso na configuração 'Limpar tentativas antigas', na aba 'Avançado' das <a href=\"%s\">Definições</a>. Bloqueios permanentes nunca são eliminados automaticamente."
COM_BFSTOP_BLOCKLIST_AUTOPURGE_DISABLED="Bloqueios expirados não são eliminados automaticamente de momento. Para ativar, defina 'Limpar tentativas antigas' na aba 'Avançado' das <a href=\"%s\">Definições</a>. Bloqueios permanentes nunca são eliminados automaticamente."
COM_BFSTOP_FAILEDLOGIN_PURGE_BUTTON="Eliminar entradas antigas"
COM_BFSTOP_FAILEDLOGIN_PURGE_TITLE="Eliminar entradas antigas de inícios de sessão falhados"
COM_BFSTOP_FAILEDLOGIN_PURGE_DESC="Todas as entradas de inícios de sessão falhados mais antigas que o número de dias indicado serão eliminadas permanentemente. Isso não pode ser desfeito. Os bloqueios não são afetados."
COM_BFSTOP_FAILEDLOGIN_PURGE_AGE_LABEL="Manter as entradas dos últimos ... dias"
COM_BFSTOP_FAILEDLOGIN_PURGE_CONFIRM="Eliminar"
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED="%1$d entradas de inícios de sessão falhados com mais de %2$d dias foram eliminadas."
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED_0="Não havia entradas de inícios de sessão falhados com mais de %2$d dias."
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED_1="Uma entrada de início de sessão falhado com mais de %2$d dias foi eliminada."
COM_BFSTOP_FAILEDLOGIN_PURGE_INVALID_AGE="Indique um número de dias igual ou maior que 1."
COM_BFSTOP_FAILEDLOGIN_PURGE_FAILED="Falha ao eliminar as entradas antigas de inícios de sessão falhados: %s"
COM_BFSTOP_SUBMENU_USERNAMESTATS="Estatísticas de nomes de utilizador"
COM_BFSTOP_HEADING_USERNAMESTATS="Brute Force Stop: Estatísticas de nomes de utilizador"
COM_BFSTOP_HEADING_RANK="#"
COM_BFSTOP_HEADING_FAILED_ATTEMPTS="Inícios de sessão falhados"
COM_BFSTOP_HEADING_FIRST_ATTEMPT="Primeira tentativa"
COM_BFSTOP_USERNAMESTATS_INFO="Os nomes de utilizador usados em tentativas de início de sessão falhadas e quantas vezes cada um foi usado. Essas estatísticas são mantidas independentemente das entradas de inícios de sessão falhados, portanto não são afetadas quando entradas antigas são eliminadas; elas só começam com a instalação do (ou a atualização para o) BFStop 2.0.0, a partir das entradas de inícios de sessão falhados que existiam naquele momento. Clique em um nome de utilizador para ver as entradas de inícios de sessão falhados dele que ainda estão armazenadas."
COM_BFSTOP_USERNAMESTATS_AUTOTRIM="No máximo %d nomes de utilizador são mantidos: acima disso, os nomes com menos tentativas são eliminados automaticamente (uma vez por dia). Esse limite não pode ser alterado."
COM_BFSTOP_USERNAMESTATS_EXISTING_ACCOUNT="Conta existente"
COM_BFSTOP_USERNAMESTATS_EXISTING_ACCOUNT_DESC="Existe neste site uma conta de utilizador com esse nome de utilizador."
COM_BFSTOP_USERNAMESTATS_PURGE_BUTTON="Eliminar nomes de utilizador obsoletos"
COM_BFSTOP_USERNAMESTATS_PURGE_TITLE="Eliminar estatísticas de nomes de utilizador obsoletos"
COM_BFSTOP_USERNAMESTATS_PURGE_DESC="As estatísticas de todos os nomes de utilizador que não foram usados em um início de sessão falhado há mais do número de dias indicado serão eliminadas permanentemente. Isso não pode ser desfeito. As entradas de inícios de sessão falhados e os bloqueios não são afetados."
COM_BFSTOP_USERNAMESTATS_PURGE_AGE_LABEL="Eliminar nomes de utilizador não vistos há mais de ... dias"
COM_BFSTOP_USERNAMESTATS_PURGE_CONFIRM="Eliminar"
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED="As estatísticas de %1$d nomes de utilizador não vistos há mais de %2$d dias foram eliminadas."
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED_0="Não havia nomes de utilizador não vistos há mais de %2$d dias."
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED_1="As estatísticas de um nome de utilizador não visto há mais de %2$d dias foram eliminadas."
COM_BFSTOP_USERNAMESTATS_PURGE_INVALID_AGE="Indique um número de dias igual ou maior que 1."
COM_BFSTOP_USERNAMESTATS_PURGE_FAILED="Falha ao eliminar as estatísticas de nomes de utilizador obsoletos: %s"
COM_BFSTOP_FAILEDLOGIN_FILTERED_BY_USERNAME="Mostrando apenas os inícios de sessão falhados do nome de utilizador '%s'."
COM_BFSTOP_FAILEDLOGIN_FILTER_CLEAR="Mostrar todos"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_LABEL="Nomes de utilizador que não correspondem a uma conta"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_DESC="Os utilizadores costumam introduzir a palavra-passe no campo de nome de utilizador. Com 'Hash', o nome de utilizador de um início de sessão falhado só é armazenado (e exibido, registado em registo e enviado por e-mail) como foi introduzido se pertencer a uma conta existente ou estiver na lista de nomes de utilizador comuns; qualquer outro é substituído por um valor ilegível, que continua sendo o mesmo para a mesma entrada, de modo que as tentativas com ele são contadas juntas. 'Armazenar como introduzido' mantém legível todo nome de utilizador indicado, mas então também armazena palavras-passe introduzidas no campo de nome de utilizador."
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_HASH="Hash (recomendado)"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_PLAIN="Armazenar como introduzido"
COM_BFSTOP_SETTINGS_EMAIL_INVALID="Não é um endereço de e-mail válido: %s"
COM_BFSTOP_SETTINGS_HTACCESS_PATH_INVALID="O caminho do .htaccess precisa ser um diretório existente no sistema de ficheiros do servidor."
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_INVALID="O caminho do base de dados GeoIP precisa ser o nome de um ficheiro de base de dados MaxMind (terminado em .mmdb) no sistema de ficheiros do servidor."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_LABEL="Granularidade do rastreamento de IPv6"
COM_BFSTOP_SETTINGS_IPV6_PREFIX_DESC="Um cliente com endereço IPv6 normalmente controla uma rede inteira e pode passar para outro endereço dela quando quiser. Por isso, inícios de sessão falhados e bloqueios de clientes IPv6 são rastreados por rede desse tamanho, e não por endereço. /64 é o tamanho de uma conexão doméstica ou móvel típica. Escolha um único endereço somente se souber que os clientes do seu site dividem o /64 com outros que o utilizador não quer bloquear junto com eles."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_64="/64 (recomendado)"
COM_BFSTOP_SETTINGS_IPV6_PREFIX_128="Endereço único (/128)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_LABEL="Limite de tamanho do ficheiro de registo (MB)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_DESC="Quando o ficheiro de registo fica maior que isto, ele é movido para um segundo ficheiro (plg_system_bfstop.1.log.php no diretório de registos), substituindo o anterior. Assim, os ficheiros de registo juntos nunca ocupam muito mais que o dobro deste tamanho."
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_LABEL="Manter entradas do registo (dias)"
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_DESC="Entradas do registo mais antigas que este número de dias são eliminadas automaticamente (uma vez por dia, mesmo que o registo seja desativado nesse meio-tempo). Use 0 para manter as entradas até atingir o limite de tamanho."
COM_BFSTOP_LOG_AUTOPRUNE_ENABLED="Entradas do registo com mais de %1$d dias são eliminadas automaticamente, e o ficheiro de registo é rotacionado quando ultrapassa %2$d MB. O utilizador pode alterar isso na aba 'Avançado' das <a href=\"%3$s\">Definições</a>."
COM_BFSTOP_LOG_AUTOPRUNE_DISABLED="Entradas antigas do registo não são eliminadas por idade de momento, apenas quando o ficheiro de registo é rotacionado ao ultrapassar %1$d MB. Para alterar isso, defina 'Manter entradas do registo' nas <a href=\"%2$s\">Definições</a>, ou use os botões 'Limpar entradas antigas do registo' e 'Esvaziar o registo'."
COM_BFSTOP_LOG_PRUNE_BUTTON="Limpar entradas antigas do registo"
COM_BFSTOP_LOG_PRUNE_DISABLED="A limpeza precisa de um período de retenção: defina 'Manter entradas do registo' nas <a href=\"%s\">Definições</a> ou esvazie o registo."
COM_BFSTOP_LOG_PRUNE_N_DELETED="%1$d entradas do registo com mais de %2$d dias foram eliminadas."
COM_BFSTOP_LOG_PRUNE_N_DELETED_0="Não havia entradas do registo com mais de %2$d dias."
COM_BFSTOP_LOG_PRUNE_N_DELETED_1="Uma entrada do registo com mais de %2$d dias foi eliminada."
COM_BFSTOP_LOG_CLEAR_BUTTON="Esvaziar o registo"
COM_BFSTOP_LOG_CLEAR_TITLE="Esvaziar o registo"
COM_BFSTOP_LOG_CLEAR_DESC="Todas as entradas do registo serão eliminadas permanentemente, inclusive as do ficheiro de registo anterior. Isso não pode ser desfeito. Os bloqueios e as entradas de inícios de sessão falhados não são afetados."
COM_BFSTOP_LOG_CLEAR_CONFIRM="Esvaziar"
COM_BFSTOP_LOG_CLEARED="O registo foi esvaziado."
COM_BFSTOP_SETTINGS_NOTIFY_ANY_NEEDS_LIVE_SITE="As ligações de desbloqueio para qualquer endereço IP só podem ser enviadas se o endereço do site estiver definido ($live_site no configuration.php do site). Defina-o aí, ou escolha enviar as ligações apenas a utilizadores que já iniciaram sessão a partir do endereço bloqueado."
COM_BFSTOP_WARNING_NO_LIVE_SITE="O endereço do site não está definido ($live_site no configuration.php). O Joomla! constrói então as ligações dos e-mails do Brute Force Stop com o anfitrião indicado em cada pedido, que um visitante pode escolher livremente - por isso as ligações de desbloqueio não podem ser enviadas para qualquer endereço IP. Para definir o endereço, acrescente esta linha à classe no configuration.php do site, com o endereço pelo qual o site é acedido (proposto a partir deste pedido, verifique-o): %s"
COM_BFSTOP_WARNING_NOTIFY_ANY_WITHOUT_LIVE_SITE="As ligações de desbloqueio devem ser enviadas para qualquer endereço IP (<a href=\"%s\">definições</a>), mas o endereço do site não está definido ($live_site no configuration.php): só são enviadas a utilizadores que já iniciaram sessão a partir do endereço bloqueado."
