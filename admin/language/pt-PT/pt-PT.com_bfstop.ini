COM_BFSTOP_DESC_BLOCK_IPADDRESS="O endereço IP (ou sub-rede) a ser bloqueado. As sub-redes são especificadas em notação de sufixo CIDR, ou seja, na forma <endereço da sub-rede>/<bits da máscara>, por exemplo '192.168.0.0/24'. Tenha cuidado ao informar uma sub-rede para não bloquear o seu próprio IP!"
COM_BFSTOP_DESC_BLOCK_CRDATE="A data/hora de início do bloqueio"
COM_BFSTOP_DESC_ALLOWLIST_IPADDRESS="O endereço IP (ou sub-rede) para o qual o acesso a este site será sempre permitido (isso desativa todos os bloqueios e verificações feitos pelo plugin). As sub-redes são especificadas em notação de sufixo CIDR, ou seja, na forma <endereço da sub-rede>/<bits da máscara>, por exemplo '192.168.0.0/24'"
COM_BFSTOP_DESC_ALLOWLIST_NOTES="Introduza a nota que quiser para a entrada da lista de permissões, por exemplo o momento em que foi criada ou o utilizador para o qual foi criada."
