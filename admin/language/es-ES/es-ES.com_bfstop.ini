COM_BFSTOP_WARNING_ADMIN_USER_EXISTS="Super-usuario está utilizando el valor predeterminado para el nombre de usuario 'admin'. Este es un riesgo de seguridad, los atacantes saben que este nombre de usuario ya existe en Joomla!-instalación, por lo tanto, se utiliza muy frecuentemente en muchos de los ataques. Para aumentar la seguridad, se recomienda cambiar el nombre de usuario para el superusuario. Ver también: <a href='http://docs.joomla.org/Security_and_Performance_FAQs#Why_should_I_immediately_change_the_name_of_the_default_admin_user_after_a_new_install.3F' target='_blank'>Joomla! Security and Performance FAQ: Why should I immediately change the name of the default admin user after a new install?</a>"
COM_BFSTOP_WARNING_HTACCESS_NOT_WORKING="O bien no está utilizando un servidor Apache, o bien el archivo .htaccess no existe o no se puede leer o escribir. El bloqueo mediante .htaccess no funcionará."
COM_BFSTOP_WARNING_PLUGIN_NOT_INSTALLED="¡El plugin bfstop no está instalado! Instale el último paquete de bfstop desde <a href='https://bfstop.bfroehler.info'>la página de bfstop</a> o desde el <a href='https://extensions.joomla.org/'>Directorio de extensiones de Joomla</a>."
COM_BFSTOP_WARNING_CANNOT_RETRIEVE_COMPONENT_CACHE="No se puede obtener la caché del manifiesto del componente BFStop. Parece que hay algún problema con su instalación de Joomla!. Instale el último paquete de bfstop desde <a href='https://bfstop.bfroehler.info'>la página de bfstop</a> o desde el <a href='https://extensions.joomla.org/'>Directorio de extensiones de Joomla</a>."
COM_BFSTOP_WARNING_COMPONENT_PLUGIN_DIFFERENT_VERSION="Parece que el plugin y el componente de BFStop están instalados en versiones diferentes. Instale el último paquete de bfstop desde <a href='https://bfstop.bfroehler.info'>la página de bfstop</a> o desde el <a href='https://extensions.joomla.org/'>Directorio de extensiones de Joomla</a>."
COM_BFSTOP_WARNING_PLUGIN_DISABLED="¡El plugin BFStop no está activado! Vaya a la <a href=\"%s\">vista general de plugins</a>, busque «Brute Force Stop» y active el plugin «System - Brute Force Stop»: debe estar en funcionamiento para que el bloqueo surta efecto. Todos los ajustes de BFStop se configuran aquí, en este componente, y no en el propio plugin."
COM_BFSTOP_WARNING_PROXY_NOT_CONFIGURED="Se ha detectado en esta solicitud una cabecera de proxy / balanceador de carga (por ejemplo, X-Forwarded-For), pero «Detrás de un proxy / balanceador de carga» no está activado en los <a href=\"%s\">ajustes del componente</a>. Sin esta configuración, BFStop solo confía en la dirección de la conexión directa, por lo que el bloqueo basado en IP puede no funcionar correctamente detrás de su proxy. Si su sitio sí está detrás de un proxy inverso o de un balanceador de carga, vaya a la vista Ajustes del componente y active y configure las opciones de «Proxy / Balanceador de carga»; de lo contrario, un visitante podría falsificar esta cabecera para hacer que se bloquee una dirección IP arbitraria."
