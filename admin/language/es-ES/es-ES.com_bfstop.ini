COM_BFSTOP_YOUR_IP_IS="Su dirección IP, tal como la ve BFStop, es %s."
COM_BFSTOP_INSTALL_HINT="Brute Force Stop protege su sitio con la configuración predeterminada en cuanto se instala su plugin (el paquete lo instala y lo activa). Revise la configuración en la <a href=\"%s\">vista de configuración del componente</a>."
COM_BFSTOP_SETTINGS_ACCOUNT_FIELDSET_LABEL="Limitación a nivel de cuenta"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_ENABLED_LABEL="Activar la limitación a nivel de cuenta"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_ENABLED_DESC="Si, además, se deben contar los inicios de sesión fallidos por nombre de usuario, sumando todas las direcciones IP de origen que los intentaron, y no solo por dirección IP. Así se detecta un ataque distribuido que reparte los intentos contra una misma cuenta entre muchas IP distintas, algo que el umbral de bloqueo habitual por IP no puede detectar por sí solo. La cuenta en sí nunca se bloquea; solo se retrasan progresivamente los intentos fallidos."
COM_BFSTOP_SETTINGS_ACCOUNT_BLOCK_NUMBER_LABEL="Intentos fallidos antes de limitar"
COM_BFSTOP_SETTINGS_ACCOUNT_BLOCK_NUMBER_DESC="Cuántos inicios de sesión fallidos con el mismo nombre de usuario, sumando todas las direcciones IP de origen, dentro de la ventana de recuento indicada abajo, hacen falta para que los siguientes intentos con ese nombre de usuario reciban un retardo adicional."
COM_BFSTOP_SETTINGS_ACCOUNT_CHECK_INTERVAL_LABEL="Ventana de recuento (minutos)"
COM_BFSTOP_SETTINGS_ACCOUNT_CHECK_INTERVAL_DESC="La ventana de tiempo (en minutos) dentro de la cual se cuentan los intentos fallidos con el mismo nombre de usuario, independientemente de la dirección IP de origen."
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_DELAY_LABEL="Retardo adicional (segundos)"
COM_BFSTOP_SETTINGS_ACCOUNT_THROTTLE_DELAY_DESC="Cuántos segundos de retardo adicional se añaden a cada nuevo inicio de sesión fallido de un nombre de usuario limitado, además de cualquier otro retardo ya configurado."
COM_BFSTOP_SETTINGS_GEOIP_FIELDSET_LABEL="Base de datos GeoIP"
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_LABEL="Ruta de la base de datos GeoIP"
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_DESC="Ruta completa en el sistema de archivos del servidor de una base de datos .mmdb de MaxMind GeoLite2 (o GeoIP2), por ejemplo GeoLite2-City.mmdb. Descargue su propia copia de MaxMind (se necesita una cuenta gratuita): BFStop no incluye ni redistribuye estos datos. Se necesita una base de datos del nivel City para que la vista «Información de la dirección IP» muestre región, ciudad y coordenadas; para la señal de puntuación de riesgo adaptativa indicada más abajo basta una base de datos del nivel Country. Déjela vacía para desactivar ambas funciones. La consulta es totalmente local; ninguna dirección IP se envía nunca a terceros."
COM_BFSTOP_SETTINGS_RISK_FIELDSET_LABEL="Puntuación de riesgo adaptativa"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_ENABLED_LABEL="Activar la señal de confianza de IP conocida"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_ENABLED_DESC="Si está activada, un inicio de sesión fallido se considera menos arriesgado (se permiten más intentos) cuando esa misma dirección IP ya ha iniciado sesión correctamente con exactamente ese nombre de usuario. Se aplica al par (IP, nombre de usuario) y no solo a la IP, de modo que iniciar sesión con un usuario no puede reducir la puntuación de riesgo de los intentos contra otro nombre de usuario desde la misma IP."
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_POINTS_LABEL="Puntos de confianza de IP conocida"
COM_BFSTOP_SETTINGS_RISK_KNOWNIP_POINTS_DESC="Cuántos puntos de riesgo se restan (es decir, cuánta más confianza se concede al intento) cuando se cumple la señal de IP conocida."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_ENABLED_LABEL="Activar la señal de nombre de usuario común"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_ENABLED_DESC="Si está activada, un inicio de sesión fallido se considera más arriesgado (se permiten menos intentos) cuando el nombre de usuario utilizado coincide con uno de los nombres comunes o de alto valor indicados abajo."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_LIST_LABEL="Nombres de usuario comunes"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_LIST_DESC="Un nombre de usuario por línea (sin distinguir mayúsculas de minúsculas). Los intentos contra cualquiera de estos nombres se consideran más arriesgados."
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_POINTS_LABEL="Puntos por nombre de usuario común"
COM_BFSTOP_SETTINGS_RISK_COMMONUSER_POINTS_DESC="Cuántos puntos de riesgo se suman cuando el nombre de usuario utilizado coincide con la lista de nombres comunes."
COM_BFSTOP_SETTINGS_RISK_USERAGENT_ENABLED_LABEL="Activar la señal de User-Agent ausente"
COM_BFSTOP_SETTINGS_RISK_USERAGENT_ENABLED_DESC="Si está activada, un inicio de sesión fallido sin cabecera User-Agent del navegador (o con ella vacía) se considera más arriesgado: los navegadores reales siempre la envían, pero muchos scripts de acceso automático poco sofisticados no se molestan en establecerla."
COM_BFSTOP_SETTINGS_RISK_USERAGENT_POINTS_LABEL="Puntos por User-Agent ausente"
COM_BFSTOP_SETTINGS_RISK_USERAGENT_POINTS_DESC="Cuántos puntos de riesgo se suman cuando la solicitud no tiene cabecera User-Agent."
COM_BFSTOP_SETTINGS_RISK_GEO_ENABLED_LABEL="Activar la señal GeoIP"
COM_BFSTOP_SETTINGS_RISK_GEO_ENABLED_DESC="Si está activada, un inicio de sesión fallido se considera más arriesgado cuando el país de la IP atacante (consultado en la base de datos GeoIP configurada arriba) no es uno de los países de origen configurados. Requiere que se haya configurado la ruta de la base de datos GeoIP; en caso contrario no hace nada."
COM_BFSTOP_SETTINGS_RISK_GEO_HOME_COUNTRIES_LABEL="Países de origen"
COM_BFSTOP_SETTINGS_RISK_GEO_HOME_COUNTRIES_DESC="Lista separada por comas de códigos de país ISO 3166-1 alfa-2 (por ejemplo «AT,DE,CH») que se consideran la región esperada o habitual de su sitio. Un intento desde cualquier otro país suma puntos de riesgo."
COM_BFSTOP_SETTINGS_RISK_GEO_POINTS_LABEL="Puntos geográficos"
COM_BFSTOP_SETTINGS_RISK_GEO_POINTS_DESC="Cuántos puntos de riesgo se suman cuando el país de la IP atacante no está en la lista de países de origen."
COM_BFSTOP_SETTINGS_RISK_RDNS_ENABLED_LABEL="Activar la señal de DNS inverso"
COM_BFSTOP_SETTINGS_RISK_RDNS_ENABLED_DESC="Si está activada, un inicio de sesión fallido desde una dirección IP sin registro DNS inverso (PTR) se considera más arriesgado. Advertencia: esto realiza una consulta DNS real, que puede ser lenta o agotar el tiempo de espera ocasionalmente; los resultados se guardan en caché una semana por IP para limitar la frecuencia, pero déjelo desactivado a menos que comprenda el equilibrio con la latencia."
COM_BFSTOP_SETTINGS_RISK_RDNS_POINTS_LABEL="Puntos de DNS inverso"
COM_BFSTOP_SETTINGS_RISK_RDNS_POINTS_DESC="Cuántos puntos de riesgo se suman cuando la IP atacante no tiene registro DNS inverso (PTR)."
COM_BFSTOP_SETTINGS_PROGRESSIVE_BLOCK_DURATION_LABEL="Duración progresiva del bloqueo"
COM_BFSTOP_SETTINGS_PROGRESSIVE_BLOCK_DURATION_DESC="Si está activada, cada vez que la misma dirección IP vuelve a ser bloqueada, la duración del bloqueo se duplica respecto al bloqueo anterior (hasta un máximo de 64 veces), en lugar de usar siempre la misma duración fija. Sigue estando limitada por el paso a bloqueo permanente configurado más abajo."
COM_BFSTOP_SETTINGS_BLOCK_MODE_LABEL="Modo de bloqueo"
COM_BFSTOP_SETTINGS_BLOCK_MODE_DESC="Qué ocurre cuando se bloquea una dirección IP. «Solo informes» nunca restringe nada: los intentos fallidos se siguen registrando, pero no se bloquea ninguna IP, así que úselo para observar la actividad antes de aplicar nada. «Solo inicio de sesión» deja que la IP siga navegando con normalidad por el sitio (incluido ver el formulario de acceso) y solo rechaza el propio intento de inicio de sesión; se parece más al comportamiento habitual de un limitador de intentos de acceso y molesta menos a un usuario legítimo que simplemente ha escrito mal su contraseña. «Todo el sitio» deniega todas las solicitudes de la dirección IP bloqueada y muestra el mensaje configurado más abajo. «Todo el sitio + .htaccess» hace lo mismo y además añade la IP a .htaccess para que el propio servidor web la deniegue antes de que Joomla (y este plugin) llegue a ver la solicitud; esto también significa que una IP bloqueada así no se puede limitar solo al inicio de sesión, por lo que no se ofrece junto con «Solo inicio de sesión». Se aplica a todos los bloqueos, tanto los creados automáticamente como los añadidos manualmente en la lista de bloqueos."
COM_BFSTOP_SETTINGS_BLOCK_MODE_OFF="Solo informes"
COM_BFSTOP_SETTINGS_BLOCK_MODE_LOGINONLY="Solo inicio de sesión"
COM_BFSTOP_SETTINGS_BLOCK_MODE_FULL="Todo el sitio"
COM_BFSTOP_SETTINGS_BLOCK_MODE_HTACCESS="Todo el sitio + .htaccess"
COM_BFSTOP_SETTINGS_RISK_DELAY_PER_POINT_LABEL="Segundos de retardo por punto de riesgo"
COM_BFSTOP_SETTINGS_RISK_DELAY_PER_POINT_DESC="Cuántos segundos de retardo adicional se añaden por cada punto positivo (de riesgo) de la puntuación de riesgo combinada, además del retardo configurado arriba. Una puntuación negativa (de confianza) nunca reduce el retardo por debajo del configurado arriba."
COM_BFSTOP_SETTINGS_RISK_BLOCK_REDUCTION_PER_POINT_LABEL="Cambio del umbral de bloqueo por punto de riesgo"
COM_BFSTOP_SETTINGS_RISK_BLOCK_REDUCTION_PER_POINT_DESC="Cuánto se reduce (con una puntuación positiva o de riesgo) o se aumenta (con una puntuación negativa o de confianza) el número de intentos fallidos permitidos antes del bloqueo, por cada punto de la puntuación de riesgo combinada."
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_LABEL="Mínimo de intentos permitidos"
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_DESC="Un límite inferior estricto para el número de intentos fallidos permitidos ajustado por riesgo, de modo que una puntuación de riesgo extrema nunca pueda reducirlo a cero (o menos) y bloquear en la práctica ya en el primer intento."
COM_BFSTOP_FAILEDLOGIN_AUTOPURGE_ENABLED="Las entradas de inicios de sesión fallidos con más de %d semanas se eliminan automáticamente. Puede cambiarlo con el ajuste «Depurar intentos antiguos» de la pestaña «Avanzado» de los <a href=\"%s\">Ajustes</a>."
COM_BFSTOP_FAILEDLOGIN_AUTOPURGE_DISABLED="Actualmente las entradas antiguas de inicios de sesión fallidos no se eliminan automáticamente. Para activarlo, configure «Depurar intentos antiguos» en la pestaña «Avanzado» de los <a href=\"%s\">Ajustes</a>, o use el botón «Eliminar entradas antiguas» para limpiarlas manualmente."
COM_BFSTOP_BLOCKLIST_AUTOPURGE_ENABLED="Los bloqueos caducados (y sus registros de desbloqueo) que terminaron hace más de %d semanas se eliminan automáticamente. Puede cambiarlo con el ajuste «Depurar intentos antiguos» de la pestaña «Avanzado» de los <a href=\"%s\">Ajustes</a>. Los bloqueos permanentes nunca se eliminan automáticamente."
COM_BFSTOP_BLOCKLIST_AUTOPURGE_DISABLED="Actualmente los bloqueos caducados no se eliminan automáticamente. Para activarlo, configure «Depurar intentos antiguos» en la pestaña «Avanzado» de los <a href=\"%s\">Ajustes</a>. Los bloqueos permanentes nunca se eliminan automáticamente."
COM_BFSTOP_FAILEDLOGIN_PURGE_BUTTON="Eliminar entradas antiguas"
COM_BFSTOP_FAILEDLOGIN_PURGE_TITLE="Eliminar entradas antiguas de inicios de sesión fallidos"
COM_BFSTOP_FAILEDLOGIN_PURGE_DESC="Todas las entradas de inicios de sesión fallidos con más del número de días indicado se eliminarán de forma permanente. Esta acción no se puede deshacer. Los bloqueos no se ven afectados."
COM_BFSTOP_FAILEDLOGIN_PURGE_AGE_LABEL="Conservar las entradas de los últimos ... días"
COM_BFSTOP_FAILEDLOGIN_PURGE_CONFIRM="Eliminar"
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED="Se han eliminado %1$d entradas de inicios de sesión fallidos con más de %2$d días."
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED_0="No había entradas de inicios de sesión fallidos con más de %2$d días."
COM_BFSTOP_FAILEDLOGIN_PURGE_N_DELETED_1="Se ha eliminado una entrada de inicios de sesión fallidos con más de %2$d días."
COM_BFSTOP_FAILEDLOGIN_PURGE_INVALID_AGE="Introduzca un número de días de al menos 1."
COM_BFSTOP_FAILEDLOGIN_PURGE_FAILED="Ha fallado la eliminación de las entradas antiguas de inicios de sesión fallidos: %s"
COM_BFSTOP_SUBMENU_USERNAMESTATS="Estadísticas de nombres de usuario"
COM_BFSTOP_HEADING_USERNAMESTATS="Brute Force Stop: Estadísticas de nombres de usuario"
COM_BFSTOP_HEADING_RANK="#"
COM_BFSTOP_HEADING_FAILED_ATTEMPTS="Inicios de sesión fallidos"
COM_BFSTOP_HEADING_FIRST_ATTEMPT="Primer intento"
COM_BFSTOP_USERNAMESTATS_INFO="Los nombres de usuario utilizados en intentos de inicio de sesión fallidos y cuántas veces se usó cada uno. Estas estadísticas se conservan independientemente de las entradas de inicios de sesión fallidos, por lo que no les afecta que se eliminen entradas antiguas; solo empiezan con la instalación de BFStop 2.0.0 (o la actualización a ella), a partir de las entradas de inicios de sesión fallidos que existían en ese momento. Haga clic en un nombre de usuario para ver sus entradas de inicios de sesión fallidos que aún se conservan."
COM_BFSTOP_USERNAMESTATS_AUTOTRIM="Se conservan como máximo %d nombres de usuario: por encima de ese número, los nombres con menos intentos se eliminan automáticamente (una vez al día). Este límite no se puede cambiar."
COM_BFSTOP_USERNAMESTATS_EXISTING_ACCOUNT="Cuenta existente"
COM_BFSTOP_USERNAMESTATS_EXISTING_ACCOUNT_DESC="En este sitio existe una cuenta de usuario con este nombre de usuario."
COM_BFSTOP_USERNAMESTATS_PURGE_BUTTON="Eliminar nombres de usuario obsoletos"
COM_BFSTOP_USERNAMESTATS_PURGE_TITLE="Eliminar estadísticas de nombres de usuario obsoletos"
COM_BFSTOP_USERNAMESTATS_PURGE_DESC="Las estadísticas de todos los nombres de usuario que no se han usado en un inicio de sesión fallido durante más del número de días indicado se eliminarán de forma permanente. Esta acción no se puede deshacer. Las entradas de inicios de sesión fallidos y los bloqueos no se ven afectados."
COM_BFSTOP_USERNAMESTATS_PURGE_AGE_LABEL="Eliminar nombres de usuario no vistos desde hace más de ... días"
COM_BFSTOP_USERNAMESTATS_PURGE_CONFIRM="Eliminar"
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED="Se han eliminado las estadísticas de %1$d nombres de usuario no vistos desde hace más de %2$d días."
