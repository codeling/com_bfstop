COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_LABEL="Nombres de usuario que no corresponden a una cuenta"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_DESC="Los usuarios suelen escribir su contraseña en el campo del nombre de usuario. Con «Hash», el nombre de usuario de un inicio de sesión fallido solo se guarda (y se muestra, registra y envía por correo) tal como se escribió si pertenece a una cuenta existente o está en la lista de nombres de usuario comunes; cualquier otro se sustituye por un valor ilegible que, aun así, es el mismo para la misma entrada, de modo que los intentos con él se cuentan juntos. «Guardar tal cual» mantiene legible cada nombre de usuario introducido, pero entonces también guarda las contraseñas escritas en el campo del nombre de usuario."
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_HASH="Hash (recomendado)"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_PLAIN="Guardar tal cual"
COM_BFSTOP_SETTINGS_EMAIL_INVALID="No es una dirección de correo electrónico válida: %s"
COM_BFSTOP_SETTINGS_HTACCESS_PATH_INVALID="La ruta de .htaccess debe ser un directorio existente del sistema de archivos del servidor."
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_INVALID="La ruta de la base de datos GeoIP debe ser el nombre de un archivo de base de datos de MaxMind (que termine en .mmdb) del sistema de archivos del servidor."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_LABEL="Granularidad del seguimiento de IPv6"
COM_BFSTOP_SETTINGS_IPV6_PREFIX_DESC="Un cliente con dirección IPv6 suele controlar toda una red y puede cambiar a otra dirección de ella a voluntad. Por eso, los inicios de sesión fallidos y los bloqueos de clientes IPv6 se siguen por red de este tamaño y no por dirección. /64 es el tamaño de una conexión doméstica o móvil típica. Elija una única dirección solo si sabe que los clientes de su sitio comparten su /64 con otros a los que no quiere bloquear conjuntamente."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_64="/64 (recomendado)"
COM_BFSTOP_SETTINGS_IPV6_PREFIX_128="Dirección única (/128)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_LABEL="Límite de tamaño del archivo de registro (MB)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_DESC="Cuando el archivo de registro supera este tamaño, se traslada a un segundo archivo (plg_system_bfstop.1.log.php en el directorio de registros), que sustituye al anterior. Así, los archivos de registro juntos nunca ocupan mucho más del doble de este tamaño."
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_LABEL="Conservar entradas del registro (días)"
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_DESC="Las entradas del registro con más de este número de días se eliminan automáticamente (una vez al día, aunque entretanto se desactive el registro). Use 0 para conservar las entradas hasta alcanzar el límite de tamaño."
COM_BFSTOP_LOG_AUTOPRUNE_ENABLED="Las entradas del registro con más de %1$d días se eliminan automáticamente y el archivo de registro se rota cuando supera los %2$d MB. Puede cambiarlo en la pestaña «Avanzado» de los <a href=\"%3$s\">Ajustes</a>."
COM_BFSTOP_LOG_AUTOPRUNE_DISABLED="Actualmente las entradas antiguas del registro no se eliminan por antigüedad, solo cuando el archivo de registro se rota al superar los %1$d MB. Para cambiarlo, configure «Conservar entradas del registro» en los <a href=\"%2$s\">Ajustes</a>, o use los botones «Depurar registro» y «Vaciar registro»."
COM_BFSTOP_LOG_PRUNE_BUTTON="Depurar registro"
COM_BFSTOP_LOG_PRUNE_DISABLED="Depurar requiere un periodo de conservación: configure «Conservar entradas del registro» en los <a href=\"%s\">Ajustes</a>, o vacíe el registro."
COM_BFSTOP_LOG_PRUNE_N_DELETED="Se han eliminado %1$d entradas del registro con más de %2$d días."
COM_BFSTOP_LOG_PRUNE_N_DELETED_0="No había entradas del registro con más de %2$d días."
COM_BFSTOP_LOG_PRUNE_N_DELETED_1="Se ha eliminado una entrada del registro con más de %2$d días."
COM_BFSTOP_LOG_CLEAR_BUTTON="Vaciar registro"
COM_BFSTOP_LOG_CLEAR_TITLE="Vaciar el registro"
COM_BFSTOP_LOG_CLEAR_DESC="Todas las entradas del registro se eliminarán de forma permanente, incluidas las del archivo de registro anterior. Esta acción no se puede deshacer. Los bloqueos y las entradas de inicios de sesión fallidos no se ven afectados."
COM_BFSTOP_LOG_CLEAR_CONFIRM="Vaciar"
COM_BFSTOP_LOG_CLEARED="Se ha vaciado el registro."
