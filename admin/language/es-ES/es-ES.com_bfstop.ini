COM_BFSTOP_DESC_ALLOWLIST_IPADDRESS="La dirección IP (o subred) para la que siempre se permitirá el acceso a este sitio (esto desactiva todos los bloqueos y comprobaciones realizados por el plugin). Las subredes se indican en notación de sufijo CIDR, es decir, con la forma <dirección de subred>/<bits de máscara>, por ejemplo «192.168.0.0/24»"
COM_BFSTOP_DESC_ALLOWLIST_NOTES="Introduzca la nota que desee para la entrada de la lista de permitidos, por ejemplo la fecha en que se creó o el usuario para el que se creó."
