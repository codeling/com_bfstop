name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: PHP syntax check
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' f; do
            out=$(php -l "$f" 2>&1) || { echo "$out"; status=1; }
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)
          exit $status

      - name: XML well-formedness
        if: matrix.php == '8.4'
        run: |
          sudo apt-get install -y -q libxml2-utils >/dev/null
          find . -name '*.xml' -not -path './vendor/*' -print0 | xargs -0 xmllint --noout

      - name: Language files
        if: matrix.php == '8.4'
        run: php tests/lint/check-language.php bfstop.xml COM_BFSTOP

      - name: Installable zip contains everything the manifest references
        if: matrix.php == '8.4'
        run: |
          ./deploy.sh zip
          php tests/lint/check-zip.php com_bfstop-*.zip bfstop.xml

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite unit

  integration:
    name: Integration
    needs: [lint, unit]
    # the integration test suite lives in the plugin repository and tests
    # the plugin and the component together; test this PR's component
    # against the plugin's main branch
    uses: codeling/bfstop/.github/workflows/integration.yml@main
    with:
      component_repo: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      component_ref: ${{ github.event.pull_request.head.sha || github.sha }}
