name: CI

# The tests live in the plugin repository (https://github.com/codeling/bfstop,
# see tests/README.md there); they cover plugin and component together.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Manifest, language and package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - name: XML files are well-formed
        run: |
          command -v xmllint > /dev/null || {
            sudo apt-get update -q > /dev/null
            sudo apt-get install -y -q libxml2-utils > /dev/null
          }
          find . -name '*.xml' -not -path './.git/*' -print0 | xargs -0 xmllint --noout
      - name: Actions are pinned to commit SHAs
        run: php tests/lint/check-workflows.php
      - name: Language files
        run: php tests/lint/check-language.php bfstop.xml COM_BFSTOP
      - name: Release zip contains everything the manifest references
        run: |
          ./deploy.sh zip
          php tests/lint/check-zip.php com_bfstop-*.zip bfstop.xml

  syntax:
    name: Syntax check (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

  # The Joomla!/PHP/database combinations are those of the plugin repository
  # (tests/ci/matrix.json there), so that both repositories test the same
  # combinations and the matrix is raised in one place only. The plugin branch
  # is chosen here, once, so that the matrix and the code tested come from the
  # same checkout.
  matrix:
    name: Test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      plugin-ref: ${{ steps.plugin.outputs.ref }}
    steps:
      # use the plugin's branch of the same name if there is one and it
      # has commits main hasn't (for changes spanning both), else main: a
      # branch which was merged and not deleted is a stale copy of an old main
      - name: Determine bfstop branch
        id: plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          ref=main
          ahead=none
          if [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]] \
            && git ls-remote --exit-code --heads https://github.com/codeling/bfstop.git "$branch" > /dev/null; then
            ahead="$(gh api "repos/codeling/bfstop/compare/main...$branch" --jq .ahead_by)"
            if [ "$ahead" -gt 0 ]; then
              ref="$branch"
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Using bfstop $ref (a branch '$branch' there is ahead of main by: $ahead)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: codeling/bfstop
          ref: ${{ steps.plugin.outputs.ref }}
          sparse-checkout: tests/ci
      - id: read
        run: |
          echo "matrix=$(jq -c '{include: .include}' tests/ci/matrix.json)" >> "$GITHUB_OUTPUT"

  integration:
    name: Joomla ${{ matrix.joomla }}, ${{ matrix.db }}, PHP ${{ matrix.php }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    env:
      JOOMLA_VERSION: ${{ matrix.joomla }}
      DB_HOST: 127.0.0.1
      DB_NAME: joomla
      DB_PASS: bfstop-test
    steps:
      - name: Set paths
        run: |
          {
            echo "JOOMLA_ROOT=$RUNNER_TEMP/joomla"
            echo "COM_BFSTOP_ROOT=$GITHUB_WORKSPACE"
            echo "PLUGIN_ROOT=$RUNNER_TEMP/bfstop"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: codeling/bfstop
          ref: ${{ needs.matrix.outputs.plugin-ref }}
          path: bfstop
      - name: Move bfstop checkout out of the component's
        run: mv bfstop "$PLUGIN_ROOT"

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, pgsql, pdo_pgsql, zip, mbstring, intl, gd
          tools: phpunit:11
          coverage: none

      - name: Start database (${{ matrix.db }})
        env:
          DB_IMAGE: ${{ matrix.db }}
        run: '"$PLUGIN_ROOT"/tests/ci/start-database.sh'

      - name: Install Joomla, bfstop and com_bfstop
        run: '"$PLUGIN_ROOT"/tests/ci/install-joomla.sh'

      - name: Tests
        run: phpunit -c "$PLUGIN_ROOT"/tests/phpunit.xml.dist

      - name: Plugin log
        if: failure()
        run: cat "$JOOMLA_ROOT"/administrator/logs/*.php || true
